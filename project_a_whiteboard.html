<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collaboard — Real-Time Whiteboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; color: #eee; }
#app { display: flex; flex-direction: column; height: 100vh; }
.toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: #16213e; border-bottom: 1px solid #0f3460; flex-wrap: wrap; }
.toolbar h1 { font-size: 18px; font-weight: 600; color: #e94560; margin-right: 12px; }
.tool-group { display: flex; gap: 4px; align-items: center; }
.tool-btn { background: #1a1a3e; border: 1px solid #0f3460; color: #ccc; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.15s; }
.tool-btn:hover { background: #0f3460; color: #fff; }
.tool-btn.active { background: #e94560; color: #fff; border-color: #e94560; }
.color-picker { width: 32px; height: 32px; border: 2px solid #0f3460; border-radius: 6px; cursor: pointer; background: #fff; padding: 0; }
.size-slider { width: 80px; accent-color: #e94560; }
.canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #f5f5f0; cursor: crosshair; }
#whiteboard { display: block; width: 100%; height: 100%; }
.status { font-size: 12px; color: #888; margin-left: auto; }
.status.saved { color: #4ade80; }
.remote-cursor { position: absolute; pointer-events: none; font-size: 12px; }
.remote-cursor .cursor-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.remote-cursor .cursor-label { margin-left: 4px; padding: 1px 5px; border-radius: 3px; font-size: 11px; white-space: nowrap; }
</style>
</head>
<body>
<div id="app">
  <div class="toolbar">
    <h1>🧑‍🎨 Collaboard</h1>
    <div class="tool-group">
      <button class="tool-btn active" data-tool="select">⬆ Select</button>
      <button class="tool-btn" data-tool="rect">▭ Rect</button>
      <button class="tool-btn" data-tool="circle">○ Circle</button>
      <button class="tool-btn" data-tool="text">Aa Text</button>
    </div>
    <input type="color" class="color-picker" id="colorPicker" value="#e94560">
    <input type="range" class="size-slider" id="sizeSlider" min="1" max="12" value="3">
    <button class="tool-btn" id="undoBtn">↩ Undo</button>
    <button class="tool-btn" id="clearBtn">🗑 Clear</button>
    <span class="status" id="status">Ready</span>
  </div>
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="whiteboard"></canvas>
  </div>
</div>
<script>
const canvas = document.getElementById('whiteboard');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');
const statusEl = document.getElementById('status');

let elements = [];
let selectedId = null;
let activeTool = 'select';
let color = '#e94560';
let size = 3;
let isDrawing = false;
let startX, startY;
let dragOffset = { x: 0, y: 0 };
let isDragging = false;
let textInput = null;
const remoteCursors = {};
const cursorColors = ['#e94560','#4ade80','#60a5fa','#fbbf24','#a78bfa','#f472b6'];

function resize() {
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  render();
}
window.addEventListener('resize', resize);
resize();

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f5f5f0';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Grid
  ctx.strokeStyle = '#e0e0d8';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < canvas.width; x += 30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
  for (let y = 0; y < canvas.height; y += 30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
  elements.forEach(el => drawElement(el, el.id === selectedId));
}

function drawElement(el, highlight) {
  ctx.save();
  if (highlight) { ctx.shadowColor = 'rgba(233,69,96,0.5)'; ctx.shadowBlur = 8; }
  ctx.strokeStyle = el.color; ctx.lineWidth = el.size; ctx.fillStyle = el.color;
  if (el.type === 'rect') {
    ctx.strokeRect(el.x, el.y, el.w, el.h);
    ctx.fillStyle = el.color + '22'; ctx.fillRect(el.x, el.y, el.w, el.h);
  } else if (el.type === 'circle') {
    ctx.beginPath(); ctx.arc(el.x, el.y, el.r, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = el.color + '22'; ctx.beginPath(); ctx.arc(el.x, el.y, el.r, 0, Math.PI*2); ctx.fill();
  } else if (el.type === 'text') {
    ctx.font = `${el.size*5}px sans-serif`; ctx.fillStyle = el.color; ctx.fillText(el.text, el.x, el.y);
  }
  ctx.restore();
}

function hitTest(px, py) {
  for (let i = elements.length-1; i >= 0; i--) {
    const el = elements[i];
    if (el.type === 'rect') {
      if (px >= el.x && px <= el.x+el.w && py >= el.y && py <= el.y+el.h) return el;
    } else if (el.type === 'circle') {
      const dx = px-el.x, dy = py-el.y;
      if (dx*dx+dy*dy <= el.r*el.r) return el;
    } else if (el.type === 'text') {
      ctx.font = `${el.size*5}px sans-serif`;
      const m = ctx.measureText(el.text);
      if (px >= el.x && px <= el.x+m.width && py >= el.y-el.size*5 && py <= el.y) return el;
    }
  }
  return null;
}

// Mouse events
canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (activeTool === 'select') {
    const hit = hitTest(mx, my);
    if (hit) { selectedId = hit.id; isDragging = true; dragOffset.x = mx - hit.x; dragOffset.y = my - hit.y; render(); return; }
    selectedId = null; render(); return;
  }
  isDrawing = true; startX = mx; startY = my;
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (isDragging && selectedId) {
    const el = elements.find(x => x.id === selectedId);
    if (el) { el.x = mx - dragOffset.x; el.y = my - dragOffset.y; render(); }
    return;
  }
  if (!isDrawing) return;
  if (activeTool === 'rect') {
    render();
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = size; ctx.setLineDash([5,5]);
    ctx.strokeRect(Math.min(startX,mx), Math.min(startY,my), Math.abs(mx-startX), Math.abs(my-startY));
    ctx.restore();
  } else if (activeTool === 'circle') {
    const r = Math.sqrt((mx-startX)**2 + (my-startY)**2);
    render();
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = size; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.arc(startX, startY, r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
});

canvas.addEventListener('mouseup', e => {
  if (isDragging) { isDragging = false; autoSave(); return; }
  if (!isDrawing) return;
  isDrawing = false;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (activeTool === 'rect') {
    const x = Math.min(startX,mx), y = Math.min(startY,my), w = Math.abs(mx-startX), h = Math.abs(my-startY);
    if (w > 3 && h > 3) elements.push({ id: Date.now()+'_'+Math.random(), type:'rect', x, y, w, h, color, size });
  } else if (activeTool === 'circle') {
    const r = Math.sqrt((mx-startX)**2 + (my-startY)**2);
    if (r > 3) elements.push({ id: Date.now()+'_'+Math.random(), type:'circle', x:startX, y:startY, r, color, size });
  } else if (activeTool === 'text') {
    const el = { id: Date.now()+'_'+Math.random(), type:'text', x:mx, y:my, text:'Double-click to edit', color, size };
    elements.push(el);
    setTimeout(() => editText(el), 100);
  }
  render(); autoSave();
});

// Double-click to edit text
canvas.addEventListener('dblclick', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const hit = hitTest(mx, my);
  if (hit && hit.type === 'text') editText(hit);
});

function editText(el) {
  if (textInput) textInput.remove();
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.value = el.text === 'Double-click to edit' ? '' : el.text;
  inp.style.cssText = 'position:absolute;background:transparent;border:1px dashed #e94560;color:#333;font:15px sans-serif;padding:2px;outline:none;z-index:10';
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  inp.style.left = (el.x / scaleX + rect.left - wrap.getBoundingClientRect().left) + 'px';
  inp.style.top = (el.y / scaleX - el.size*5 + rect.top - wrap.getBoundingClientRect().top) + 'px';
  inp.style.fontSize = (el.size*5) + 'px';
  wrap.appendChild(inp);
  inp.focus();
  textInput = inp;
  inp.addEventListener('blur', () => { el.text = inp.value || ' '; inp.remove(); textInput=null; render(); autoSave(); });
  inp.addEventListener('keydown', ev => { if (ev.key==='Enter') { inp.blur(); } });
}

// Toolbar
document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTool = btn.dataset.tool;
    canvas.style.cursor = activeTool === 'select' ? 'default' : 'crosshair';
  });
});
document.getElementById('colorPicker').addEventListener('input', e => { color = e.target.value; });
document.getElementById('sizeSlider').addEventListener('input', e => { size = +e.target.value; });
document.getElementById('undoBtn').addEventListener('click', () => { elements.pop(); selectedId=null; render(); autoSave(); });
document.getElementById('clearBtn').addEventListener('click', () => { if(confirm('Clear everything?')){elements=[];selectedId=null;render();autoSave();} });

// Auto-save to localStorage every 5 seconds
function autoSave() {
  try { localStorage.setItem('collaboard_data', JSON.stringify(elements));
    statusEl.textContent = '✅ Auto-saved'; statusEl.className = 'status saved';
    setTimeout(() => { statusEl.textContent = 'Ready'; statusEl.className = 'status'; }, 2000);
  } catch(e) { statusEl.textContent = '⚠ Save failed'; }
}

// Simulated remote cursors
function simulateRemoteCursors() {
  const names = ['Alice','Bob','Charlie','Diana'];
  names.forEach((name,i) => {
    if (!remoteCursors[name]) {
      const div = document.createElement('div');
      div.className = 'remote-cursor';
      div.innerHTML = `<span class="cursor-dot" style="background:${cursorColors[i%cursorColors.length]}"></span><span class="cursor-label" style="background:${cursorColors[i%cursorColors.length]}">${name}</span>`;
      wrap.appendChild(div);
      remoteCursors[name] = { el: div, x: 100+Math.random()*400, y: 100+Math.random()*300, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2 };
    }
    const c = remoteCursors[name];
    c.x += c.vx; c.y += c.vy;
    if (c.x < 0 || c.x > wrap.clientWidth-60) c.vx *= -1;
    if (c.y < 0 || c.y > wrap.clientHeight-30) c.vy *= -1;
    const rect = canvas.getBoundingClientRect();
    c.el.style.left = (c.x)+'px';
    c.el.style.top = (c.y)+'px';
  });
  requestAnimationFrame(simulateRemoteCursors);
}

// Load saved data
function loadSaved() {
  try {
    const data = localStorage.getItem('collaboard_data');
    if (data) { elements = JSON.parse(data); render(); statusEl.textContent = '📂 Restored'; }
  } catch(e) {}
}
loadSaved();

// Periodic auto-save
setInterval(autoSave, 5000);

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); document.getElementById('undoBtn').click(); }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedId && !textInput) { elements = elements.filter(el => el.id !== selectedId); selectedId=null; render(); autoSave(); }
  }
  if (e.key === 'r' && !e.ctrlKey) { document.querySelector('[data-tool="rect"]')?.click(); }
  if (e.key === 'c' && !e.ctrlKey) { document.querySelector('[data-tool="circle"]')?.click(); }
  if (e.key === 't' && !e.ctrlKey) { document.querySelector('[data-tool="text"]')?.click(); }
  if (e.key === 'v' && !e.ctrlKey) { document.querySelector('[data-tool="select"]')?.click(); }
});

// Simulate remote cursors
setTimeout(simulateRemoteCursors, 500);

console.log('✅ Collaboard ready — draw, type, and auto-save every 5s');
</script>
</body>
</html>
