<!-- Web: in-app, AI-augmented browser.
     Loaded by ui/js/partial-loader.js into #tab-web · logic: ui/js/web.js ·
     styles: ui/css/web.css · streamed from app/api/browser_stream.py.

     PILL-PANEL-LAYOUT: mirrors the Pages page (ui/pages.html). The browser
     stage fills the whole panel; the footer is an ABSOLUTE OVERLAY pinned to the
     bottom holding a browser-nav chip + the shared .chat-pill, floating over the
     full-height browser (see docs/claude/ui-guidance.md and #autoagent-footer).
     The page shares the agent's browser session, so whatever the agent does
     shows here live and the user can take over at any time. -->
<div class="web-page">

  <!-- Full-height browser stage (the live streamed page) -->
  <div class="web-stage" tabindex="0">
    <img class="web-frame" alt="" draggable="false" />
    <div class="web-empty">This is a shared browser. Type a URL in the bar below to start &mdash; the agent can see and act on this same page, and you can take over any time.</div>
  </div>

  <!-- Footer: browser-nav chip (top) + chat pill (bottom), floating overlay -->
  <div class="web-footer">

    <!-- Browser-specific controls: back / forward / reload / address / Go,
         plus the per-tab share toggle and the live-status dot. -->
    <div class="web-nav">
      <button class="web-btn" data-act="back" title="Back" aria-label="Back">&#8249;</button>
      <button class="web-btn" data-act="forward" title="Forward" aria-label="Forward">&#8250;</button>
      <button class="web-btn" data-act="reload" title="Reload" aria-label="Reload">&#8635;</button>
      <input class="web-url" type="text" spellcheck="false" autocomplete="off" placeholder="Enter a URL or search&hellip;" />
      <button class="web-btn web-go" data-act="go">Go</button>
      <button class="web-btn web-sessions-toggle" data-act="sessions" title="Switch browser session">Sessions</button>
      <button class="web-btn web-new-session" data-act="new-session" title="New browser session">+</button>
      <button class="web-btn web-share" data-act="share" aria-pressed="false"
              title="Share this tab with the agent">Private</button>
      <span class="web-status">
        <span class="web-dot" aria-hidden="true"></span>
        <span class="web-status-text">idle</span>
      </span>
      <!-- Sessions popover -->
      <div class="web-sessions-popover" style="display:none;">
        <div class="web-sessions-list"></div>
      </div>
    </div>

    <!-- CHAT-PILL-SYNC: shares .chat-pill* styles with #chat-input-row,
         #autoagent-prompt-row, #agent-builder-bar-row. Style rules live in
         ui/css/app1.css under the "Chat-pill" block. -->
    <div class="web-prompt-bar">
      <div class="web-prompt-row chat-pill">
        <button type="button" class="chat-pill-attach web-attach" title="Attach files">
          <i data-lucide="plus" style="width:18px;height:18px;"></i>
        </button>
        <textarea class="chat-pill-input web-prompt-input" rows="1"
          placeholder="Ask the agent about this page&hellip;"
          maxlength="2000" autocomplete="off"></textarea>
        <button type="button" class="chat-pill-voice web-voice" title="Record voice">
          <i data-lucide="mic" style="width:18px;height:18px;"></i>
        </button>
        <button type="button" class="chat-pill-send web-send" title="Send to the agent">
          <i data-lucide="send" style="width:16px;height:16px;"></i>
        </button>
      </div>
    </div>
  </div>
</div>
