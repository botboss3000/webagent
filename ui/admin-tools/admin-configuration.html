<template data-slot="#admin-tools">
  <main class="files-main files-settings-main" id="files-settings-main" data-view="settings" hidden></main>
</template>

<template data-slot="#main-panel">
    <div id="app-config-container" hidden>

        <!-- Header -->
        <header id="app-config-header">
          <div class="ac-page-title">App Configuration</div>
        </header>

        <!-- Tab strip with chevron-scroll carousel -->
        <div id="app-config-tabs-wrap">
          <button type="button" id="app-config-tabs-chev-left" class="ac-tabs-chev left" aria-label="Scroll tabs left">&#10094;</button>
          <div id="app-config-tabs" role="tablist">
            <button type="button" class="ac-tab" data-section="app-settings" role="tab">
              <i data-lucide="settings-2" class="lucide-icon ac-tab-icon"></i>App Settings
            </button>
            <button type="button" class="ac-tab" data-section="agent-settings" role="tab">
              <i data-lucide="bot" class="lucide-icon ac-tab-icon"></i>Agent Settings
            </button>
            <button type="button" class="ac-tab" data-section="user-management" role="tab">
              <i data-lucide="users" class="lucide-icon ac-tab-icon"></i>Users
            </button>
            <button type="button" class="ac-tab" data-section="database" role="tab">
              <i data-lucide="database" class="lucide-icon ac-tab-icon"></i>Data Management
            </button>
            <button type="button" class="ac-tab" data-section="optimizer" role="tab">
              <i data-lucide="zap" class="lucide-icon ac-tab-icon"></i>Optimizer Stats
            </button>
            <button type="button" class="ac-tab" data-section="git" role="tab">
              <i data-lucide="git-branch" class="lucide-icon ac-tab-icon"></i>Git Providers
            </button>
            <button type="button" class="ac-tab" data-section="automation" role="tab">
              <i data-lucide="clock" class="lucide-icon ac-tab-icon"></i>Automation <span class="ac-tab-count-badge" id="ac-automation-count-badge">0</span>
            </button>
            <button type="button" class="ac-tab" data-section="events" role="tab">
              <i data-lucide="radio" class="lucide-icon ac-tab-icon"></i>Event Sources
            </button>
            <button type="button" class="ac-tab" data-section="monetization" role="tab">
              <i data-lucide="credit-card" class="lucide-icon ac-tab-icon"></i>Monetization
            </button>
          </div>
          <button type="button" id="app-config-tabs-chev-right" class="ac-tabs-chev right" aria-label="Scroll tabs right">&#10095;</button>
        </div>

        <!-- Scrollable content -->
        <div id="app-config-content">

          <!-- ── Agent Settings ── -->
          <section id="ac-section-agent-settings" class="ac-section active">
            <div class="ac-section-header">
              <i data-lucide="bot" class="lucide-icon ac-section-icon"></i>
              <div>
                <h2 class="ac-section-title">Agent Settings</h2>
                <p class="ac-section-desc">Configure agent tools, integrations, channels, and provider credentials.</p>
              </div>
            </div>

            <div class="ac-field" style="margin-bottom:12px;">
              <input type="search" id="ac-int-filter" name="ac-int-filter" class="ac-input" placeholder="Search integrations…" autocomplete="off" data-lpignore="true" data-1p-ignore="true">
              <div id="ac-int-filter-empty" class="ac-hint" style="display:none;margin-top:6px;">No integrations match your search.</div>
            </div>

            <!-- Integration Admin Chat -->
            <div id="ac-int-admin-chat-card" style="margin-bottom:16px;">
              <div class="ac-label" style="margin-bottom:6px;">Use AI to create or customize an existing integration</div>
              <div id="ac-int-admin-chat-messages" style="max-height:280px;overflow-y:auto;display:none;border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:8px;font-size:13px;"></div>
              <div id="ac-int-admin-preview-bar" class="chat-preview-bar-mini" style="display:none;gap:6px;flex-wrap:wrap;margin-bottom:6px;"></div>
              <!-- CHAT-PILL-SYNC: see ui/css/app1.css ".chat-pill" block. No
                   attach/voice; .no-voice keeps the send button always visible. -->
              <div id="ac-int-admin-chat-input-row" class="chat-pill no-voice">
                <textarea id="ac-int-admin-chat-input" class="chat-pill-input" rows="1" placeholder="e.g. Create a Slack integration with send_message and list_channels tools" autocomplete="off"></textarea>
                <button id="ac-int-admin-chat-send" class="chat-pill-send" title="Send message" disabled><i data-lucide="send" style="width:18px;height:18px;"></i></button>
              </div>
              <div id="ac-int-admin-chat-error" class="ac-hint" style="display:none;margin-top:6px;color:#f7768e;"></div>
            </div>

            <!-- ── Models (collapsible, collapsed by default) ── -->
            <details class="ac-category-group" id="ac-cat-models">
              <summary class="ac-category-summary">
                <span class="ac-category-chevron">▶</span>
                <i data-lucide="bot" class="lucide-icon" style="width:16px;height:16px;color:#7aa2f7;"></i>
                <span class="ac-category-title">Models</span>
              </summary>
              <div class="ac-category-body">
                <p class="ac-category-desc">Add the models your agents use and tick what each one is for — answering (Text), reading images (Image-in), or creating images (Image-out). Capabilities are auto-detected.</p>
                <div class="ac-card">
                  <div class="ac-field">
                    <label class="ac-label">Provider</label>
                    <select id="ac-settings-provider" class="ac-input"></select>
                  </div>
                  <div class="ac-field">
                    <label class="ac-label">Base URL</label>
                    <input type="text" id="ac-settings-base-url" class="ac-input" placeholder="https://openrouter.ai/api/v1" autocomplete="off">
                    <div class="ac-hint">Auto-filled when you pick a provider. Edit for custom endpoints.</div>
                  </div>
                  <div class="ac-field">
                    <label class="ac-label">API Key</label>
                    <input type="text" id="ac-settings-api-key" class="ac-input" placeholder="sk-..." autocomplete="off">
                    <div class="ac-hint">Stored on this device only. Never sent elsewhere.</div>
                  </div>
                  <div class="ac-field" id="ac-settings-model-group">
                    <label class="ac-label">Model</label>
                    <div style="position:relative;">
                      <input type="text" id="ac-settings-model-search" class="ac-input" placeholder="Search models…" autocomplete="off">
                      <div id="ac-settings-model-dropdown" class="ac-model-dropdown" style="display:none;"></div>
                    </div>
                    <div id="ac-settings-model-status" class="ac-hint"></div>
                  </div>
                  <div class="ac-field" id="ac-settings-cap-group">
                    <label class="ac-label">Capabilities</label>
                    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;">
                      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);cursor:pointer;">
                        <input type="checkbox" id="ac-settings-cap-text" checked style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer;">
                        Text
                      </label>
                      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);cursor:pointer;">
                        <input type="checkbox" id="ac-settings-cap-image" style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer;">
                        Image-in (vision)
                      </label>
                      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);cursor:pointer;">
                        <input type="checkbox" id="ac-settings-cap-image-out" style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer;">
                        Image-out (generate)
                      </label>
                    </div>
                    <div class="ac-hint">Auto-detected when you pick a model. <strong>Image-in</strong> = can read attached images; <strong>Image-out</strong> = can create images. Override if detection is wrong.</div>
                  </div>
                  <div class="ac-actions">
                    <button id="ac-settings-save" class="ac-btn ac-btn-primary">Save</button>
                    <button id="ac-settings-clear" class="ac-btn ac-btn-ghost">Clear</button>
                    <span id="ac-settings-status" class="ac-status" style="display:none;"></span>
                  </div>

                  <!-- Saved models — same panel as the chooser above -->
                  <div id="ac-settings-saved-wrap" style="display:none;border-top:1px solid var(--border-soft);margin-top:16px;padding-top:14px;">
                    <div class="ac-card-label">Saved Models</div>
                    <div class="ac-card-sublabel">Tick how to use each model. Two or more ticked for <strong>Text</strong> race in parallel — fastest response wins.</div>
                    <div id="ac-settings-saved-list" style="margin-top:12px;"></div>
                    <div id="ac-settings-parallel-count" class="ac-hint" style="margin-top:6px;text-align:right;"></div>
                    <div id="ac-settings-describer-hint" class="ac-hint" style="margin-top:4px;"></div>
                    <div id="ac-settings-imagegen-hint" class="ac-hint" style="margin-top:2px;"></div>
                  </div>
                </div>
              </div>
            </details>

            <!-- ── Agent Tools (collapsible, collapsed by default) ── -->
            <details class="ac-category-group" id="ac-cat-agent-tools">
              <summary class="ac-category-summary">
                <span class="ac-category-chevron">▶</span>
                <i data-lucide="wrench" class="lucide-icon" style="width:16px;height:16px;color:#bb9af7;"></i>
                <span class="ac-category-title">Agent Tools</span>
                <span class="ac-category-count" id="ac-cat-agent-tools-count"></span>
              </summary>
              <div class="ac-category-body">
                <p class="ac-category-desc">Privileged capabilities for editing the running app. Enable here, then turn on per agent from the agent's <strong>Abilities</strong> tab.</p>

                <!-- Agent Tools — compact row layout with toggle -->
                <div class="ac-abilities-compact" id="ac-abilities-compact">
                  <!-- Each ability is a single row with icon, name, desc, toggle.
                       Simple abilities toggle directly. Complex abilities (need config)
                       expand to show a config panel when toggled. -->
                </div>
                <span id="ac-abilities-compact-status" class="ac-status" style="display:none;"></span>

                <!-- ── Complex ability config panels (hidden by default, shown on expand) ── -->
                <div id="ac-ability-config-panels" style="margin-top:8px;display:flex;flex-direction:column;gap:8px;">

                  <!-- Image Generation config -->
                  <div class="ac-card" id="ac-int-image_generation-card" style="display:none;">
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                      <i data-lucide="image" class="lucide-icon" style="width:20px;height:20px;flex-shrink:0;color:#bb9af7;"></i>
                      <div style="flex:1;">
                        <div style="font-weight:600;font-size:13px;">Image Generation — Configuration</div>
                        <div class="ac-hint" style="margin:0;">Configure a provider + model for image generation before enabling the toggle above.</div>
                      </div>
                    </div>
                    <div id="ac-int-image_generation-configured" style="display:none;font-size:12px;">
                      <div class="ac-hint" style="margin:0;">Image Generation is available on the agent's <strong>Abilities</strong> tab.</div>
                      <div style="margin-top:12px;display:flex;gap:8px;">
                        <button id="ac-int-image_generation-unconfigure" class="ac-btn ac-btn-ghost" style="color:#f7768e;">Disable</button>
                      </div>
                    </div>
                    <div id="ac-int-image_generation-form" style="display:block;">
                      <div class="ac-hint" style="margin:0 0 10px;">Enabling exposes Image Generation as a toggle to agent admins. The agent's <code>generate_image</code> tool uses whichever provider you configured under Image Generation.</div>
                      <button id="ac-int-image_generation-save" class="ac-btn ac-btn-primary">Enable Image Generation</button>
                    </div>
                    <span id="ac-int-image_generation-status" class="ac-status" style="display:none;margin-top:8px;"></span>
                  </div>

                  <!-- Automation config -->
                  <div class="ac-card" id="ac-int-automation-card" style="display:none;">
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                      <i data-lucide="clock" class="lucide-icon" style="width:20px;height:20px;flex-shrink:0;color:#e0af68;"></i>
                      <div style="flex:1;">
                        <div style="font-weight:600;font-size:13px;">Automation — Configuration</div>
                        <div class="ac-hint" style="margin:0;">Configure automation settings before enabling the toggle above.</div>
                      </div>
                    </div>
                    <div id="ac-int-automation-configured" style="display:none;font-size:12px;">
                      <div class="ac-hint" style="margin:0;">Automation is available on each agent's <strong>Abilities</strong> tab.</div>
                      <div class="ac-hint" style="margin:8px 0 0;color:#f7768e;"><strong>Warning:</strong> Disabling will permanently delete every agent's scheduled tasks and event subscriptions.</div>
                      <div style="margin-top:12px;display:flex;gap:8px;">
                        <button id="ac-int-automation-unconfigure" class="ac-btn ac-btn-ghost" style="color:#f7768e;">Disable</button>
                      </div>
                    </div>
                    <div id="ac-int-automation-form" style="display:block;">
                      <div class="ac-hint" style="margin:0 0 10px;">Enabling exposes Automation as a per-agent toggle. Agents with the toggle off see no Automation tab.</div>
                      <button id="ac-int-automation-save" class="ac-btn ac-btn-primary">Enable Automation</button>
                    </div>
                    <span id="ac-int-automation-status" class="ac-status" style="display:none;margin-top:8px;"></span>
                  </div>

                  <!-- Visualizer config -->
                  <div class="ac-card" id="ac-int-visualizer-card" style="display:none;">
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                      <i data-lucide="layout" class="lucide-icon" style="width:20px;height:20px;flex-shrink:0;color:#7aa2f7;"></i>
                      <div style="flex:1;">
                        <div style="font-weight:600;font-size:13px;">Visualizer — Configuration</div>
                        <div class="ac-hint" style="margin:0;">Configure visualizer settings before enabling the toggle above.</div>
                      </div>
                    </div>
                    <div id="ac-int-visualizer-configured" style="display:none;font-size:12px;">
                      <div class="ac-hint" style="margin:0;">Visualizer is available on the agent's <strong>Abilities</strong> tab.</div>
                      <div style="margin-top:12px;display:flex;gap:8px;">
                        <button id="ac-int-visualizer-unconfigure" class="ac-btn ac-btn-ghost" style="color:#f7768e;">Disable</button>
                      </div>
                    </div>
                    <div id="ac-int-visualizer-form" style="display:block;">
                      <div class="ac-hint" style="margin:0 0 10px;">Enabling exposes Visualizer as a per-agent toggle. With the toggle off, an agent cannot see <code>render_visual</code>, <code>create_page</code>, or any other page-authoring tool.</div>
                      <button id="ac-int-visualizer-save" class="ac-btn ac-btn-primary">Enable Visualizer</button>
                    </div>
                    <span id="ac-int-visualizer-status" class="ac-status" style="display:none;margin-top:8px;"></span>
                  </div>

                </div>
              </div>
            </details>

            <!-- ── Channels (collapsible, collapsed by default) ── -->
            <details class="ac-category-group" id="ac-cat-channels">
              <summary class="ac-category-summary">
                <span class="ac-category-chevron">▶</span>
                <i data-lucide="message-square" class="lucide-icon" style="width:16px;height:16px;color:#26A5E4;"></i>
                <span class="ac-category-title">Channels</span>
                <span class="ac-category-count" id="ac-cat-channels-count"></span>
              </summary>
              <div class="ac-category-body">
                <p class="ac-category-desc">How agents send and receive messages. Enable a channel here to make it available to your agents.</p>

                <!-- Telegram Channel -->
            <div class="ac-card" id="ac-int-telegram-card">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                <svg viewBox="0 0 24 24" width="24" height="24" style="flex-shrink:0;">
                  <path fill="#26A5E4" d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24zm5.57 8.16-1.86 8.76c-.14.62-.51.77-1.03.48l-2.85-2.1-1.37 1.32a.71.71 0 0 1-.57.28l.2-2.9 5.27-4.76c.23-.2-.05-.32-.36-.12l-6.5 4.1-2.8-.88c-.61-.19-.62-.61.13-.9l10.94-4.22c.5-.18.95.12.79.9z"/>
                </svg>
                <div style="flex:1;">
                  <div style="font-weight:600;font-size:14px;">Telegram</div>
                  <div class="ac-hint" style="margin:0;">Let agents accept messages from their own Telegram bots. Each agent supplies its own bot token.</div>
                </div>
                <span id="ac-int-telegram-badge" class="ac-int-badge ac-int-badge-off">Disabled</span>
              </div>

              <div id="ac-int-telegram-configured" style="display:none;font-size:12px;">
                <div class="ac-hint" style="margin:0;">Telegram is available on the agent's <strong>Abilities</strong> tab. Each agent enters its own bot token there.</div>
                <div style="margin-top:12px;display:flex;gap:8px;">
                  <button id="ac-int-telegram-unconfigure" class="ac-btn ac-btn-ghost" style="color:#f7768e;">Disable</button>
                </div>
              </div>

              <div id="ac-int-telegram-form" style="display:block;">
                <div class="ac-hint" style="margin:0 0 10px;">No app-level credentials needed. Enabling Telegram exposes it as a channel option to agent admins.</div>
                <button id="ac-int-telegram-save" class="ac-btn ac-btn-primary">Enable Telegram</button>
              </div>
              <span id="ac-int-telegram-status" class="ac-status" style="display:none;margin-top:8px;"></span>
            </div>

            <!-- WhatsApp Channel (coming soon) -->
            <div class="ac-card ac-int-coming-soon" id="ac-int-whatsapp-card">
              <div style="display:flex;align-items:center;gap:12px;">
                <svg viewBox="0 0 24 24" width="24" height="24" style="flex-shrink:0;">
                  <path fill="#25D366" d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.8-.7-1.4-1.7-1.5-1.9-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.6-.9-2.2-.2-.5-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4 0 1.4 1 2.8 1.1 3 .1.2 2 3 4.8 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.5-.3zM12 2C6.5 2 2 6.5 2 12c0 1.7.4 3.4 1.3 4.9L2 22l5.3-1.3c1.4.8 3.1 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18c-1.5 0-3-.4-4.3-1.2l-.3-.2-3.2.8.8-3.1-.2-.3C3.9 14.7 3.5 13.4 3.5 12c0-4.7 3.8-8.5 8.5-8.5s8.5 3.8 8.5 8.5-3.8 8.5-8.5 8.5z"/>
                </svg>
                <div style="flex:1;">
                  <div style="font-weight:600;font-size:14px;">WhatsApp</div>
                  <div class="ac-hint" style="margin:0;">WhatsApp Business messaging via Meta or Twilio.</div>
                </div>
                <span class="ac-int-badge ac-int-badge-soon">Coming soon</span>
              </div>
            </div>

            <!-- Slack Channel (coming soon) -->
            <div class="ac-card ac-int-coming-soon" id="ac-int-slack-card">
              <div style="display:flex;align-items:center;gap:12px;">
                <svg viewBox="0 0 24 24" width="24" height="24" style="flex-shrink:0;">
                  <path fill="#E01E5A" d="M5 15a2 2 0 1 1-2-2h2v2zm1 0a2 2 0 1 1 4 0v5a2 2 0 1 1-4 0v-5z"/>
                  <path fill="#36C5F0" d="M9 5a2 2 0 1 1 2-2v2H9zm0 1a2 2 0 1 1 0 4H4a2 2 0 1 1 0-4h5z"/>
                  <path fill="#2EB67D" d="M19 9a2 2 0 1 1 2 2h-2V9zm-1 0a2 2 0 1 1-4 0V4a2 2 0 1 1 4 0v5z"/>
                  <path fill="#ECB22E" d="M15 19a2 2 0 1 1-2 2v-2h2zm0-1a2 2 0 1 1 0-4h5a2 2 0 1 1 0 4h-5z"/>
                </svg>
                <div style="flex:1;">
                  <div style="font-weight:600;font-size:14px;">Slack</div>
                  <div class="ac-hint" style="margin:0;">Slack bot for channels and DMs in your workspace.</div>
                </div>
                <span class="ac-int-badge ac-int-badge-soon">Coming soon</span>
              </div>
            </div>

            <!-- Discord Channel (coming soon) -->
            <div class="ac-card ac-int-coming-soon" id="ac-int-discord-card">
              <div style="display:flex;align-items:center;gap:12px;">
                <svg viewBox="0 0 24 24" width="24" height="24" style="flex-shrink:0;">
                  <path fill="#5865F2" d="M20.3 4.4a18.6 18.6 0 0 0-4.6-1.4l-.2.4a17 17 0 0 0-5 0L10.3 3a18.6 18.6 0 0 0-4.6 1.4A19 19 0 0 0 2.4 15a18.7 18.7 0 0 0 5.7 2.9l.5-.7a13 13 0 0 1-2-1c.2-.1.4-.2.5-.4a13.3 13.3 0 0 0 11.7 0c.1.2.3.3.5.4a13 13 0 0 1-2 1l.5.7A18.7 18.7 0 0 0 23.6 15a19 19 0 0 0-3.3-10.6zM8.5 13c-1.1 0-2-1-2-2.3 0-1.3.9-2.4 2-2.4s2 1.1 2 2.4c0 1.3-.9 2.3-2 2.3zm7 0c-1.1 0-2-1-2-2.3 0-1.3.9-2.4 2-2.4s2 1.1 2 2.4c0 1.3-.9 2.3-2 2.3z"/>
                </svg>
                <div style="flex:1;">
                  <div style="font-weight:600;font-size:14px;">Discord</div>
                  <div class="ac-hint" style="margin:0;">Discord bot for server channels and DMs.</div>
                </div>
                <span class="ac-int-badge ac-int-badge-soon">Coming soon</span>
              </div>
            </div>

            <!-- Email Channel (coming soon) -->
            <div class="ac-card ac-int-coming-soon" id="ac-int-email-card">
              <div style="display:flex;align-items:center;gap:12px;">
                <svg viewBox="0 0 24 24" width="24" height="24" style="flex-shrink:0;">
                  <path fill="#7aa2f7" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                <div style="flex:1;">
                  <div style="font-weight:600;font-size:14px;">Email</div>
                  <div class="ac-hint" style="margin:0;">Inbound and outbound email via SMTP / IMAP or a hosted provider.</div>
                </div>
                <span class="ac-int-badge ac-int-badge-soon">Coming soon</span>
              </div>
            </div>

            <!-- Twilio SMS / Voice (coming soon) -->
            <div class="ac-card ac-int-coming-soon" id="ac-int-twilio-card">
              <div style="display:flex;align-items:center;gap:12px;">
                <svg viewBox="0 0 24 24" width="24" height="24" style="flex-shrink:0;">

              <i data-lucide="settings-2" class="lucide-icon ac-section-icon"></i>
              <div>
                <h2 class="ac-section-title">App Settings</h2>
                <p class="ac-section-desc">Global behavior toggles for this application.</p>
              </div>
            </div>
            <!-- ════════════════════════════════════════════════════════════════
                 COLLAPSIBLE SECTION PATTERN — SHARED ACROSS ADMIN CONFIG PAGES
                 Each setting group is a `<details class="ac-category-group">`:
                 a plain text heading (chevron + icon + title), collapsed by
                 default, that opens to reveal ONE full-width `.ac-card` of
                 options. NOT a card-within-a-card. The same pattern is used by
                 Agent Settings (the Agent Tools / Channels / Providers groups).
                 STYLING IS SYNCED: the look lives in `.ac-category-group` /
                 `.ac-category-summary` / `.ac-category-body` in ui/css/app3.css.
                 If you restyle one page's groups, update the shared CSS so every
                 page (App Settings, Agent Settings, and future pages) stays in
                 sync — do NOT fork per-page styles.
                 ════════════════════════════════════════════════════════════════ -->
            <details class="ac-category-group">
              <summary class="ac-category-summary">
                <span class="ac-category-chevron">▶</span>
                <i data-lucide="cpu" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
                <span class="ac-category-title">Agent LLM Defaults</span>
              </summary>
              <div class="ac-category-body">
                <div class="ac-card">
                  <div class="ac-field">
                    <label class="ac-label" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                      <input type="checkbox" id="ac-extend-llm-to-agents" checked style="width:15px;height:15px;accent-color:#7aa2f7;cursor:pointer;">
                      Extend default LLM to agents
                    </label>
                    <div class="ac-hint">When enabled, agents can select "Use app default" for their LLM. When disabled, each agent must configure its own LLM.</div>
                    <div style="margin-top:10px;padding:10px 12px;background:rgba(224,175,104,0.12);border:1px solid rgba(224,175,104,0.4);border-radius:6px;color:#e0af68;font-size:13px;line-height:1.5;">
                      <strong>Warning:</strong> Any agents currently configured to use the app default LLM will have their LLM disconnected. They will stop working until an admin assigns them a custom LLM.
                    </div>
                  </div>
                  <div class="ac-actions">
                    <button id="ac-app-settings-save" class="ac-btn ac-btn-primary">Save</button>
                    <span id="ac-app-settings-status" class="ac-status" style="display:none;"></span>
                  </div>
                </div>
              </div>
            </details>

            <!-- ── Main Panel Pages (tab visibility + order) — shared collapsible pattern ── -->
            <details class="ac-category-group" id="ac-main-panel-card">
              <summary class="ac-category-summary">
                <span class="ac-category-chevron">▶</span>
                <i data-lucide="layout" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
                <span class="ac-category-title">Main Panel Pages</span>
                <span class="ac-category-count">Drag to reorder, toggle visibility</span>
              </summary>
              <div class="ac-category-body">
                <div class="ac-card">
                  <div class="ac-hint">
                    Choose which pages appear in the header and in what order. Admin Tools is always visible.
                  </div>
                  <div id="ac-main-panel-list" class="ac-main-panel-list" style="margin-top:10px;display:flex;flex-direction:column;gap:4px;"></div>
                </div>
              </div>
            </details>

            <!-- ── Startup & Boot — shared collapsible pattern ── -->
            <details class="ac-category-group">
              <summary class="ac-category-summary">
                <span class="ac-category-chevron">▶</span>
                <i data-lucide="power" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
                <span class="ac-category-title">Startup &amp; Boot</span>
              </summary>
              <div class="ac-category-body">
                <div class="ac-card">
                  <div class="ac-field">
                    <label class="ac-label" for="ac-boot-animation">Boot animation</label>
                    <select id="ac-boot-animation" class="ac-input">
                      <option value="chat-slide-right">Chat slides right, page reveals on left</option>
                      <option value="page-slide-in">Page slides in from the right</option>
                      <option value="crossfade">Crossfade</option>
                    </select>
                    <div class="ac-hint">Picks how the chat shrinks and the saved page appears when the app first loads. Saved per browser; applied on the next reload.</div>
                  </div>
                  <div class="ac-field" style="margin-top:14px;">
                    <label class="ac-label" for="ac-boot-mobile-mode">Mobile boot</label>
                    <select id="ac-boot-mobile-mode" class="ac-input">
                      <option value="chat-first">Always start with chat full-screen</option>
                      <option value="memory">Remember last view (chat or page)</option>
                    </select>
                    <div class="ac-hint">Mobile only. "Always" forces the chat-first boot then animates to the saved view. "Remember" skips the animation and goes straight to whichever panel you had open last.</div>
                  </div>
                </div>
              </div>
            </details>

            <!-- ── Remote Access (reach this server from a phone / other device) — shared collapsible pattern ── -->
            <details class="ac-category-group" id="ac-ra-card">
              <summary class="ac-category-summary">
                <span class="ac-category-chevron">▶</span>
                <i data-lucide="radio-tower" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
                <span class="ac-category-title">Remote Access</span>
                <span id="ac-ra-active-badge" class="ac-category-count">loading…</span>
              </summary>
              <div class="ac-category-body">
                <div class="ac-card">

              <div class="ac-hint" style="margin-top:8px;">
                Reach this server from your phone or another device. The same-network address always works on your Wi-Fi; pick a method below to reach it from anywhere.
              </div>

              <div id="ac-ra-env-banner" class="ac-info-banner" hidden style="margin-top:10px;border-left-color:var(--warning);color:var(--warning);font-size:11px;">
                Config is env-locked (WEBAGENT_CONFIG_SOURCE=env). Settings can be viewed but not changed here.
              </div>

              <div class="ac-info-banner" style="margin-top:10px;border-left-color:var(--danger);color:var(--danger);font-size:11px;line-height:1.5;">
                <strong>Security:</strong> exposing this machine also exposes its admin shell/file tools. Keep sign-in on and admin tools admin-only. Prefer Tailscale (private) when you don't need a public link.
              </div>

              <!-- Same network -->
              <div style="margin-top:14px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-elev);">
                <div class="ac-label" style="display:flex;align-items:center;gap:6px;margin:0;">
                  <i data-lucide="wifi" class="lucide-icon" style="width:14px;height:14px;color:var(--success);"></i>
                  Same network (Wi-Fi)
                </div>
                <div class="ac-hint" style="margin-top:4px;">On a device on the same Wi-Fi, open this address. No setup needed. (Plain http — secure-context features like Google sign-in need a tunnel.)</div>
                <div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;">
                  <code id="ac-ra-sn-url" style="font-size:13px;padding:4px 8px;background:var(--bg-0);border:1px solid var(--border);border-radius:6px;color:var(--fg-1);">&mdash;</code>
                  <button id="ac-ra-sn-copy" class="ac-btn" type="button">Copy</button>
                </div>
                <div id="ac-ra-sn-qr" class="ac-ra-qr" style="margin-top:10px;display:none;"></div>
                <div id="ac-ra-sn-others" class="ac-hint" style="margin-top:8px;font-size:11px;"></div>
              </div>

              <!-- Remote method -->
              <label class="ac-label" style="margin-top:14px;">Remote method (reach it from anywhere)</label>
              <select id="ac-ra-method" class="ac-input">
                <option value="same_network">Same network only (no remote tunnel)</option>
                <option value="ngrok">ngrok &mdash; app-managed tunnel</option>
                <option value="cloudflare">Cloudflare &mdash; named tunnel on your domain</option>
                <option value="tailscale">Tailscale &mdash; private mesh</option>
                <option value="manual">Port-forward &mdash; manual</option>
              </select>
              <div id="ac-ra-blurb" class="ac-hint" style="margin-top:6px;line-height:1.5;"></div>
              <div id="ac-ra-fields" style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;"></div>

              <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center;">
                <button id="ac-ra-start" class="ac-btn ac-btn-primary" type="button">Start</button>
                <button id="ac-ra-stop" class="ac-btn" type="button">Stop</button>
                <button id="ac-ra-test" class="ac-btn" type="button">Test</button>
                <button id="ac-ra-save-cfg" class="ac-btn" type="button">Save Settings</button>
                <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;">
                  <input type="checkbox" id="ac-ra-autostart"> Start on boot
                </label>
                <span id="ac-ra-status" class="ac-hint" style="margin-left:6px;"></span>
              </div>
              <div id="ac-ra-public-row" class="ac-hint" style="margin-top:8px;font-size:12px;"></div>

              <!-- Phone bookmark / signpost -->
              <div style="margin-top:14px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-elev);">
                <div class="ac-label" style="display:flex;align-items:center;gap:6px;margin:0;">
                  <i data-lucide="smartphone" class="lucide-icon" style="width:14px;height:14px;color:var(--accent);"></i>
                  Phone bookmark (auto-reconnect)
                </div>
                <div class="ac-hint" style="margin-top:4px;">Save this one link on your phone. It always forwards to this PC's current address through the signpost &mdash; even when the address changes.</div>
                <div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;">
                  <code id="ac-ra-phone-url" style="font-size:12px;padding:4px 8px;background:var(--bg-0);border:1px solid var(--border);border-radius:6px;color:var(--fg-1);word-break:break-all;max-width:100%;">&mdash;</code>
                  <button id="ac-ra-phone-copy" class="ac-btn" type="button">Copy</button>
                  <button id="ac-ra-regen" class="ac-btn" type="button">New key</button>
                </div>
                <div id="ac-ra-phone-qr" class="ac-ra-qr" style="margin-top:10px;display:none;"></div>

                <details style="margin-top:10px;">
                  <summary style="cursor:pointer;font-size:11px;color:var(--muted);">Signpost settings</summary>
                  <label class="ac-label" style="margin-top:8px;">Signpost server (always-on)</label>
                  <input id="ac-ra-sp-server" class="ac-input" placeholder="https://webagent.live">
                  <label class="ac-label" style="margin-top:8px;">Role</label>
                  <select id="ac-ra-sp-role" class="ac-input">
                    <option value="client">Client &mdash; this PC reports its address</option>
                    <option value="server">Server &mdash; host the directory for others</option>
                    <option value="both">Both</option>
                  </select>
                  <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;margin-top:8px;">
                    <input type="checkbox" id="ac-ra-sp-enabled"> Signpost enabled
                  </label>
                  <div style="margin-top:8px;">
                    <button id="ac-ra-sp-save" class="ac-btn" type="button">Save Signpost</button>
                  </div>
                </details>
              </div>
                </div><!-- /.ac-card -->
              </div><!-- /.ac-category-body -->
            </details>
          </section>

        </div><!-- /app-config-content -->
    </div><!-- /app-config-container -->
</template>
