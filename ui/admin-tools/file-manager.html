<template data-slot="#files-sidebar">
          <!-- Explorer panel (file tree) -->
          <div class="files-sidebar-panel" id="files-panel-explorer" data-view="explorer">
            <div class="files-sidebar-header">
              <div class="files-sidebar-actions">
                <button class="files-icon-btn" id="files-new-file" title="New file"><i data-lucide="file-plus" class="lucide-icon"></i></button>
                <button class="files-icon-btn" id="files-new-folder" title="New folder"><i data-lucide="folder-plus" class="lucide-icon"></i></button>
                <button class="files-icon-btn" id="files-refresh" title="Refresh"><i data-lucide="refresh-cw" class="lucide-icon"></i></button>
                <button class="files-icon-btn" id="files-collapse-all" title="Collapse all"><i data-lucide="chevrons-down-up" class="lucide-icon"></i></button>
              </div>
            </div>
            <div id="files-breadcrumb" class="files-breadcrumb" aria-label="Current path">
              <button class="files-breadcrumb-up" id="files-breadcrumb-up" title="Go to parent directory"><i data-lucide="arrow-up" class="lucide-icon"></i></button>
              <button class="files-breadcrumb-home" id="files-breadcrumb-home" title="Back to project root"><i data-lucide="home" class="lucide-icon"></i></button>
              <span class="files-current-path" id="files-current-path" title=""></span>
            </div>
            <div id="files-tree" class="files-tree" role="tree"></div>
          </div>
</template>

<template data-slot="#admin-tools">
  <!-- Explorer main: file tabs + editor. Visible when the Explorer
       view is active. -->
        <main class="files-main" id="files-explorer-main" data-view="explorer">
          <div class="files-tabs-wrap">
            <button id="files-tabs-prev" class="files-tabs-chev" title="Scroll tabs left"><i data-lucide="chevron-left" class="lucide-icon"></i></button>
            <div id="files-tabs" class="files-tabs" role="tablist"></div>
            <button id="files-tabs-next" class="files-tabs-chev" title="Scroll tabs right"><i data-lucide="chevron-right" class="lucide-icon"></i></button>
          </div>
          <div id="files-content" class="files-content">
            <div class="files-welcome">
              <i data-lucide="folder-tree" class="lucide-icon files-welcome-icon"></i>
              <div class="files-welcome-title">File Editor</div>
              <div class="files-welcome-text">Pick a file from the Explorer on the left to open it here.</div>
            </div>
          </div>
          <div id="files-status-bar" class="files-status-bar">
            <span id="files-status-path" class="files-status-path"></span>
            <span class="files-status-spacer"></span>
            <span id="files-status-info" class="files-status-info"></span>
          </div>
        </main>
</template>
