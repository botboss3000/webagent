<!-- Cloud VMs — drop-in Admin Tools view partial.
     Two <template data-slot> blocks injected at boot by the partial loader
     (ui/shared/js/partial-loader.js): a sidebar panel into #files-sidebar and a
     main pane into #admin-tools. Discovered via ui/admin-tools/cloud-vms/page.json;
     driven by cloud-vms.js (startView/stopView); backed by server.py
     (/admin/cloud-vms/*). A full manager for every VM across EVERY cloud account
     the admin adds (list / open / start / stop / delete) — the evolution of the
     Deploy card, which only remembers the single last server it created.

     The SIDEBAR is the account manager: a provider dropdown + a "+" button add a
     cloud account; each account is a row that expands into its own login sub-menu
     (the id + key for that account). The MAIN pane shows every server across all
     added accounts in one combined view, grouped per account.
     Sister admin views: ui/admin-tools/update/, ui/admin-tools/diagnostics/.
     REMOVE-WHEN: the Cloud VMs view is dropped from the admin page catalog. -->
<template data-slot="#files-sidebar">
  <div class="files-sidebar-panel" id="files-panel-cloud-vms" data-view="cloud-vms" hidden>
    <div class="files-sidebar-header">
      <div class="files-sidebar-actions">
        <button class="files-icon-btn" id="cvm-refresh" title="Refresh"><i data-lucide="refresh-cw" class="lucide-icon"></i></button>
      </div>
    </div>
    <div class="cvm-side">
      <!-- Account manager — pick a cloud provider and press + to add it, then fill
           in its login (id + key) in the row's sub-menu. Each provider that
           supports server management shows up in the dropdown automatically. -->
      <div class="cvm-side-section">
        <div class="cvm-side-title">Cloud accounts</div>
        <div class="cvm-add" id="cvm-add" hidden>
          <select id="cvm-add-provider" class="cvm-input"></select>
          <button id="cvm-add-btn" class="cvm-add-btn" title="Add this cloud account"><i data-lucide="plus"></i></button>
        </div>
        <div class="cvm-accounts" id="cvm-accounts"></div>
      </div>
      <div class="cvm-side-section">
        <div class="cvm-side-title">Status</div>
        <div class="cvm-legend">
          <span class="cvm-legend-item"><span class="cvm-dot cvm-dot-run"></span> Running</span>
          <span class="cvm-legend-item"><span class="cvm-dot cvm-dot-stop"></span> Stopped</span>
          <span class="cvm-legend-item"><span class="cvm-dot cvm-dot-busy"></span> Changing…</span>
        </div>
      </div>
      <div class="cvm-side-section">
        <div class="cvm-hint">Add each cloud account here; the main view lists every server across all of them in one place. The one running this app is marked
          <strong>This app</strong>; servers webAgent created are marked <strong>webAgent</strong>.</div>
      </div>
    </div>
  </div>
</template>

<template data-slot="#admin-tools">
  <main class="files-main" id="files-cloud-vms-main" data-view="cloud-vms" hidden>
    <div id="cvm-container">
      <div id="cvm-toolbar">
        <span class="cvm-toolbar-label"><i data-lucide="server" style="width:13px;height:13px;"></i> Cloud VMs</span>
        <span id="cvm-stats" class="cvm-stats"></span>
        <span class="cvm-spacer"></span>
        <button id="cvm-refresh-main" class="cvm-btn" title="Refresh"><i data-lucide="refresh-cw" style="width:13px;height:13px;"></i> Refresh</button>
      </div>
      <!-- Live log for a running Start / Stop / Delete (NDJSON stream). -->
      <pre id="cvm-log" class="cvm-log" hidden></pre>
      <div id="cvm-body">
        <div class="cvm-hint cvm-main-hint">Open the Cloud VMs view to load your servers.</div>
      </div>
    </div>
  </main>
</template>
