<!-- Instances — drop-in Admin Tools view partial.
     A grid of every WebAgent INSTANCE signed in to the shared database PLUS every
     cloud VM in a connected cloud account, styled after the main Agents page
     (ui/main-panel/agents/): each instance is a square tile; clicking one opens a
     tabbed detail region below (Overview). THIS device is always present and
     marked, and it paints INSTANTLY (from the browser + last-known cache) while
     the rest of the fleet + cloud VMs + connection health load behind a spinner.

     A "New instance" CREATE TILE is always first (top-left / left of the carousel,
     mirroring the Agents page's "New Agent" tile). It opens a card with a "New
     Deployment" tab — the install-a-new-copy flow (Repo · Deploy target · Connect a
     domain), moved out of Data Settings → Deployment. That tab is its OWN drop-in
     sub-feature (new-deployment/: its .html/.js/.css, kept separate so this page
     stays lean); instances.js only mounts it. See new-deployment/new-deployment.js.

     This one page absorbed two now-deleted admin pages plus the old Data Settings →
     Deployment section: the "This device" connection config (database + secrets-vault
     sign-in, silent-fallback warning) and the cloud-ACCOUNT manager now live in a
     "Connections" section INSIDE the "This device" tile's Overview (open the tile to
     reach them); cloud VMs appear as tiles with Start/Stop/Delete/Open/Ping + a live
     log in each cloud tile's Overview. This app's restart + port editor live in a
     "Server" section in the "This device" Overview, and any other local WebAgent
     checkouts on this machine appear as their own "Local" tiles (Start/Stop/Delete/
     Open + edit), created from the New instance tile. The backend for all of it is
     this folder's own server.py (mounted via page.json `router`) plus the shared
     /admin/deploy/instances/* + /admin/storage/server/* for the local/restart bits;
     the DB + vault connect/test/activate controls call the shared /admin/storage/*.

     PANEL-LESS view (like Dashboard / Settings): this partial exposes ONLY the
     #admin-tools main slot — no #files-sidebar sub-panel. The sidebar collapses
     to the bare icon strip for this view via the .files-sidebar[data-view=
     "instances"] rules in instances.css (mirrors the dashboard/settings rules in
     ui/main-panel/admin-tools/files.css). The single <template data-slot> block
     is injected at boot by the partial loader (ui/shared/js/partial-loader.js).

     Discovered via ui/admin-tools/instances/page.json; driven by instances.js
     (startView/stopView); backed by server.py. Styling: instances.css — fully
     self-contained (the smb-/cvm- card/form primitives were folded in when the two
     old pages were removed).
     REMOVE-WHEN: the Instances view is dropped from the admin page catalog. -->
<template data-slot="#admin-tools">
  <main class="files-main" id="files-instances-main" data-view="instances" hidden>
    <!-- The whole page (toolbar, tile grid, and the expanded detail region) is
         rendered here by instances.js. -->
    <div id="inst-root" class="inst-root"></div>
  </main>
</template>
