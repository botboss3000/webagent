<template data-slot="#ac-section-slot-data-settings">
<section id="ac-section-data-settings" class="ac-section ac-stickynav">
  <!-- DATA SETTINGS — admin-only. No page-title header: the tab carousel already
       names this page. Follows the standard config-page layout (App Settings /
       Agent Settings) — a stack of always-open, sticky `.ac-category-group`
       headings (no chevron) plus a bottom page-assistant chat pill (like App
       Settings). See docs/claude/ui-guidance.md point 5 + "the standard
       config-page layout".

       PAGE-ASSISTANT: each `.ac-category-group` below carries a `data-pa-area`
       key (deployment · app_access · database); the bottom pill (markup in
       app-config.html as #ac-ds-pa-bar, wired by _initPageAssistant in
       data-settings.js) reads which area the mouse is over and swaps its
       placeholder + wraps the sent message with that area's prompt. The whole
       assistant is steered toward helping the admin get people SIGNED IN to this
       instance — text catalog in app-prompts.json → page_assistants.data_settings.

       Its first group is DEPLOYMENT (moved here out of App Settings). More
       data-related settings groups can be added below it over time. -->

  <!-- ════════════════════════════════════════════════════════════════
       DEPLOYMENT — manage where WebAgent runs + install it somewhere new.
       One heading over one `.ac-list` with two parts:
         1. LOCAL DEPLOYMENTS (#ac-deploy-instances) — the current app (the
            hub) plus any registered sibling checkouts on this machine, each an
            expandable bar built by deploy.js `_renderInstances`: a live status
            dot + a "Port N · folder" line. The HUB bar also carries a right-hand
            HOLD-TO-RESTART button (press and hold → arms to the hazard icon → the
            fill sweeps → the server restarts; no confirm dialog, the hold is the
            confirm — deploy.js `_beginResetHold`), and expands to a port editor
            (change this app's port → it persists + relaunches on the new port);
            a SIBLING bar expands to Open / Start / Stop / edit / Remove. Backed
            by /admin/deploy/instances/* (app/local_instances.py — the same
            registry the Dashboard's instance header uses).
         2. + NEW DEPLOYMENT (#ac-deploy-new-row) — an expandable `.ac-group`
            whose body now holds just TWO bars (was five per-target rows), so the
            repo is chosen ONCE and the target picked separately:
              • REPO DETAILS (#ac-deploy-repo-row) — the repo choice carried into
                EVERY target: repository URL, public/private, access token (shown
                only when private), and an optional admin password. deploy.js
                `_readSharedRepo()` is the single source of truth — the manual
                command boxes AND the cloud deploy both read it. The token + admin
                password are never stored (the token only rides the built command
                / the one-shot cloud deploy; the admin password only pre-sets the
                first admin).
              • DEPLOY TARGET (#ac-deploy-target-row) — a #ac-deploy-target
                dropdown SITTING IN THE ROW HEADER (Select an option · Cloud Server ·
                This device · Linux or Android (Termux) · Windows · Mac). Picking a
                target both reveals ONE `.ac-deploy-target-panel` in the body AND
                opens the row; the placeholder collapses it (deploy.js
                `_syncTargetPanel` toggles the panel + the row's `expanded` class):
                  – Cloud (#ac-deploy-cloud-panel) → the provider sub-picker
                    ("Where to deploy", rendered from GET /admin/deploy/catalog),
                    a dynamic SETTINGS form (non-secret config_fields), a CLOUD
                    KEY form (secret credential_fields → encrypted vault), saved
                    servers, then Test / Save / Deploy now / Tear down + a live
                    NDJSON log. The shared repo (URL/visibility/token) + admin
                    password are INJECTED into the cloud deploy by deploy.js, so
                    the repo/branch/admin fields are NOT shown in this panel.
                  – Local checkout (#ac-deploy-local-panel) → another WebAgent
                    repo folder on this machine + a free port, run alongside this
                    one. Repo details don't apply (it's an existing checkout).
                  – Linux/Android, Windows, Mac (#ac-deploy-{linux,win,mac}-panel)
                    → an install-location field + the LIVE copy-paste command (+
                    QR) + a run-only command + steps, all built in the browser
                    from the shared repo details.
       All wiring lives in the sibling deploy.js (initDeploy); the two static
       bars' expand reuses _wireBootRow in data-settings.js, the target-panel
       switch + shared-repo plumbing + the dynamic instance bars live in deploy.js.
       The cloud key is used for one deploy then auto-discarded from the vault
       ("Forget keys after deploy", default on). Admin-only; Deploy / Tear-down /
       relaunch actions are confirm-gated.
       ════════════════════════════════════════════════════════════════ -->
  <div class="ac-category-group" id="ac-deploy-card" data-pa-area="deployment">
    <div class="ac-category-summary" style="cursor:default;">
      <i data-lucide="rocket" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">Deployment</span>
      <span id="ac-deploy-badge" class="ac-category-count">loading…</span>
    </div>
    <div class="ac-category-body">
      <div class="ac-list" id="ac-deploy-list">

        <!-- ── Current deployment + other local deployments ── deploy.js
             `_renderInstances` fills this with one expandable bar per WebAgent
             instance on this machine: the HUB (this app) first, then any
             registered sibling checkouts. Each collapsed bar shows a live status
             dot + "Port N · folder"; the hub bar expands to a port editor (change
             + relaunch this app), a sibling bar to Open / Start / Stop / edit /
             Remove. Same registry/engine (app/local_instances.py) the Dashboard's
             instance header uses, via /admin/deploy/instances/*. Expand + actions
             are wired by deploy.js delegation (the rows are built dynamically). -->
        <div id="ac-deploy-instances" class="ac-deploy-insts">
          <div class="ac-hint" style="padding:10px 14px;">Checking where WebAgent is running…</div>
        </div>

        <!-- ── Export config (setup bundle) ── a static top-level row, sibling of
             "+ New deployment". Tick what to include + Verify this app's admin
             password → only then does the encrypted code + QR + Copy button
             reveal (a correct password both authorises and encrypts). Expand is
             wired by _wireBootRow('ac-deploy-export-row') in data-settings.js; the
             Verify/Copy actions by deploy.js _initBootRows. Engine:
             app/admin/bootstrap_bundle.py, via /admin/storage/bootstrap/*. This
             (with Import below) folded in the old per-row DB "Share (QR)". -->
        <div class="ac-row" id="ac-deploy-export-row">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="qr-code" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Export config to link another account</div>
              <div class="ac-ability-desc">Package this install's setup into one encrypted code (or QR) so another WebAgent comes up ready-configured.</div>
            </div>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <div class="ac-hint" style="font-size:11px;margin-bottom:8px;line-height:1.5;">Tick what to include, then verify this app's admin password to reveal the code — paste it into a freshly-cloned WebAgent (on its setup page, or into Import below).</div>
            <label class="ac-boot-check" style="display:flex;align-items:flex-start;gap:8px;margin:4px 0;font-size:12px;cursor:pointer;"><input type="checkbox" data-boot-sec="admin" checked style="margin-top:2px;"><span><strong>Admin login</strong> — <span style="color:var(--fg-3);">the admin username + password</span></span></label>
            <label class="ac-boot-check" style="display:flex;align-items:flex-start;gap:8px;margin:4px 0;font-size:12px;cursor:pointer;"><input type="checkbox" data-boot-sec="llm" checked style="margin-top:2px;"><span><strong>AI model &amp; key</strong> — <span style="color:var(--fg-3);">provider, preset model, the saved-model table + API key</span></span></label>
            <label class="ac-boot-check" style="display:flex;align-items:flex-start;gap:8px;margin:4px 0;font-size:12px;cursor:pointer;"><input type="checkbox" data-boot-sec="database" checked style="margin-top:2px;"><span><strong>Database</strong> — <span style="color:var(--fg-3);">the app database connection (+ password)</span></span></label>
            <label class="ac-boot-check" style="display:flex;align-items:flex-start;gap:8px;margin:4px 0;font-size:12px;cursor:pointer;"><input type="checkbox" data-boot-sec="vault" checked style="margin-top:2px;"><span><strong>Secrets vault</strong> — <span style="color:var(--fg-3);">which vault backend and its connection</span></span></label>
            <label class="ac-label" style="margin-top:10px;">This app's admin password</label>
            <div class="ac-boot-pw-row">
              <input class="ac-input" type="password" data-boot-share-pw autocomplete="off" placeholder="unlocks + encrypts the code">
              <button class="ac-btn ac-boot-verify" type="button" data-boot-share>Verify</button>
            </div>
            <span class="ac-hint" data-boot-share-status style="display:block;margin-top:6px;"></span>
            <div data-boot-share-result style="display:none;margin-top:12px;">
              <div class="ac-info-banner" style="border-left-color:var(--warning);font-size:11px;line-height:1.5;margin-bottom:8px;">Anyone with this code <em>and</em> the admin password can configure a new install with these keys. Treat it like a password — share it privately.</div>
              <div data-boot-qr style="max-width:200px;margin:0 auto 8px;"></div>
              <textarea data-boot-code readonly rows="3" style="width:100%;padding:6px 8px;border:var(--border-width) solid var(--border);border-radius:4px;font-size:11px;font-family:var(--font-mono,monospace);background:transparent;color:inherit;resize:vertical;word-break:break-all;"></textarea>
              <div class="ac-ra-actions" style="margin-top:6px;"><button class="ac-btn ac-deploy-go-btn" type="button" data-boot-copy><i data-lucide="copy"></i> Copy code</button></div>
            </div>
          </div>
        </div>

        <!-- ── Import config (setup bundle) ── the mirror of Export. Paste a code
             + Verify the SOURCE install's admin password → only then does a
             read-only summary of what it carries + an Accept button reveal.
             Accept adopts every carried section (overwrite) so this box takes on
             the source's setup. Expand wired by _wireBootRow('ac-deploy-import-row');
             Verify/Accept by deploy.js _initBootRows. -->
        <div class="ac-row" id="ac-deploy-import-row">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="log-in" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Import config to link this account</div>
              <div class="ac-ability-desc">Paste a code from another WebAgent to adopt its database, vault, model and login here.</div>
            </div>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <div class="ac-hint" style="font-size:11px;margin-bottom:8px;line-height:1.5;">Paste a code from another WebAgent to bring its configuration into this install. Enter the <em>source</em> install's admin password to unlock it.</div>
            <textarea data-boot-import-code rows="3" placeholder="Paste the setup code (WABOOT1…) here" style="width:100%;padding:6px 8px;border:var(--border-width) solid var(--border);border-radius:4px;font-size:11px;font-family:var(--font-mono,monospace);background:transparent;color:inherit;resize:vertical;word-break:break-all;"></textarea>
            <label class="ac-label" style="margin-top:8px;">Source admin password</label>
            <div class="ac-boot-pw-row">
              <input class="ac-input" type="password" data-boot-import-pw autocomplete="off" placeholder="the admin password of the app you copied from">
              <button class="ac-btn ac-boot-verify" type="button" data-boot-preview>Verify</button>
            </div>
            <span class="ac-hint" data-boot-import-status style="display:block;margin-top:6px;"></span>
            <div data-boot-preview-result style="display:none;margin-top:12px;"></div>
          </div>
        </div>

        <!-- ── + New deployment ── an expandable group. Its head is the "add a
             deployment" bar; clicking it reveals the four install targets below
             (the cloud row + the three manual rows). Expand wired by
             _wireBootRow('ac-deploy-new-row') in data-settings.js; the members
             are ordinary `.ac-row`s inside `.ac-group-body`. -->
        <div class="ac-row ac-group" id="ac-deploy-new-row">
          <div class="ac-ability-row ac-group-head">
            <span class="ac-ability-icon"><i data-lucide="plus" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">New deployment</div>
              <div class="ac-ability-desc">Install WebAgent somewhere new — the cloud, a Linux or Android device, Windows or a Mac.</div>
            </div>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-group-body">

        <!-- ── Repo details (shared) ── the repo choice entered ONCE and carried
             into EVERY target below (deploy.js _readSharedRepo is the single source
             of truth). The token + admin password are never stored. The `data-tip`
             labels become circled "?" badges via deploy.js _wireManualTips, which
             now also scans this row. Expand wired by _wireBootRow('ac-deploy-repo-row'). -->
        <div class="ac-row" id="ac-deploy-repo-row">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="git-branch" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Repo details<span id="ac-deploy-repo-head" style="color:var(--fg-muted);font-weight:400;"></span></div>
              <div class="ac-ability-desc">The code to install and how to sign in — entered once and used for whichever target you pick below.</div>
            </div>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <label class="ac-label" data-tip="The address of the WebAgent code on GitHub. Leave blank to install the standard WebAgent app; enter your own fork's address only if you maintain a custom copy.">Code to install (GitHub repository)</label>
            <input id="ac-deploy-repo-url" class="ac-input" type="text" placeholder="https://github.com/botboss3000/webagent" autocomplete="off" spellcheck="false">

            <label class="ac-label" style="margin-top:10px;" data-tip="Which line of the code to install. 'main' is the stable release — leave it unless you specifically need a different branch. Used by every target (the cloud deploy and the Linux/Windows/Mac commands alike).">Version (git branch)</label>
            <input id="ac-deploy-repo-branch" class="ac-input" type="text" placeholder="main" autocomplete="off" spellcheck="false">

            <label class="ac-label" style="margin-top:10px;" data-tip="Public repositories anyone can download — no token needed. Choose Private only if your repository requires a login; you'll then paste an access token below.">Repository access</label>
            <select id="ac-deploy-repo-visibility" class="ac-input">
              <option value="public">Public — anyone can clone it</option>
              <option value="private">Private — needs an access token</option>
            </select>

            <div id="ac-deploy-repo-token-wrap" style="display:none;margin-top:10px;">
              <label class="ac-label" data-tip="A GitHub personal access token, used once so the target can download a private repository. It is never saved on this server — for a manual install it is embedded in the command you copy or scan; for a cloud deploy it is sent to the new server to clone with, then discarded. Either way, forgotten afterwards.">Access token</label>
              <input id="ac-deploy-repo-token" class="ac-input" type="password" placeholder="GitHub personal access token" autocomplete="off" spellcheck="false">
              <div class="ac-hint" style="font-size:11px;margin-top:3px;">Used only to fetch a private repository — it is <strong>not saved</strong> on this server. It rides the built command / the one-shot cloud deploy, then is forgotten.</div>
            </div>

            <!-- Admin password (optional) — shared by every target. Blank → the first
                 visitor sets it on the setup page. Typed → it pre-sets the first admin
                 (manual: WA_ADMIN_PW in the command; cloud: BOOTSTRAP_ADMIN_PASSWORD in
                 the new server's .env). Never stored on this server. -->
            <label class="ac-label" style="margin-top:10px;" data-tip="Optional — leave it blank to install the app as-is, with no admin password set. The first person to open its address then picks the password on the setup page (this also works from another device on the same network). Or type a password here (6+ characters) to pre-set it, so the admin is ready before the app is ever reachable — for a manual install it is embedded in the command in plain text, so keep that command private.">Admin password (optional)</label>
            <input id="ac-deploy-repo-admin-pw" class="ac-input" type="password" placeholder="leave blank — first visitor sets it" autocomplete="new-password" spellcheck="false">
          </div>
        </div>

        <!-- ── Deploy target ── the install-target picker lives RIGHT IN THE ROW
             header (no expand chevron): choosing a target both reveals its matching
             `.ac-deploy-target-panel` in the body below AND opens the row; the
             "Select an option" placeholder collapses it. deploy.js _syncTargetPanel
             drives the panel switch + the row's `expanded` class off the dropdown's
             value, so this row is NOT wired with _wireBootRow. -->
        <div class="ac-row" id="ac-deploy-target-row">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="rocket" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Deploy target</div>
            </div>
            <select id="ac-deploy-target" class="ac-input ac-deploy-target-select" aria-label="Deploy target">
              <option value="" selected>Select an option</option>
              <option value="cloud">Cloud Server</option>
              <option value="local">This device</option>
              <option value="termux">Linux or Android (Termux)</option>
              <option value="windows">Windows</option>
              <option value="macos">Mac</option>
            </select>
          </div>
          <div class="ac-ability-body">

            <!-- ── Cloud panel ── the provider sub-picker + settings + cloud key +
                 saved servers + actions + live NDJSON log. The shared repo (URL/
                 visibility/token) + admin password are injected into the deploy by
                 deploy.js, so no repo/branch/admin fields render here. -->
            <div class="ac-deploy-target-panel" id="ac-deploy-cloud-panel" data-target="cloud" style="margin-top:12px;">
            <label class="ac-label">Where to deploy</label>
            <select id="ac-deploy-provider" class="ac-input"></select>

            <!-- ── Saved servers ── shown only for a profile-aware target (the SSH
                 one, p.saved_servers). Pick a saved server to fill the form, name +
                 Save the current one to add it to the list, or Delete one. Every
                 Google VM you create is auto-added here too. Populated + wired by
                 deploy.js (_renderServers / _onServerSelect / _onServerSave). -->
            <div id="ac-deploy-servers-wrap" style="display:none;margin-top:10px;">
              <label class="ac-label">Saved servers</label>
              <select id="ac-deploy-servers" class="ac-input"></select>
              <div class="ac-ra-actions" style="margin-top:8px;">
                <input id="ac-deploy-server-label" class="ac-input" type="text"
                       placeholder="Name this server (e.g. Hetzner box)" autocomplete="off"
                       spellcheck="false" style="flex:1 1 auto;min-width:0;">
                <button id="ac-deploy-server-save" class="ac-btn" type="button">Save server</button>
                <!-- Press-and-HOLD to delete (no confirm dialog): a danger fill sweeps
                     the button; the deliberate hold IS the confirmation. Shared .ac-dz-hold
                     styling; hold logic + --dz-hold duration in deploy.js (_beginDeleteHold). -->
                <button id="ac-deploy-server-delete" class="ac-btn ac-deploy-danger-btn ac-dz-hold" type="button">
                  <span class="ac-dz-fill"></span>
                  <span class="ac-dz-hold-label">Hold to delete</span>
                </button>
              </div>
              <div class="ac-hint" style="font-size:11px;margin-top:4px;line-height:1.5;">
                Pick a saved server to fill the form, or “＋ New server…” to add one. Saving keeps its
                address and login (stored encrypted) so you can reconnect with one click next time.
              </div>
            </div>

            <!-- Settings + Cloud-key + rest + actions. A `progressive` target (the
                 Google VM) reveals these in STAGES so the form isn't overwhelming:
                 deploy.js puts ONLY the project field in #ac-deploy-config, the key
                 in #ac-deploy-creds, and every OTHER setting in #ac-deploy-config-rest
                 (which sits AFTER the key), then gates each stage on the one before
                 (_applyCloudStages). The two section labels are hidden for a staged
                 target — each field carries its own label. Non-staged targets (SSH)
                 render every setting into #ac-deploy-config and show it all at once. -->
            <label id="ac-deploy-settings-label" class="ac-label" style="margin-top:10px;">Settings</label>
            <div id="ac-deploy-config" class="ac-ra-fields"></div>

            <label id="ac-deploy-key-label" class="ac-label" style="margin-top:10px;">Cloud key</label>
            <div id="ac-deploy-creds" class="ac-ra-fields"></div>

            <!-- Progressive-only "rest of the settings" host — the non-gate config
                 fields render here (after the key) so a staged form reveals in the
                 order project → key → rest. Empty + unused for non-staged targets. -->
            <div id="ac-deploy-config-rest" class="ac-ra-fields"></div>

            <!-- Primary action = Activate (deploy); the advanced actions (test /
                 save / tear-down) live behind "More" so they don't clutter the
                 completion step. Button ids unchanged so their wiring is untouched. -->
            <div id="ac-deploy-actions" class="ac-ra-actions" style="margin-top:10px;">
              <button id="ac-deploy-go" class="ac-btn ac-deploy-go-btn" type="button">Activate</button>
              <button id="ac-deploy-more-btn" class="ac-btn" type="button" aria-expanded="false" aria-controls="ac-deploy-more-panel">More ▾</button>
              <span id="ac-deploy-status" class="ac-hint" style="margin-left:6px;"></span>
            </div>
            <div id="ac-deploy-more-panel" class="ac-deploy-more-panel" hidden>
              <button id="ac-deploy-test" class="ac-btn" type="button">Test connection</button>
              <button id="ac-deploy-save" class="ac-btn" type="button">Save settings</button>
              <button id="ac-deploy-destroy" class="ac-btn" type="button">Tear down</button>
            </div>

            <!-- After a successful Activate, the live address of the deployment,
                 shown below the status line as a new-tab link. Populated by
                 deploy.js (_renderDeployResult) from the deploy result and rebuilt
                 from the saved deployment record on reload, so it persists. -->
            <div id="ac-deploy-result" class="ac-hint" style="margin-top:8px;" hidden></div>

            <pre id="ac-deploy-log" class="ac-deploy-log" hidden></pre>
            </div><!-- /#ac-deploy-cloud-panel -->

            <!-- ── Local-checkout panel ── point at another WebAgent repo folder on
                 this machine + a free port, run alongside this one. Repo details don't
                 apply here (it's an existing checkout on disk). Body ids owned by
                 deploy.js (_initInstances / _registerAdd). -->
            <div class="ac-deploy-target-panel" id="ac-deploy-local-panel" data-target="local" hidden style="margin-top:12px;">
            <div class="ac-hint" style="font-size:11px;margin-bottom:10px;line-height:1.5;color:var(--fg-3);">Repo details above aren’t used here — a local checkout runs a WebAgent folder already on this machine.</div>
            <label class="ac-label">Repo folder *</label>
            <input id="ac-inst-folder" class="ac-input" type="text" placeholder="C:\path\to\another-webagent" autocomplete="off" spellcheck="false">
            <div class="ac-hint" id="ac-inst-folder-tip" style="font-size:11px;margin-top:3px;">The folder of another WebAgent checkout (needs run.py + app/main.py).</div>

            <label class="ac-label" style="margin-top:10px;">Name</label>
            <input id="ac-inst-label" class="ac-input" type="text" placeholder="Defaults to the folder name" autocomplete="off">

            <label class="ac-label" style="margin-top:10px;">Port *</label>
            <input id="ac-inst-port" class="ac-input" type="number" min="1024" max="65535" placeholder="8081">
            <div class="ac-hint" id="ac-inst-port-tip" style="font-size:11px;margin-top:3px;">A free port, different from this app’s.</div>

            <div class="ac-ra-actions" style="margin-top:10px;">
              <button id="ac-inst-add" class="ac-btn ac-deploy-go-btn" type="button">Add</button>
              <span id="ac-inst-add-status" class="ac-hint" style="margin-left:6px;"></span>
            </div>
            </div><!-- /#ac-deploy-local-panel -->

            <!-- ── Linux/Android panel ── install-location + the LIVE command (+ QR)
                 + a run-only command + steps, all built in the browser by deploy.js
                 from the shared repo details (MANUAL_ROWS[termux]). The `data-tip`
                 install-location label becomes a "?" badge via _wireManualTips. -->

  <!-- ════════════════════════════════════════════════════════════════
       APP ACCESS — how new users get into this instance (the "access mode").
       This is the former Users → Access Mode form, moved here and restyled to
       match the Deployment card (a `.ac-category-group` heading over one
       `.ac-list`). Its two options are a RADIO VARIANT of the shared toggle-list:
       each mode is an `.ac-ability-row` whose right-hand control is a radio (see
       docs/claude/ui-guidance.md "Toggle-list" → "a row's control can be a
       radio"). Picking a mode auto-saves via the SAME backend the Users form used
       (GET/POST /admin/settings/app → access_mode) — no Save button; the pick
       confirms with the unified on-top save overlay. All wiring lives in the
       sibling app-access.js (initAppAccess); the heading badge shows the current
       mode. Admin-only.

       Below the mode radios, in the SAME `.ac-list` tree, sits SOCIAL SIGN-IN
       (moved here out of the Users page): the radios say who may register, these
       drop-in providers (plugins/auth_providers/) say how they sign in — one "how
       people get into this instance" section. It reads like the ability tree: a
       "Sign in with" group-header row over individual ability-style provider rows
       (icon + name + Enabled switch + expandable keys body), rendered into
       #ac-social-list by the sibling social-auth.js (initSocialAuth).
       ════════════════════════════════════════════════════════════════ -->
  <div class="ac-category-group" id="ac-access-card" data-pa-area="app_access">
    <div class="ac-category-summary" style="cursor:default;">
      <i data-lucide="key-round" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">App Access</span>
      <span id="ac-access-badge" class="ac-category-count">loading…</span>
    </div>
    <div class="ac-category-body">
      <!-- ONE `.ac-list` tree (the ability-tree look): two access-mode rows, a
           "Sign in with" sub-head that reads like an ability-group header (icon +
           title + live count), then the provider rows — each an individual
           ability-style row (icon + name + substate + Enabled switch + expandable
           keys body), rendered by social-auth.js. The list draws every hairline
           divider, so the radios + providers read as one continuous tree.
           (No `role=radiogroup` on the list: it now also holds non-radio rows; the
           two mode radios still group by their shared `name`.) -->
      <div class="ac-list ac-access-list" id="ac-access-list" aria-label="How new users can join this instance">

        <!-- Private (admin approval) — the default. Expands to show users awaiting
             approval so the admin can authorize or reject them inline. The pending
             count badge is updated by app-access.js whenever the mode loads or an
             action is taken. The chevron wiring lives in initAppAccess(). -->
        <div class="ac-row" id="ac-row-private">
          <div class="ac-ability-row ac-access-row" id="ac-private-head">
            <span class="ac-ability-icon"><i data-lucide="shield-check" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Private — admin approval required</div>
              <div class="ac-ability-desc">New users register but cannot sign in until an admin approves them. <em>(default)</em></div>
            </div>
            <span class="ac-ability-status ac-access-radio-cell">
              <input type="radio" name="ac-access-mode" value="admin_approval" class="ac-access-radio" aria-label="Private — admin approval required">
            </span>
            <span id="ac-private-pending-badge" class="ac-category-count" style="display:none;"></span>
            <span class="ac-row-chevron" id="ac-private-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body" id="ac-private-users-body">
            <div id="ac-private-users-list"></div>
          </div>
        </div>

        <!-- Open Registration — anyone can join + sign in themselves.
             Plain <div> (not a <label>) on purpose: only the radio circle itself
             selects this mode, so clicking the row body isn't a hidden toggle. -->
        <div class="ac-ability-row ac-access-row">
          <span class="ac-ability-icon"><i data-lucide="globe" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Open Registration</div>
            <div class="ac-ability-desc">Anyone can join and sign in themselves. “Remember me” on the sign-in screen keeps each device logged in. Anonymous user permissions are controlled per-agent, not at the app level.</div>
          </div>
          <span class="ac-ability-status ac-access-radio-cell">
            <input type="radio" name="ac-access-mode" value="public_registered" class="ac-access-radio" aria-label="Open Registration">
          </span>
        </div>

        <!-- ── Sign in options ── an EXPANDABLE group-header row for the social
             providers below: a LEFT chevron + icon + title + a live "N on" count
             (set by social-auth.js), the same anatomy as an ability-group head.
             Clicking the bar expands/collapses the provider list (#ac-social-list),
             which is collapsed by default. Wired by _wireSocialHead in app-access.js;
             the collapse + left-chevron-rotate rules live in app3.css. -->
        <div class="ac-ability-row ac-access-subhead" id="ac-social-head" role="button" tabindex="0" aria-expanded="false">
          <span class="ac-row-chevron ac-row-chevron--left"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          <span class="ac-ability-icon"><i data-lucide="log-in" class="lucide-icon" style="width:16px;height:16px;color:var(--fg-muted);"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Sign in options</div>
            <div class="ac-ability-desc">One-click social login (Google, GitHub, …). A new account this way follows the access mode above.</div>
          </div>
          <span class="ac-category-count" id="ac-social-count"></span>
        </div>

        <!-- ── Provider rows ── each an individual ability-style row, rendered by
             social-auth.js. Direct child of the list so the header/first-provider
             hairline is drawn by the list; provider↔provider hairlines come from
             the `#ac-social-list > * + *` rule (app3.css). -->
        <div id="ac-social-list">
          <div class="ac-table-empty" style="padding:14px;">Loading providers…</div>
        </div>

      </div><!-- /.ac-list -->

    </div><!-- /.ac-category-body -->
  </div>

  <!-- ════════════════════════════════════════════════════════════════
       DATABASE — where the app's data lives + how it's protected. These
       seven rows were MOVED here out of the Data Management page (the former
       Core Storage + Secrets & Encryption groups, plus Data Migration) so all
       "where does my data live" controls sit under one Database heading below

       management.js) bind by element id (getElementById, not section-scoped)
       and load on App-Config open via settings-view.js startStorageUi() /
       startDataManagement() — so moving the markup to this section leaves the
       drivers working unchanged. The rows' expand/collapse is wired by
       _wireDatabaseRows() in data-settings.js (mirrors the retired Data
       Management tab's _wireRows, incl. the `.ac-tri` header-toggle exclusion
       for the Encryption + Hybrid rows). storage.js pins its `root` on THIS
       section (#ac-section-data-settings) — the Data Management tab that used to
       host it was removed (its last two rows, Config Files + Stream Buffer, went
       to App Settings → Advanced). See docs/claude/ui-guidance.md +
       app/db/README.md. ════════════════════════════════════════════════ -->
  <div class="ac-category-group" id="ac-database-card" data-pa-area="database">
    <div class="ac-category-summary" style="cursor:default;">
      <i data-lucide="database" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">Database</span>

        Configuration is locked to environment variables. UI changes are disabled. Edit the deployment to modify storage settings.
      </div>

      <div class="ac-list">

        <!-- ── Row · Application Data (the main app database) ── -->
        <div class="ac-row" id="ac-row-appdata">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="server" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Application Data</div>
              <div class="ac-ability-desc">Where the main app database lives — SQLite, Postgres, Supabase, and more.</div>
            </div>
            <span class="ac-ability-status" id="ac-storage-active-badge">loading…</span>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <label class="ac-label">Provider</label>
            <select id="ac-storage-db-provider" class="ac-input">
              <option value="sqlite">SQLite</option>
              <option value="postgres">Postgres</option>
              <option value="supabase">Supabase</option>
              <option value="aws_rds">Amazon RDS</option>
              <option value="gcp_cloud_sql">Google Cloud SQL</option>
              <option value="azure_postgres">Azure Database</option>
              <option value="neon">Neon</option>
            </select>

            <div id="ac-storage-db-notes" class="ac-provider-notes" style="margin-top:8px;padding:8px 10px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-left:3px solid var(--accent);border-radius:4px;font-size:11px;line-height:1.55;"></div>

            <div id="ac-storage-db-fields" style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;"></div>

            <!-- Natural left-to-right flow: Test → Save → create tables → Activate.
                 The button set is provider-aware (see applyProviderButtons in
                 storage.js): for Supabase, "Auto-Create Tables" is hidden and

            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;">

              <button id="ac-storage-db-save" class="ac-btn">Save Config</button>
              <button id="ac-storage-db-show-sql" class="ac-btn">Show Schema SQL</button>
              <button id="ac-storage-db-bootstrap" class="ac-btn">Auto-Create Tables</button>
              <button id="ac-storage-db-activate" class="ac-btn ac-btn-primary">Activate</button>
              <!-- Sharing this connection to another device FOLDED into the app-level
                   setup bundle: the "This app" row (Deployment card) now shares DB +

                   "Share (QR)" / "Paste Config" were removed. See deploy.js

            <div id="ac-storage-db-output-wrap" style="margin-top:10px;">

            </div>

        <div class="ac-row" id="ac-row-hybrid">

            <pre id="ac-storage-hybrid-output" style="margin-top:10px;padding:8px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-radius:6px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow-y:auto;display:none;"></pre>
          </div>
        </div>

        <!-- ── Row · Secrets Vault ── -->
        <div class="ac-row" id="ac-row-secrets">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="key-round" class="lucide-icon" style="width:18px;height:18px;color:var(--purple);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Secrets Vault</div>
              <div class="ac-ability-desc">Where API keys and OAuth tokens are kept — app DB, OS keyring, or a cloud vault.</div>
            </div>
            <span class="ac-ability-status" id="ac-storage-secrets-badge">loading…</span>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <label class="ac-label">Provider</label>
            <select id="ac-storage-secrets-provider" class="ac-input">
              <option value="inline_db">App DB (default, plaintext)</option>
              <option value="env">Environment variables (read-only)</option>
              <option value="os_keyring">OS Keyring</option>
              <!-- Shared remote vaults — every machine pointing at the remote DB

                 launch: the non-secret fields save to a local file outside the DB,
                 the token saves keyring-first with a file fallback — never the DB.

            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">

            </div>

  <!-- ════════════════════════════════════════════════════════════════
       DANGER ZONE — reset selected data groups, or delete the whole install.
       A `.ac-category-group` (same shell as the cards above) with a DANGER-tinted
       heading. Two destructive actions, both admin-only + confirm-gated:

         1. RESET DATA — a `.ac-list` of five tick-rows (database · vault ·
            attachments · genui · logs), each an `.ac-ability-row` with a checkbox
            on the right (mirrors the App-Access radio rows). "Reset selected"
            can't wipe in-process (the app holds its own DB/vault open), so it
            writes a one-shot marker + self-restarts; the fresh boot wipes the
            picked groups before anything opens them, keeping a backup under temp/.
            Backed by POST /admin/storage/reset (app/admin/storage.py →
            app/util/reset_boot.py). After the reboot that ran it, GET
            /admin/storage/reset/info returns the outcome, shown in #ac-dz-last.

         2. DELETE INSTALLATION — self-destruct. Removes the entire app folder
            from disk (stops + destroys this running app). Extra-guarded: the admin
            must type the install folder's name (shown by the info fetch) to arm
            the button. Backed by POST /admin/storage/delete-install, which spawns
            a detached helper OUTSIDE the repo that deletes the folder once the
            server exits.

       All wiring lives in the sibling danger-zone.js (initDangerZone), init'd from
       data-settings.js. data-pa-area reuses "database" so the page-assistant pill
       keeps working (no new prompt-catalog area needed).
       ════════════════════════════════════════════════════════════════ -->
  <div class="ac-category-group ac-dz-card" id="ac-danger-card" data-pa-area="database">
    <div class="ac-category-summary" style="cursor:default;">
      <i data-lucide="triangle-alert" class="lucide-icon" style="width:16px;height:16px;color:var(--danger);"></i>
      <span class="ac-category-title" style="color:var(--danger);">Danger Zone</span>
    </div>
    <div class="ac-category-body">

      <!-- Outcome of the reset that just ran (filled + shown by danger-zone.js from
           GET /admin/storage/reset/info after the reboot). Dismissable. -->
      <div id="ac-dz-last" class="ac-info-banner" style="display:none;margin-bottom:12px;border-left-color:var(--success);font-size:11.5px;line-height:1.55;"></div>

      <!-- Host-can't-self-restart banner (shown when auto_restart is false). -->
      <div id="ac-dz-norestart" class="ac-info-banner" style="display:none;margin-bottom:12px;border-left-color:var(--warning);color:var(--warning);font-size:11.5px;line-height:1.55;"></div>

      <div class="ac-hint" style="margin-bottom:10px;line-height:1.55;">
        Wipe selected data and start fresh. The app restarts and rebuilds a clean database
        (with the default admin + default agent) on the way back up. A copy of the removed files
        is kept under <code>temp/</code> so a reset is reversible — except a shared (Postgres)
        database, whose schema is dropped and <strong>cannot</strong> be undone.
      </div>

      <!-- ── Reset targets ── one tick-row per group. Checkbox on the right; the
           whole row toggles it (wired in danger-zone.js). -->
      <div class="ac-list" id="ac-dz-list">

        <label class="ac-ability-row ac-dz-row">
          <span class="ac-ability-icon"><i data-lucide="database" class="lucide-icon" style="width:18px;height:18px;color:var(--danger);"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">App database</div>
            <div class="ac-ability-desc">Chat sessions, agents, users, memories, automations — everything in the app database. Reseeds a default admin + agent on restart.</div>
          </div>
          <span class="ac-ability-status ac-dz-check-cell">
            <input type="checkbox" id="ac-dz-db" class="ac-dz-check" value="db" aria-label="Reset app database">
          </span>
        </label>

        <label class="ac-ability-row ac-dz-row">
          <span class="ac-ability-icon"><i data-lucide="key-round" class="lucide-icon" style="width:18px;height:18px;color:var(--danger);"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Secrets vault</div>
            <div class="ac-ability-desc">API keys, OAuth tokens, and encryption keys. The app loses its LLM key until it's re-entered.</div>
          </div>
          <span class="ac-ability-status ac-dz-check-cell">
            <input type="checkbox" id="ac-dz-secrets" class="ac-dz-check" value="secrets" aria-label="Reset secrets vault">
          </span>
