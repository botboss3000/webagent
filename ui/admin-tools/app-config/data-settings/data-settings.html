<template data-slot="#ac-section-slot-data-settings">
<section id="ac-section-data-settings" class="ac-section ac-stickynav">
  <!-- DATA SETTINGS — admin-only. No page-title header: the tab carousel already
       names this page. Follows the standard config-page layout (App Settings /
       Agent Settings) — a stack of always-open, sticky `.ac-category-group`
       headings (no chevron) plus a bottom page-assistant chat pill (like App
       Settings). See docs/claude/ui-guidance.md point 5 + "the standard
       config-page layout".

       PAGE-ASSISTANT: each `.ac-category-group` below carries a `data-pa-area`
       key (app_access · database · remote_access); the bottom pill (markup in
       app-config.html as #ac-ds-pa-bar, wired by _initPageAssistant in
       data-settings.js) reads which area the mouse is over and swaps its
       placeholder + wraps the sent message with that area's prompt. The whole
       assistant is steered toward helping the admin get people SIGNED IN to this
       instance — text catalog in app-prompts.json → page_assistants.data_settings.

       Its first group is APP ACCESS. The former DEPLOYMENT group (the local-
       deployments list — this app's HOLD-TO-RESTART + port editor, plus any sibling
       checkouts on this machine) was REMOVED from this page and MOVED to the Admin
       Tools → Instances page, into the "This device" tile's Overview as a "Server"
       section (ui/admin-tools/instances/instances.js `_serverSectionHtml`). The
       "+ New deployment" flow had already moved to that page's "New instance" tile,
       so the whole deployment surface now lives with the fleet it manages. deploy.js
       is STILL imported by this page's data-settings.js — its `initDeploy` wires the
       Export/Import setup-bundle bars that live in the DATABASE card's "Data
       Migration" row (its now-absent repo/target/instances elements are `?.`-guarded
       no-ops here). -->

  <!-- ════════════════════════════════════════════════════════════════
       APP ACCESS — how new users get into this instance (the "access mode").
       This is the former Users → Access Mode form, moved here and restyled to
       match the Deployment card (a `.ac-category-group` heading over one
       `.ac-list`). Its two options are a RADIO VARIANT of the shared toggle-list:
       each mode is an `.ac-ability-row` whose right-hand control is a radio (see
       docs/claude/ui-guidance.md "Toggle-list" → "a row's control can be a
       radio"). Picking a mode auto-saves via the SAME backend the Users form used
       (GET/POST /admin/settings/app → access_mode) — no Save button; the pick
       confirms with the unified on-top save overlay. All wiring lives in the
       sibling app-access.js (initAppAccess); the heading badge shows the current
       mode. Admin-only.

       Below the mode radios, in the SAME `.ac-list` tree, sits SOCIAL SIGN-IN
       (moved here out of the Users page): the radios say who may register, these
       drop-in providers (plugins/auth_providers/) say how they sign in — one "how
       people get into this instance" section. It reads like the ability tree: a
       "Sign in with" group-header row over individual ability-style provider rows
       (icon + name + Enabled switch + expandable keys body), rendered into
       #ac-social-list by the sibling social-auth.js (initSocialAuth).
       ════════════════════════════════════════════════════════════════ -->
  <div class="ac-category-group" id="ac-access-card" data-pa-area="app_access">
    <div class="ac-category-summary" style="cursor:default;">
      <i data-lucide="key-round" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">App Access</span>
      <span id="ac-access-badge" class="ac-category-count">loading…</span>
    </div>
    <div class="ac-category-body">
      <!-- ONE `.ac-list` tree (the ability-tree look): two access-mode rows, a
           "Sign in with" sub-head that reads like an ability-group header (icon +
           title + live count), then the provider rows — each an individual
           ability-style row (icon + name + substate + Enabled switch + expandable
           keys body), rendered by social-auth.js. The list draws every hairline
           divider, so the radios + providers read as one continuous tree.
           (No `role=radiogroup` on the list: it now also holds non-radio rows; the
           two mode radios still group by their shared `name`.) -->
      <div class="ac-list ac-access-list" id="ac-access-list" aria-label="How new users can join this instance">

        <!-- Private (admin approval) — the default. Expands to show users awaiting
             approval so the admin can authorize or reject them inline. The pending
             count badge is updated by app-access.js whenever the mode loads or an
             action is taken. The chevron wiring lives in initAppAccess(). -->
        <div class="ac-row" id="ac-row-private">
          <div class="ac-ability-row ac-access-row" id="ac-private-head">
            <span class="ac-ability-icon"><i data-lucide="shield-check" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Private — admin approval required</div>
              <div class="ac-ability-desc">New users register but cannot sign in until an admin approves them. <em>(default)</em></div>
            </div>
            <span class="ac-ability-status ac-access-radio-cell">
              <input type="radio" name="ac-access-mode" value="admin_approval" class="ac-access-radio" aria-label="Private — admin approval required">
            </span>
            <span id="ac-private-pending-badge" class="ac-category-count" style="display:none;"></span>
            <span class="ac-row-chevron" id="ac-private-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body" id="ac-private-users-body">
            <div id="ac-private-users-list"></div>
          </div>
        </div>

        <!-- Open Registration — anyone can join + sign in themselves.
             Plain <div> (not a <label>) on purpose: only the radio circle itself
             selects this mode, so clicking the row body isn't a hidden toggle. -->
        <div class="ac-ability-row ac-access-row">
          <span class="ac-ability-icon"><i data-lucide="globe" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Open Registration</div>
            <div class="ac-ability-desc">Anyone can join and sign in themselves. “Remember me” on the sign-in screen keeps each device logged in. Anonymous user permissions are controlled per-agent, not at the app level.</div>
          </div>
          <span class="ac-ability-status ac-access-radio-cell">
            <input type="radio" name="ac-access-mode" value="public_registered" class="ac-access-radio" aria-label="Open Registration">
          </span>
        </div>

        <!-- ── Sign in options ── an EXPANDABLE group-header row for the social
             providers below: a LEFT chevron + icon + title + a live "N on" count
             (set by social-auth.js), the same anatomy as an ability-group head.
             Clicking the bar expands/collapses the provider list (#ac-social-list),
             which is collapsed by default. Wired by _wireSocialHead in app-access.js;
             the collapse + left-chevron-rotate rules live in app3.css. -->
        <div class="ac-ability-row ac-access-subhead" id="ac-social-head" role="button" tabindex="0" aria-expanded="false">
          <span class="ac-row-chevron ac-row-chevron--left"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          <span class="ac-ability-icon"><i data-lucide="log-in" class="lucide-icon" style="width:16px;height:16px;color:var(--fg-muted);"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Sign in options</div>
            <div class="ac-ability-desc">One-click social login (Google, GitHub, …). A new account this way follows the access mode above.</div>
          </div>
          <span class="ac-category-count" id="ac-social-count"></span>
        </div>

        <!-- ── Provider rows ── each an individual ability-style row, rendered by
             social-auth.js. Direct child of the list so the header/first-provider
             hairline is drawn by the list; provider↔provider hairlines come from
             the `#ac-social-list > * + *` rule (app3.css). -->
        <div id="ac-social-list">
          <div class="ac-table-empty" style="padding:14px;">Loading providers…</div>
        </div>

      </div><!-- /.ac-list -->

    </div><!-- /.ac-category-body -->
  </div>

  <!-- ════════════════════════════════════════════════════════════════
       DATABASE — where the app's data lives + how it's protected. These
       seven rows were MOVED here out of the Data Management page (the former
       Core Storage + Secrets & Encryption groups, plus Data Migration) so all
       "where does my data live" controls sit under one Database heading below
       App Access. The rows are the SHARED ability-table component (`.ac-list`
       of expandable `.ac-row`s) — collapsed to one line (icon · name · live
       status badge · chevron), expanding in place to their configurator.

       IMPORTANT — the control ids are PRESERVED VERBATIM from Data Management,
       because their drivers (ui/shared/js/storage.js, ui/shared/js/data-
       management.js) bind by element id (getElementById, not section-scoped)
       and load on App-Config open via settings-view.js startStorageUi() /
       startDataManagement() — so moving the markup to this section leaves the
       drivers working unchanged. The rows' expand/collapse is wired by
       _wireDatabaseRows() in data-settings.js (mirrors the retired Data
       Management tab's _wireRows, incl. the `.ac-tri` header-toggle exclusion
       for the Encryption + Hybrid rows). storage.js pins its `root` on THIS
       section (#ac-section-data-settings) — the Data Management tab that used to
       host it was removed (its last two rows, Config Files + Stream Buffer, went
       to App Settings → Advanced). See docs/claude/ui-guidance.md +
       app/db/README.md. ════════════════════════════════════════════════ -->
  <div class="ac-category-group" id="ac-database-card" data-pa-area="database">
    <div class="ac-category-summary" style="cursor:default;">
      <i data-lucide="database" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">Database</span>
    </div>
    <div class="ac-category-body">

      <!-- Section-wide functional banner (moved with the storage rows): shown by
           storage.js when config is locked to environment variables. -->
      <div id="ac-storage-env-banner" class="ac-info-banner" style="display:none;margin-bottom:12px;border-left-color:var(--warning);color:var(--warning);">
        Configuration is locked to environment variables. UI changes are disabled. Edit the deployment to modify storage settings.
      </div>

      <div class="ac-list">

        <!-- ── Row · Application Data (the main app database) ── -->
        <div class="ac-row" id="ac-row-appdata">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="server" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Application Data</div>
              <div class="ac-ability-desc">Where the main app database lives — SQLite, Postgres, Supabase, and more.</div>
            </div>
            <span class="ac-ability-status" id="ac-storage-active-badge">loading…</span>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <label class="ac-label">Provider</label>
            <select id="ac-storage-db-provider" class="ac-input">
              <option value="sqlite">SQLite</option>
              <option value="postgres">Postgres</option>
              <option value="supabase">Supabase</option>
              <option value="aws_rds">Amazon RDS</option>
              <option value="gcp_cloud_sql">Google Cloud SQL</option>
              <option value="azure_postgres">Azure Database</option>
              <option value="neon">Neon</option>
            </select>

            <div id="ac-storage-db-notes" class="ac-provider-notes" style="margin-top:8px;padding:8px 10px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-left:3px solid var(--accent);border-radius:4px;font-size:11px;line-height:1.55;"></div>

            <div id="ac-storage-db-fields" style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;"></div>

            <!-- Natural left-to-right flow: Test → Save → create tables → Activate.
                 The button set is provider-aware (see applyProviderButtons in
                 storage.js): for Supabase, "Auto-Create Tables" is hidden and
                 table-creation is folded into "Show Schema SQL" (which becomes a
                 "copy SQL → open SQL Editor" action), because Supabase's API
                 cannot run DDL. Other providers keep real one-click Auto-Create. -->
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;">
              <button id="ac-storage-db-test" class="ac-btn">Test Connection</button>
              <button id="ac-storage-db-save" class="ac-btn">Save Config</button>
              <button id="ac-storage-db-show-sql" class="ac-btn">Show Schema SQL</button>
              <button id="ac-storage-db-bootstrap" class="ac-btn">Auto-Create Tables</button>
              <button id="ac-storage-db-activate" class="ac-btn ac-btn-primary">Activate</button>
              <!-- Sharing this connection to another device FOLDED into the app-level
                   setup bundle: the "This app" row (Deployment card) now shares DB +
                   vault + LLM + admin as one encrypted code, so the old per-row
                   "Share (QR)" / "Paste Config" were removed. See deploy.js
                   (_bootShareBody / _bootImportBody) + app/admin/bootstrap_bundle.py. -->
            </div>

            <!-- Output box for Test / Show Schema SQL / Activate, with a Copy
                 button so the generated schema (e.g. the SQL to paste into the
                 Supabase SQL Editor) can be copied in one click. The copy bar is
                 shown by storage.js only when the box actually has text; copying
                 uses the shared clipboard helper (works on localhost + LAN). -->
            <div id="ac-storage-db-output-wrap" style="margin-top:10px;">
              <div class="ac-output-copy-bar" style="display:none;justify-content:flex-end;margin-bottom:4px;">
                <button id="ac-storage-db-output-copy" type="button" class="ac-output-copy-btn" title="Copy output to clipboard"
                  style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;font-size:10px;background:var(--bg-0);border:var(--border-width) solid var(--border);border-radius:5px;color:var(--fg-3);cursor:pointer;line-height:1;">
                  <i data-lucide="copy" style="width:12px;height:12px;"></i><span>Copy</span>
                </button>
              </div>
              <pre id="ac-storage-db-output" style="margin:0;padding:8px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-radius:6px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow-y:auto;display:none;"></pre>
            </div>
          </div>
        </div>

        <!-- ── Group · User Data (Gen UI pages + chat attachments) ── an
             expandable `.ac-group` row (same pattern as the Deployment card's
             "New deployment" group): its head is one "User Data" bar; expanding
             it reveals the two per-user content stores as nested rows in the
             `.ac-group-body` — GenUI Storage + Chat Attachments — rather than
             them sitting as independent top-level rows. Sits directly below
             Application Data. The two member rows keep their EXACT wrapper +
             control ids (`ac-row-pagestorage` / `ac-storage-genui-*`,
             `ac-row-attachments` / `ac-attach-*`) so storage.js + the attachments
             driver keep binding unchanged. Both the group head's expand AND each
             nested member's own expand are wired by _wireDatabaseRows() in
             data-settings.js, which walks every `.ac-row` in the card (not just
             direct `.ac-list` children) so the nested members are covered. -->
        <div class="ac-row ac-group" id="ac-row-userdata">
          <div class="ac-ability-row ac-group-head">
            <span class="ac-ability-icon"><i data-lucide="folder" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">User Data</div>
              <div class="ac-ability-desc">Where user-generated content lives — Gen UI pages and chat attachments.</div>
            </div>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-group-body">

        <!-- ── Row · GenUI Storage (where Gen UI pages live; renamed from
             "Page Storage") ── The row wrapper id stays `ac-row-pagestorage` and
             the control ids stay `ac-storage-genui-*` so storage.js keeps binding;
             only the visible name/description changed to "GenUI Storage". -->
        <div class="ac-row" id="ac-row-pagestorage">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="layout-template" class="lucide-icon" style="width:18px;height:18px;color:var(--success);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">GenUI Storage</div>
              <div class="ac-ability-desc">Where Gen UI pages are stored — on disk, in the database, or hybrid.</div>
            </div>
            <span class="ac-ability-status" id="ac-storage-genui-badge">loading…</span>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <label class="ac-label">Mode</label>
            <select id="ac-storage-genui-mode" class="ac-input">
              <option value="filesystem">Filesystem (default — files on disk)</option>
              <option value="database">Database (full HTML in DB; survives restarts)</option>
              <option value="hybrid">Hybrid (metadata in DB, body on disk)</option>
            </select>

            <div id="ac-storage-genui-notes" class="ac-provider-notes" style="margin-top:8px;padding:8px 10px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-left:3px solid var(--success);border-radius:4px;font-size:11px;line-height:1.55;"></div>

            <div style="display:flex;gap:6px;margin-top:12px;">
              <button id="ac-storage-genui-save" class="ac-btn ac-btn-primary">Activate</button>
            </div>
            <pre id="ac-storage-genui-output" style="margin-top:10px;padding:8px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-radius:6px;font-size:11px;white-space:pre-wrap;display:none;"></pre>
          </div>
        </div>

        <!-- ── Row · Chat Attachments (per-row storage backend) ── -->
        <div class="ac-row" id="ac-row-attachments">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="paperclip" class="lucide-icon" style="width:18px;height:18px;color:var(--purple);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Chat Attachments</div>
              <div class="ac-ability-desc">Where uploaded images, voice, and dropped files are saved.</div>
            </div>
            <span class="ac-ability-status" id="ac-attach-active-badge">loading…</span>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <div class="ac-hint">
              Where chat attachments (images, voice, dropped files) are stored. Switch any time — existing files keep working because each attachment row remembers which backend wrote it.
            </div>

            <div id="ac-attach-env-banner" class="ac-info-banner" hidden style="margin-top:10px;border-left-color:var(--warning);color:var(--warning);font-size:11px;">
              Config is env-locked (WEBAGENT_CONFIG_SOURCE=env or WEBAGENT_ATTACHMENTS_STORE set). Backend can be inspected but not changed from this UI.
            </div>

            <label class="ac-label" style="margin-top:10px;">Backend</label>
            <select id="ac-attach-mode" class="ac-input"></select>

            <div id="ac-attach-blurb" class="ac-hint" style="margin-top:6px;line-height:1.5;"></div>

            <div id="ac-attach-fields" style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;"></div>

            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center;">
              <button id="ac-attach-save" class="ac-btn ac-btn-primary">Activate Backend</button>
              <button id="ac-attach-save-cfg" class="ac-btn">Save Provider Settings</button>
              <button id="ac-attach-test" class="ac-btn">Test</button>
              <span id="ac-attach-status" class="ac-hint" style="margin-left:6px;"></span>
            </div>

            <div id="ac-attach-counts" class="ac-hint" style="margin-top:8px;font-size:11px;"></div>
          </div>
        </div>

          </div><!-- /.ac-group-body -->
        </div><!-- /#ac-row-userdata -->

        <!-- ── Row · Hybrid local-first (opt-in, applies on next restart) ──
             One hold-until-confirmed toggle for app/db/hybrid.py. When ON with a
             shared Postgres remote, heavy chat detail (tool payloads) is kept in
             THIS device's local database and only the lightweight transcript
             skeleton is stored remotely (Phase-0 measured those payloads at ~99%
             of the main DB). A strict no-op on a local-only install — the badge +
             body note say so. Same spinner→✓/⚠ hold-until-confirmed flow as the
             encryption toggles (storage.js loadHybrid). The .ac-tri click is
             excluded from the row's expand handler in data-settings.js
             _wireDatabaseRows. See app/db/hybrid.py + app/db/README.md. -->
        <div class="ac-row" id="ac-row-hybrid">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="split" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Hybrid local-first</div>
              <div class="ac-ability-desc">Keep heavy chat detail (tool payloads) in this device's local database and store only the shared skeleton in the remote. Only active with a shared (Postgres) database. Applies on the next restart.</div>
            </div>
            <span class="ac-ability-status" id="ac-storage-hybrid-badge">loading…</span>
            <span class="ac-tri" id="ac-storage-hybrid-toggle" role="button" tabindex="0" data-state="off"
                  title="Turn hybrid local-first on/off"><span class="ac-tri-knob"></span></span>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <div id="ac-storage-hybrid-note" class="ac-info-banner" style="display:none;margin-top:10px;border-left-color:var(--warning);font-size:11px;line-height:1.55;"></div>
            <pre id="ac-storage-hybrid-output" style="margin-top:10px;padding:8px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-radius:6px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow-y:auto;display:none;"></pre>
          </div>
        </div>

        <!-- ── Row · Secrets Vault ── -->
        <div class="ac-row" id="ac-row-secrets">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="key-round" class="lucide-icon" style="width:18px;height:18px;color:var(--purple);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Secrets Vault</div>
              <div class="ac-ability-desc">Where API keys and OAuth tokens are kept — app DB, OS keyring, or a cloud vault.</div>
            </div>
            <span class="ac-ability-status" id="ac-storage-secrets-badge">loading…</span>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <label class="ac-label">Provider</label>
            <select id="ac-storage-secrets-provider" class="ac-input">
              <option value="inline_db">App DB (default, plaintext)</option>
              <option value="env">Environment variables (read-only)</option>
              <option value="os_keyring">OS Keyring</option>
              <!-- Shared remote vaults — every machine pointing at the remote DB
                   reads the same secrets + encryption keys. The backends are
                   drop-in files (app/secrets/*.py), auto-discovered; this list
                   only needs an <option> + matching SECRETS_NOTES/SECRETS_SETUP
                   entry in storage.js. -->
              <option value="hashicorp_vault">HashiCorp Vault</option>
              <option value="azure_key_vault">Azure Key Vault</option>
              <option value="gcp_secret_manager">GCP Secret Manager</option>
              <option value="aws_secrets_manager">AWS Secrets Manager</option>
            </select>

            <div id="ac-storage-secrets-notes" class="ac-provider-notes" style="margin-top:8px;padding:8px 10px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-left:3px solid var(--purple);border-radius:4px;font-size:11px;line-height:1.55;"></div>

            <!-- Connection fields for remote vaults — built by storage.js
                 (renderSecretsFields) from SECRETS_FIELDS[provider]. Hidden for the
                 local providers (App DB / env / OS Keyring), which need no fields.
                 This is what lets a remote vault be configured IN THE UI after
                 launch: the non-secret fields save to a local file outside the DB,
                 the token saves keyring-first with a file fallback — never the DB.
                 Each text/password input carries .ac-input so it themes correctly
                 in dark + light. -->
            <div id="ac-storage-secrets-fields" style="display:none;margin-top:10px;"></div>

            <div id="ac-storage-secrets-warning" class="ac-info-banner" style="display:none;margin-top:10px;border-left-color:var(--danger);color:var(--danger);font-size:11px;">
              Secrets stored as plaintext in main DB. Acceptable for local dev; upgrade to a vault for production.
            </div>

            <!-- Remote-DB ⨉ local-vault recommendation — shown by storage.js
                 (renderVaultRecommendation) ONLY when the Application Data database
                 is a REMOTE/networked backend (anything but local SQLite) AND the
                 chosen vault is single-host (OS Keyring) or in-DB (App DB). It
                 explains, in plain terms, the limitations of keeping the vault on one
                 machine while the data lives on a shared remote database, and points
                 at a shared cloud vault for multi-machine setups. The copy is
                 provider-aware (the App-DB and OS-Keyring cases differ). Hidden for
                 SQLite (single-host by nature) and for the already-shared cloud
                 vaults. Themed via .ac-info-banner (correct in dark + light). -->
            <div id="ac-storage-secrets-multihost" class="ac-info-banner" style="display:none;margin-top:10px;border-left-color:var(--warning);font-size:11px;line-height:1.55;"></div>

            <div style="display:flex;gap:6px;margin-top:12px;">
              <button id="ac-storage-secrets-test" class="ac-btn">Test</button>
              <button id="ac-storage-secrets-save" class="ac-btn ac-btn-primary">Activate</button>
            </div>
            <pre id="ac-storage-secrets-output" style="margin-top:10px;padding:8px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-radius:6px;font-size:11px;white-space:pre-wrap;display:none;"></pre>

            <!-- Clean-cutover restart notice — shown by storage.js
                 (renderSecretsRestart) ONLY when the live vault has diverged from
                 the one the server booted with (state.secrets.restart_recommended).
                 Switching the vault takes effect immediately for new reads, but
                 secrets already loaded at boot aren't re-fetched until a restart;
                 this offers a one-click, panel-scoped server restart (no full-app
                 reload, no sign-out) that spins until /health answers again. The
                 button/spinner/status line are built in JS so the panel can show
                 live progress. Themed via .ac-info-banner (dark + light). -->
            <div id="ac-storage-secrets-restart" class="ac-info-banner" style="display:none;margin-top:10px;border-left-color:var(--warning);font-size:11px;line-height:1.55;"></div>
          </div>
        </div>

        <!-- ── Row · Encryption (master + per-database, whole-file SQLCipher) ──
             Restructured to mirror the ability-tree GROUP pattern: a MASTER tri-
             toggle on the header (Off · Mixed · On, spanning the private
             databases) gives one-click activate/deactivate; expanding reveals one
             toggle per database so any single file can be untoggled. Default is
             all-encrypted. Every toggle is HOLD-UNTIL-CONFIRMED — the knob only
             moves after the save succeeds (storage.js loadFullDb / _toggleDb /
             _setAll): click → spinner over the toggle → ✓ on success, ⚠ + no-move
             on failure, exactly like the agent ability toggles. The older
             per-secret field encryption + key tools live under the Advanced
             disclosure at the bottom. The whole-file conversion still happens at
             the next restart; a toggle records intent only. All control IDs are
             preserved so the existing storage.js handlers keep binding.
             See app/db/db_crypto.py. -->
        <div class="ac-row" id="ac-row-encryption">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="lock" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Encryption</div>
              <div class="ac-ability-desc">Encrypt databases at rest (SQLCipher) — each as a whole file under its own key in the keyring vault. Back up the vault's master key: if the keyring is lost the data can't be recovered. Applies on the next restart.</div>
            </div>
            <span class="ac-ability-status" id="ac-storage-enc-badge">loading…</span>
            <!-- MASTER tri (Off · Mixed · On). Static markup; storage.js drives the
                 data-state from the live per-database status and wires the hold-
                 until-confirmed bulk set. A .ac-tri click is excluded from the
                 row's expand handler in data-settings.js _wireDatabaseRows. -->
            <span class="ac-tri" id="ac-storage-enc-master" role="button" tabindex="0" data-state="off"
                  title="Master encryption — click the left half to turn ALL databases off, the right half to turn ALL on"><span class="ac-tri-knob"></span></span>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <!-- Functional banner only: storage.js shows WHY encryption can't be
                 managed here (engine missing / no keyring / env-locked). The
                 descriptive copy lives once on the row header above (the separate
                 notes box was removed as a duplicate). -->
            <div id="ac-storage-fulldb-warning" class="ac-info-banner" style="display:none;margin-top:10px;border-left-color:var(--danger);color:var(--danger);font-size:11px;"></div>

            <!-- Per-database toggles (built by storage.js loadFullDb). -->
            <div id="ac-storage-fulldb-list" style="margin-top:12px;display:flex;flex-direction:column;gap:2px;"></div>
            <pre id="ac-storage-fulldb-output" style="margin-top:10px;padding:8px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-radius:6px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow-y:auto;display:none;"></pre>

            <!-- ── Advanced disclosure — per-secret field encryption + key tools ──
                 Collapsed by default (sliders toggle, like the model table's
                 Advanced row). Holds the older field-level (Fernet) controls. -->
            <div id="ac-storage-enc-adv" style="margin-top:14px;border-top:var(--border-width) solid var(--border);padding-top:10px;">
              <div id="ac-storage-enc-adv-toggle" role="button" tabindex="0" style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);">
                <i data-lucide="sliders-horizontal" class="lucide-icon" style="width:16px;height:16px;"></i>
                <span style="flex:1;font-size:12px;font-weight:600;">Advanced — per-secret field encryption, key generation &amp; rotation</span>
                <span class="ac-row-chevron" style="transition:transform .15s;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
              </div>
              <div id="ac-storage-enc-adv-body" style="display:none;margin-top:12px;">
                <div id="ac-storage-enc-vault-warning" class="ac-info-banner" style="display:none;margin-top:4px;border-left-color:var(--danger);color:var(--danger);font-size:11px;">
                  Secrets vault is set to <strong>inline_db</strong> while the database backend is remote. Encryption keys would live in the same DB they protect. Switch the Secrets Vault provider above before enabling per-tenant encryption.
                </div>

                <!-- Per-secret field encryption — ONE hold-until-confirmed toggle
                     (replaces the former None/Field dropdown + Activate Level +
                     Encrypt Existing Rows + Decrypt Back to Plaintext buttons).
                     This is a SEPARATE layer from the whole-database toggles above:
                     it scrambles individual secret VALUES under per-tenant keys, so
                     it still protects secrets while the DB is open AND it is the only
                     at-rest protection available on cloud databases (Postgres/
                     Supabase), where whole-file SQLCipher isn't possible.
                       ON  = activate the field level + encrypt existing rows.
                       OFF = decrypt all rows back to plaintext + set level to none.
                     storage.js _toggleFieldEnc drives it with the same spinner→✓/⚠
                     hold-until-confirmed flow as the whole-DB toggles. -->
                <div class="ac-ability-row" style="padding-top:4px;">
                  <span class="ac-ability-icon"><i data-lucide="key" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i></span>
                  <div class="ac-ability-label">
                    <div class="ac-ability-name" style="font-size:13px;">Per-secret field encryption <span class="ac-ability-status" id="ac-storage-enc-level-badge" style="margin-left:6px;"></span></div>
                    <div class="ac-ability-desc" id="ac-storage-enc-field-status">Encrypts individual secret values under a per-tenant key (Fernet) — works on every backend, including cloud databases.</div>
                  </div>
                  <span class="ac-tri" id="ac-storage-enc-level-tri" role="button" tabindex="0" data-state="off"
                        title="Turn per-secret field encryption on or off (converts existing rows)"><span class="ac-tri-knob"></span></span>
                </div>

                <div id="ac-storage-enc-notes" class="ac-provider-notes" style="margin-top:8px;padding:8px 10px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-left:3px solid var(--accent);border-radius:4px;font-size:11px;line-height:1.55;"></div>

                <!-- Expert key tools only — generation, rotation, and a round-trip
                     probe. The activate / encrypt / decrypt actions are folded into
                     the toggle above. -->
                <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;">
                  <button id="ac-storage-enc-kek-generate" class="ac-btn">Generate KEK</button>
                  <button id="ac-storage-enc-kek-rotate" class="ac-btn">Rotate KEK</button>
                  <button id="ac-storage-enc-test" class="ac-btn">Test Round-Trip</button>
                </div>

                <div style="margin-top:14px;">
                  <div style="font-size:11px;font-weight:600;color:var(--muted);">Per-tenant keys</div>
                  <div id="ac-storage-enc-tenants" style="margin-top:6px;font-size:11px;max-height:200px;overflow-y:auto;border:var(--border-width) solid var(--border);border-radius:6px;padding:6px;display:none;"></div>
                </div>

                <pre id="ac-storage-enc-output" style="margin-top:10px;padding:8px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-radius:6px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow-y:auto;display:none;"></pre>
              </div>
            </div>
          </div>
        </div>

        <!-- ── Row · RAM speed layer (in-browser media cache) ──
             App-wide On/Off + memory budget for ui/shared/js/media-cache.js — the
             volatile browser-memory cache that serves attachment previews,
             thumbnails and Gen UI media instantly on repeat renders. It is a SPEED
             LAYER in front of whatever store holds the bytes, never a place of
             record. Persists to /admin/settings/app (media_cache_enabled /
             media_cache_budget_mb) and previews live via WA_APPEARANCE.setOverrides.
             Driver: ui/admin-tools/app-config/data-settings/media-cache-settings.js. -->
        <div class="ac-row" id="ac-row-mediacache">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="zap" class="lucide-icon" style="width:18px;height:18px;color:var(--warning);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Memory Cache (RAM)</div>
              <div class="ac-ability-desc">Hold recent attachments &amp; thumbnails in browser memory for instant re-display. A speed layer, not storage.</div>
            </div>
            <span class="ac-ability-status" id="ac-mediacache-badge">loading…</span>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <div class="ac-hint" style="line-height:1.5;">
              Keeps recently-viewed images, thumbnails and previews in this browser's memory so scrolling back through chat or reopening a file is instant — no refetch. It sits <b>in front of</b> whichever store actually holds the file (server disk, database, cloud, or this device), so nothing is lost when it's off. Memory is <b>volatile</b> (cleared on reload) and <b>capped</b>: once the budget is reached, the least-recently-used items are dropped, so it can never exceed the limit you set.
            </div>

            <label class="ac-label" style="margin-top:12px;">Status</label>
            <select id="ac-mediacache-enabled" class="ac-input">
              <option value="on">On — cache media in memory (recommended)</option>
              <option value="off">Off — always fetch from the store</option>
            </select>

            <label class="ac-label" style="margin-top:10px;">Memory budget (MB)</label>
            <input id="ac-mediacache-budget" class="ac-input" type="number" min="0" step="16" placeholder="128" />
            <div class="ac-hint" style="margin-top:6px;font-size:11px;">Upper limit on how much browser memory the cache may use. Applies per device — lower it on phones/tablets, raise it on desktops with plenty of RAM.</div>

            <div id="ac-mediacache-stats" class="ac-hint" style="margin-top:8px;font-size:11px;"></div>
          </div>
        </div>

        <!-- ── Row · Data Migration ── expands to TWO kinds of move:
             (a) the raw DATA move — export the current backend's tables to a JSON
                 file, switch the active backend above, then import that file;
             (b) the CONFIG move — the setup-bundle Export/Import bars (moved here
                 from the Deployment card), two NESTED expandable `.ac-row`s that
                 package / adopt this install's DB + vault + model connection as
                 one copyable code. Their control ids (#ac-deploy-export-row /
                 #ac-deploy-import-row + every data-boot-* hook) are PRESERVED, so
                 deploy.js `_initBootRows` still binds their Generate/Copy/Preview/
                 Accept actions by id, unchanged. Their head-expand is covered by
                 _wireDatabaseRows() (it walks every `.ac-row` in this card, so the
                 nested config bars get their own expand handler like the User Data
                 group's members do). Engine: app/admin/bootstrap_bundle.py. -->
        <div class="ac-row" id="ac-row-migration">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="arrow-right-left" class="lucide-icon" style="width:18px;height:18px;color:var(--success);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Data Migration</div>
              <div class="ac-ability-desc">Move data or config between backends — export the current backend to JSON, or share this install's setup as a code.</div>
            </div>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <div class="ac-hint">
              Export current backend data to JSON, switch active backend, then import the file. Heavy tables may take a while.
            </div>
            <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;">
              <button id="ac-storage-export-btn" class="ac-btn ac-btn-primary">Export to JSON</button>
              <label class="ac-btn" style="cursor:pointer;">
                Import JSON
                <input id="ac-storage-import-input" type="file" accept="application/json" style="display:none;">
              </label>
            </div>
            <pre id="ac-storage-migrate-output" style="margin-top:10px;padding:8px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-radius:6px;font-size:11px;white-space:pre-wrap;max-height:240px;overflow-y:auto;display:none;"></pre>

            <!-- ── Config move (setup-bundle Export / Import) ── the two bars MOVED
                 here from the Deployment card, wrapped in their own nested `.ac-list`
                 so they read as a framed sub-table (border + hairline divider) under
                 the JSON data-move above. Each is an expandable `.ac-row`; the
                 container draws the divider between them. Head-expand is wired by
                 _wireDatabaseRows (it walks every `.ac-row` in this card); the
                 Generate/Copy/Preview/Accept actions by deploy.js _initBootRows,
                 bound by id — so the ids + every data-boot-* hook are PRESERVED.
                 Engine: app/admin/bootstrap_bundle.py, via /admin/storage/bootstrap/*.
                 Never includes the admin login — the real password can't be
                 recovered from its stored hash. -->
            <div class="ac-list" style="margin-top:14px;">

              <!-- Export config → one copyable setup code. -->
              <div class="ac-row" id="ac-deploy-export-row">
                <div class="ac-ability-row">
                  <span class="ac-ability-icon"><i data-lucide="share-2" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
                  <div class="ac-ability-label">
                    <div class="ac-ability-name">Export config to link another account</div>
                    <div class="ac-ability-desc">Package this install's setup into one copyable code so another WebAgent comes up ready-configured.</div>
                  </div>
                  <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
                </div>
                <div class="ac-ability-body">
                  <div class="ac-hint" style="font-size:11px;margin-bottom:8px;line-height:1.5;">Tick what to include, then generate the code — paste it into a freshly-cloned WebAgent (on its setup page, or into Import below).</div>
                  <label class="ac-boot-check" style="display:flex;align-items:flex-start;gap:8px;margin:4px 0;font-size:12px;cursor:pointer;"><input type="checkbox" data-boot-sec="llm" checked style="margin-top:2px;"><span><strong>AI model &amp; key</strong> — <span style="color:var(--fg-3);">provider, preset model, the saved-model table + API key</span></span></label>
                  <label class="ac-boot-check" style="display:flex;align-items:flex-start;gap:8px;margin:4px 0;font-size:12px;cursor:pointer;"><input type="checkbox" data-boot-sec="database" checked style="margin-top:2px;"><span><strong>Database</strong> — <span style="color:var(--fg-3);">the app database connection (+ password)</span></span></label>
                  <label class="ac-boot-check" style="display:flex;align-items:flex-start;gap:8px;margin:4px 0;font-size:12px;cursor:pointer;"><input type="checkbox" data-boot-sec="vault" checked style="margin-top:2px;"><span><strong>Secrets vault</strong> — <span style="color:var(--fg-3);">which vault backend and its connection</span></span></label>
                  <div class="ac-ra-actions" style="margin-top:10px;"><button class="ac-btn ac-deploy-go-btn" type="button" data-boot-share>Generate code</button></div>
                  <span class="ac-hint" data-boot-share-status style="display:block;margin-top:6px;"></span>
                  <div data-boot-share-result style="display:none;margin-top:12px;">
                    <div class="ac-info-banner" style="border-left-color:var(--warning);font-size:11px;line-height:1.5;margin-bottom:8px;">Anyone with this code can configure a new install with these keys. Treat it like a password — share it privately.</div>
                    <textarea data-boot-code readonly rows="3" style="width:100%;padding:6px 8px;border:var(--border-width) solid var(--border);border-radius:4px;font-size:11px;font-family:var(--font-mono,monospace);background:transparent;color:inherit;resize:vertical;word-break:break-all;"></textarea>
                    <div class="ac-ra-actions" style="margin-top:6px;"><button class="ac-btn ac-deploy-go-btn" type="button" data-boot-copy><i data-lucide="copy"></i> Copy code</button></div>
                  </div>
                </div>
              </div>

              <!-- Import config → paste a code, Preview, Accept (mirror of Export). -->
              <div class="ac-row" id="ac-deploy-import-row">
                <div class="ac-ability-row">
                  <span class="ac-ability-icon"><i data-lucide="log-in" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
                  <div class="ac-ability-label">
                    <div class="ac-ability-name">Import config to link this account</div>
                    <div class="ac-ability-desc">Paste a code from another WebAgent to adopt its database, vault and model here.</div>
                  </div>
                  <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
                </div>
                <div class="ac-ability-body">
                  <div class="ac-hint" style="font-size:11px;margin-bottom:8px;line-height:1.5;">Paste a code from another WebAgent to bring its configuration into this install.</div>
                  <textarea data-boot-import-code rows="3" placeholder="Paste the setup code (WABOOT2…) here" style="width:100%;padding:6px 8px;border:var(--border-width) solid var(--border);border-radius:4px;font-size:11px;font-family:var(--font-mono,monospace);background:transparent;color:inherit;resize:vertical;word-break:break-all;"></textarea>
                  <div class="ac-ra-actions" style="margin-top:8px;"><button class="ac-btn ac-deploy-go-btn" type="button" data-boot-preview>Preview</button></div>
                  <span class="ac-hint" data-boot-import-status style="display:block;margin-top:6px;"></span>
                  <div data-boot-preview-result style="display:none;margin-top:12px;"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div><!-- /.ac-list -->
    </div><!-- /.ac-category-body -->
  </div><!-- /#ac-database-card -->

  <!-- ════════════════════════════════════════════════════════════════
       REMOTE ACCESS — one heading, one neat table (the shared ability-table
       component: .ac-list / .ac-row / .ac-ability-row / .ac-ability-body).
       This MERGES what used to be two separate, overlapping groups —
       "Remote Access" (/admin/remote-access/*, wired in
       ui/shared/js/remote-access.js) and "Tunnel" (/admin/tunnel-link/*, wired
       in ui/shared/js/tunnel-link.js). Both backends are unchanged; this is a
       UI reorg only. Two expandable rows:
         1. Same network (Wi-Fi)      — the LAN addresses, stacked, each with a
            copy + QR-popup button (ac-ra-sn-urls)
         2. Reach it from anywhere    — the method configurator (ac-ra-method,
            ac-ra-fields, start/stop/test/save, auto-start, runtime status)
       (The former "On your phone" row — phone bookmark / signpost + the
       tunnel.webagent.live scan-to-link — was removed from the UI. Its backend
       endpoints and JS modules (remote-access.js phone/signpost wiring,
       tunnel-link.js) remain but render nothing now that the markup is gone.)
       EVERY element id the two JS modules read/write is preserved verbatim, so
       the wiring keeps working untouched. The rows expand/collapse via
       _wireBootRow() in the sibling data-settings.js (clicks on a control inside
       a body never toggle the row — the listener is bound to the head only).
       (Moved here from App Settings — it sits directly below the DATABASE card.)
       ════════════════════════════════════════════════════════════════ -->
  <div class="ac-category-group" id="ac-ra-card" data-pa-area="remote_access">
    <div class="ac-category-summary" style="cursor:default;">
      <i data-lucide="radio-tower" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">Remote Access</span>

    <div class="ac-category-body">
      <div id="ac-ra-env-banner" class="ac-info-banner" hidden style="border-left-color:var(--warning);color:var(--warning);font-size:11px;">
        Config is env-locked (WEBAGENT_CONFIG_SOURCE=env). Settings can be viewed but not changed here.
      </div>

      <div class="ac-list" id="ac-ra-list" style="margin-top:10px;">

        <!-- ── Row 1 · Same network (Wi-Fi) — open by default (the primary,
             no-setup addresses; clicking the head still collapses it) ── -->
        <div class="ac-row expanded" id="ac-ra-row-sn">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="wifi" class="lucide-icon" style="width:18px;height:18px;color:var(--success);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Same network (Wi-Fi)</div>
              <div class="ac-ability-desc">Open this address on a device on the same Wi-Fi &mdash; no setup. (Plain http; secure-context features like Google sign-in need a tunnel.)</div>
            </div>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <!-- Every LAN address stacked, uniform font/size/colour; each row gets
                 its own Copy + QR button. QR opens a popup (built in remote-access.js). -->
            <div id="ac-ra-sn-urls" class="ac-ra-sn-urls"></div>
          </div>
        </div>

        <!-- ── Row 2 · Reach it from anywhere (the method configurator) ── -->
        <div class="ac-row" id="ac-ra-row-net">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="globe" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Reach it from anywhere</div>
              <div class="ac-ability-desc">Choose how this PC becomes reachable over the internet, configure it, then start it.</div>
            </div>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <label class="ac-label">Remote method</label>
            <select id="ac-ra-method" class="ac-input">
              <option value="same_network">Same network only (no remote tunnel)</option>
              <option value="ngrok">ngrok &mdash; app-managed tunnel</option>
              <option value="cloudflare">Cloudflare &mdash; named tunnel on your domain</option>
              <option value="tailscale">Tailscale &mdash; private mesh</option>
              <option value="manual">Port-forward &mdash; manual</option>
            </select>
            <div id="ac-ra-blurb" class="ac-hint" style="line-height:1.5;"></div>
            <div id="ac-ra-fields" class="ac-ra-fields"></div>

            <div class="ac-ra-actions">
              <button id="ac-ra-start" class="ac-btn ac-ra-icon-btn ac-ra-icon-btn-primary" type="button" title="Start" aria-label="Start"><i data-lucide="play"></i></button>
              <button id="ac-ra-stop" class="ac-btn ac-ra-icon-btn" type="button" title="Stop" aria-label="Stop"><i data-lucide="square"></i></button>
              <button id="ac-ra-test" class="ac-btn ac-ra-icon-btn" type="button" title="Test" aria-label="Test"><i data-lucide="activity"></i></button>
              <button id="ac-ra-save-cfg" class="ac-btn ac-ra-icon-btn" type="button" title="Save settings" aria-label="Save settings"><i data-lucide="save"></i></button>
              <label class="ac-ra-check-lbl">
                <input type="checkbox" id="ac-ra-autostart"> Start on boot
              </label>
              <span id="ac-ra-status" class="ac-hint" style="margin-left:6px;"></span>
            </div>
            <div id="ac-ra-public-row" class="ac-hint" style="margin-top:8px;font-size:12px;"></div>
          </div>
        </div>

      </div><!-- /.ac-list -->
    </div><!-- /.ac-category-body -->
  </div><!-- /#ac-ra-card -->

  <!-- ════════════════════════════════════════════════════════════════
       DANGER ZONE — reset selected data groups, or delete the whole install.
       A `.ac-category-group` (same shell as the cards above) with a DANGER-tinted
       heading. Two destructive actions, both admin-only + confirm-gated:

         1. RESET DATA — a `.ac-list` of five tick-rows (database · vault ·
            attachments · genui · logs), each an `.ac-ability-row` with a checkbox
            on the right (mirrors the App-Access radio rows). "Reset selected"
            can't wipe in-process (the app holds its own DB/vault open), so it
            writes a one-shot marker + self-restarts; the fresh boot wipes the
            picked groups before anything opens them, keeping a backup under temp/.
            Backed by POST /admin/storage/reset (app/admin/storage.py →
            app/util/reset_boot.py). After the reboot that ran it, GET
            /admin/storage/reset/info returns the outcome, shown in #ac-dz-last.

         2. DELETE INSTALLATION — self-destruct. Removes the entire app folder
            from disk (stops + destroys this running app). Extra-guarded: the admin
            must type the install folder's name (shown by the info fetch) to arm
            the button. Backed by POST /admin/storage/delete-install, which spawns
            a detached helper OUTSIDE the repo that deletes the folder once the
            server exits.

       All wiring lives in the sibling danger-zone.js (initDangerZone), init'd from
       data-settings.js. data-pa-area reuses "database" so the page-assistant pill
       keeps working (no new prompt-catalog area needed).
       ════════════════════════════════════════════════════════════════ -->
  <div class="ac-category-group ac-dz-card" id="ac-danger-card" data-pa-area="database">
    <div class="ac-category-summary" style="cursor:default;">
      <i data-lucide="triangle-alert" class="lucide-icon" style="width:16px;height:16px;color:var(--danger);"></i>
      <span class="ac-category-title" style="color:var(--danger);">Danger Zone</span>
    </div>
    <div class="ac-category-body">

      <!-- Outcome of the reset that just ran (filled + shown by danger-zone.js from
           GET /admin/storage/reset/info after the reboot). Dismissable. -->
      <div id="ac-dz-last" class="ac-info-banner" style="display:none;margin-bottom:12px;border-left-color:var(--success);font-size:11.5px;line-height:1.55;"></div>

      <!-- Host-can't-self-restart banner (shown when auto_restart is false). -->
      <div id="ac-dz-norestart" class="ac-info-banner" style="display:none;margin-bottom:12px;border-left-color:var(--warning);color:var(--warning);font-size:11.5px;line-height:1.55;"></div>

      <div class="ac-hint" style="margin-bottom:10px;line-height:1.55;">
        Wipe selected data and start fresh. The app restarts and rebuilds a clean database
        (with the default admin + default agent) on the way back up. A copy of the removed files
        is kept under <code>temp/</code> so a reset is reversible — except a shared (Postgres)
        database, whose schema is dropped and <strong>cannot</strong> be undone.
      </div>

      <!-- ── Reset targets ── one tick-row per group. Checkbox on the right; the
           whole row toggles it (wired in danger-zone.js). -->
      <div class="ac-list" id="ac-dz-list">

        <label class="ac-ability-row ac-dz-row">
          <span class="ac-ability-icon"><i data-lucide="database" class="lucide-icon" style="width:18px;height:18px;color:var(--danger);"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">App database</div>
            <div class="ac-ability-desc">Chat sessions, agents, users, memories, automations — everything in the app database. Reseeds a default admin + agent on restart.</div>
          </div>
          <span class="ac-ability-status ac-dz-check-cell">
            <input type="checkbox" id="ac-dz-db" class="ac-dz-check" value="db" aria-label="Reset app database">
          </span>
        </label>

        <label class="ac-ability-row ac-dz-row">
          <span class="ac-ability-icon"><i data-lucide="key-round" class="lucide-icon" style="width:18px;height:18px;color:var(--danger);"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Secrets vault</div>
            <div class="ac-ability-desc">API keys, OAuth tokens, and encryption keys. The app loses its LLM key until it's re-entered.</div>
          </div>
          <span class="ac-ability-status ac-dz-check-cell">
            <input type="checkbox" id="ac-dz-secrets" class="ac-dz-check" value="secrets" aria-label="Reset secrets vault">
          </span>
        </label>

        <label class="ac-ability-row ac-dz-row">
          <span class="ac-ability-icon"><i data-lucide="paperclip" class="lucide-icon" style="width:18px;height:18px;color:var(--danger);"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Chat attachments</div>
            <div class="ac-ability-desc">Uploaded images, voice notes, and dropped files on disk.</div>
          </div>
          <span class="ac-ability-status ac-dz-check-cell">
            <input type="checkbox" id="ac-dz-attachments" class="ac-dz-check" value="attachments" aria-label="Reset chat attachments">
          </span>
        </label>

        <label class="ac-ability-row ac-dz-row">
          <span class="ac-ability-icon"><i data-lucide="layout-template" class="lucide-icon" style="width:18px;height:18px;color:var(--danger);"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Gen UI pages</div>
            <div class="ac-ability-desc">All generated Gen UI pages stored on disk.</div>
          </div>
          <span class="ac-ability-status ac-dz-check-cell">
            <input type="checkbox" id="ac-dz-genui" class="ac-dz-check" value="genui" aria-label="Reset Gen UI pages">
          </span>
        </label>

        <label class="ac-ability-row ac-dz-row">
          <span class="ac-ability-icon"><i data-lucide="scroll-text" class="lucide-icon" style="width:18px;height:18px;color:var(--danger);"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Logs &amp; diagnostics</div>
            <div class="ac-ability-desc">Server logs, diagnostics, and tool-execution history (logs.db / recordings.db).</div>
          </div>
          <span class="ac-ability-status ac-dz-check-cell">
            <input type="checkbox" id="ac-dz-logs" class="ac-dz-check" value="logs" aria-label="Reset logs and diagnostics">
          </span>
        </label>

      </div><!-- /#ac-dz-list -->

      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;">
        <!-- Hold-to-fire button: press and hold and a danger fill sweeps left→right;
             hold to the end and the reset runs (the hold IS the confirmation — no
             dialog). Mirrors the deploy card's hold-to-restart button. Wired by
             danger-zone.js _beginHold; the fill duration is set from JS via --dz-hold. -->
        <button id="ac-dz-reset-btn" class="ac-btn ac-deploy-danger-btn ac-dz-hold" type="button" disabled>
          <span class="ac-dz-fill"></span>
          <span class="ac-dz-hold-label">Hold to reset selected data</span>
        </button>
        <span id="ac-dz-reset-status" class="ac-hint" style="margin-left:2px;font-size:11.5px;"></span>
      </div>

      <!-- ── Delete entire installation (self-destruct) ── separated + extra
           guarded: the admin must type the folder name to arm the button. -->
      <div class="ac-dz-nuke" style="margin-top:20px;border-top:var(--border-width) solid var(--border);padding-top:16px;">
        <div class="ac-ability-name" style="color:var(--danger);display:flex;align-items:center;gap:6px;">
          <i data-lucide="trash-2" class="lucide-icon" style="width:15px;height:15px;"></i>Delete entire installation
        </div>
        <div class="ac-hint" style="margin-top:6px;line-height:1.55;">
          Permanently deletes this app's whole folder from the machine and shuts the server down.
          <strong>This stops and destroys the app itself</strong> — it does not restart. There is no backup.
          To confirm, type the installation folder's name below.
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;">
          <input id="ac-dz-nuke-phrase" class="ac-input" type="text" autocomplete="off" spellcheck="false"
                 placeholder="type the folder name to confirm" style="flex:1 1 220px;min-width:0;max-width:320px;">
          <button id="ac-dz-nuke-btn" class="ac-btn ac-deploy-danger-btn ac-dz-hold" type="button" disabled>
            <span class="ac-dz-fill"></span>
            <span class="ac-dz-hold-label">Hold to delete installation</span>
          </button>
          <span id="ac-dz-nuke-status" class="ac-hint" style="margin-left:2px;font-size:11.5px;"></span>
        </div>
      </div>

    </div><!-- /.ac-category-body -->
  </div><!-- /#ac-danger-card -->

</section>
</template>
