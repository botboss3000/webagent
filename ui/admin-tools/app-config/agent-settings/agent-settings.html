<template data-slot="#ac-section-slot-agent-settings">
<section id="ac-section-agent-settings" class="ac-section ac-stickynav active is-building">
  <!-- BUILD GATE: `is-building` (above) hides every child below and shows only
       the spinner here until agent-settings.js init() finishes wiring the
       ability/integration/model tables, then removes the class. Without it the
       raw markup flashes as a half-formatted page. See `.ac-section.is-building`
       in ui/shared/css/app3.css. -->
  <div class="ac-section-loader" aria-hidden="true">
    <div class="ac-tree-spinner"></div>
    <div class="ac-section-loader-label">Loading settings…</div>
  </div>
  <!-- REMOVED (by request): the section header ("Agent Settings" + subtitle), the
       "Search integrations…" field (#ac-int-filter), and the "Use AI to create or
       customize an integration" chat card (#ac-int-admin-chat-card). The Agent
       Tools table now owns the page's only search/chat — its built-in hybrid
       search-and-ask pill (see admin-ability-table.js) covers both jobs, so this
       duplicate header/search/chat stack was dropped. The JS that wired these ids
       (_initIntegrationsSearch / _initIntegrationAdminChat) all no-op when the
       elements are absent (`if (!el) return`), so nothing else needs changing. -->

  <!-- ── Models (always visible — no collapsible heading) ──
       Two bare flush tables (no wrapping card): a 4-row CONFIGURATOR
       (provider / base url / key / model) whose fields auto-save to the
       DB on change — each showing the shared green auto-save check, same
       as the agent abilities table — and a SAVED MODELS table whose rows
       expand to show token usage + cost. Capabilities are detected from
       the model catalog (models.dev / OpenRouter), not entered by hand. -->
  <!-- data-pa-area: the bottom page-assistant pill (#ac-as-pa-bar) reads which
       area the mouse is over via closest('[data-pa-area]') and swaps its
       placeholder + the prompt it hands webAgent. Keys map to
       data/config/app-prompts.json → page_assistants.agent_settings.areas. -->
  <div class="ac-category-group" id="ac-cat-models" data-pa-area="models">
    <!-- Always-open heading (no chevron): a pinnable section label for the
         sticky section navigator (see ../sticky-nav.js). -->
    <div class="ac-category-summary">
      <i data-lucide="cpu" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">Models</span>
    </div>
    <div class="ac-category-body">

      <!-- The Models configurator + saved-models table is built by the shared
           component ui/shared/js/model-table.js (mounted into #ac-model-host by
           agent-settings.js). SISTER-PANEL: MODEL-TABLE — the agent card's Config
           tab mounts the SAME component; keep them mirrored. The "Default" radio
           (left of Text/In/Out) picks the one model the agent runs by default.
           The app-global extras below (AI message suggestions + "Extend default
           LLM to agents") are NOT part of the table: on mount the component
           RELOCATES #ac-model-adv-extras into its Advanced (sliders) panel, so
           their ids stay live for app-settings.js + _initSuggestionsCheckbox. -->
      <div id="ac-model-host"></div>
      <div id="ac-model-adv-extras" style="display:none;">
        <label class="ac-label" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px 0 0 0;">
          <input type="checkbox" id="ac-use-ai-suggestions" style="width:15px;height:15px;accent-color:var(--brand);cursor:pointer;">
          <span>Use AI message suggestions — EXPERIMENTAL</span>
        </label>
        <div class="ac-hint" style="margin:2px 0 14px 23px;">Grey suggestion chips above the chat box, written in your voice. Requires a configured model.</div>
        <label class="ac-label" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:0;">
          <input type="checkbox" id="ac-extend-llm-to-agents" checked style="width:15px;height:15px;accent-color:var(--brand);cursor:pointer;">
          <span>Extend default LLM to agents</span>
        </label>
        <div class="ac-hint" style="margin:2px 0 6px 23px;">When enabled, agents can select from "Inherited" options.</div>
        <div style="margin:0 0 14px 23px;color:var(--warning);font-size:13px;line-height:1.5;">
          <strong>Warning:</strong> Any agents currently configured to use the app default models will have their connections to the model provider ended
        </div>
        <div class="ac-actions" style="margin-left:23px;">
          <button id="ac-app-settings-save" class="ac-btn ac-btn-primary">Save</button>
        </div>
      </div>
      <span id="ac-settings-status" class="ac-status" style="display:none;margin-top:8px;"></span>
    </div>
  </div>

  <!-- ── Agent Tools — the single unified groups table. No category
       header: the host-ability groups (Administrator / Core / Web) AND
       the former integration "categories" (Communication, Productivity,
       Social Media, Marketplaces, Payments, Developer, CRM) all render as
       expandable group rows inside #ac-abilities-compact. The legacy
       category <details> below are emptied + hidden at runtime by
       _placeIntegrationGroupCards(). ── -->
  <div class="ac-category-group" id="ac-cat-agent-tools" data-pa-area="agent_tools">
    <!-- Always-open heading (no chevron): a pinnable section label for the
         sticky section navigator. The host-ability + integration groups still
         render as expandable rows INSIDE the table below; this only labels the
         whole Agent Tools section so it can pin/jump like the other pages. -->
    <div class="ac-category-summary">
      <i data-lucide="wrench" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">Agent Tools</span>
    </div>
    <div class="ac-category-body">

      <!-- Agent Tools — compact row layout with toggle -->
      <div class="ac-abilities-compact" id="ac-abilities-compact">
        <!-- Each ability is a single row with icon, name, desc, toggle.
             Simple abilities toggle directly. Complex abilities (need config)
             expand to show a config panel when toggled. -->
      </div>
      <span id="ac-abilities-compact-status" class="ac-status" style="display:none;"></span>

      <!-- ── Complex ability config panels (hidden by default, shown on expand) ── -->
      <div id="ac-ability-config-panels" style="margin-top:8px;display:flex;flex-direction:column;gap:8px;">

        <!-- Image Generation config -->
        <div class="ac-card" id="ac-int-image_generation-card" style="display:none;">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
            <i data-lucide="image" class="lucide-icon" style="width:20px;height:20px;flex-shrink:0;color:var(--purple);"></i>
            <div style="flex:1;">
              <div style="font-weight:600;font-size:13px;">Image Generation — Configuration</div>
              <div class="ac-hint" style="margin:0;">Configure a provider + model for image generation before enabling the toggle above.</div>
            </div>
          </div>
          <div id="ac-int-image_generation-configured" style="display:none;font-size:12px;">
            <div class="ac-hint" style="margin:0;">Image Generation is available on the agent's <strong>Abilities</strong> tab.</div>
            <div style="margin-top:12px;display:flex;gap:8px;">
              <button id="ac-int-image_generation-unconfigure" class="ac-btn ac-btn-ghost" style="color:var(--danger);">Disable</button>
            </div>
          </div>
          <div id="ac-int-image_generation-form" style="display:block;">
            <div class="ac-hint" style="margin:0 0 10px;">Enabling exposes Image Generation as a toggle to agent admins. The agent's <code>generate_image</code> tool uses whichever provider you configured under Image Generation.</div>
            <button id="ac-int-image_generation-save" class="ac-btn ac-btn-primary">Enable Image Generation</button>
          </div>
          <span id="ac-int-image_generation-status" class="ac-status" style="display:none;margin-top:8px;"></span>
        </div>

        <!-- Automation config -->
        <div class="ac-card" id="ac-int-automation-card" style="display:none;">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
            <i data-lucide="clock" class="lucide-icon" style="width:20px;height:20px;flex-shrink:0;color:var(--warning);"></i>
            <div style="flex:1;">
              <div style="font-weight:600;font-size:13px;">Automation — Configuration</div>
              <div class="ac-hint" style="margin:0;">Configure automation settings before enabling the toggle above.</div>
            </div>
          </div>
          <div id="ac-int-automation-configured" style="display:none;font-size:12px;">
            <div class="ac-hint" style="margin:0;">Automation is available on each agent's <strong>Abilities</strong> tab.</div>
            <div class="ac-hint" style="margin:8px 0 0;color:var(--danger);"><strong>Warning:</strong> Disabling will permanently delete every agent's scheduled tasks and event subscriptions.</div>
            <div style="margin-top:12px;display:flex;gap:8px;">
              <button id="ac-int-automation-unconfigure" class="ac-btn ac-btn-ghost" style="color:var(--danger);">Disable</button>
            </div>
          </div>
          <div id="ac-int-automation-form" style="display:block;">
            <div class="ac-hint" style="margin:0 0 10px;">Enabling exposes Automation as a per-agent toggle. Agents with the toggle off see no Automation tab.</div>
            <button id="ac-int-automation-save" class="ac-btn ac-btn-primary">Enable Automation</button>
          </div>
          <span id="ac-int-automation-status" class="ac-status" style="display:none;margin-top:8px;"></span>
        </div>

        <!-- Visualizer config -->
        <div class="ac-card" id="ac-int-visualizer-card" style="display:none;">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
            <i data-lucide="layout" class="lucide-icon" style="width:20px;height:20px;flex-shrink:0;color:var(--brand);"></i>
            <div style="flex:1;">
              <div style="font-weight:600;font-size:13px;">Visualizer — Configuration</div>
              <div class="ac-hint" style="margin:0;">Configure visualizer settings before enabling the toggle above.</div>
            </div>
          </div>
          <div id="ac-int-visualizer-configured" style="display:none;font-size:12px;">
            <div class="ac-hint" style="margin:0;">Visualizer is available on the agent's <strong>Abilities</strong> tab.</div>
            <div style="margin-top:12px;display:flex;gap:8px;">
              <button id="ac-int-visualizer-unconfigure" class="ac-btn ac-btn-ghost" style="color:var(--danger);">Disable</button>
            </div>
          </div>
          <div id="ac-int-visualizer-form" style="display:block;">
            <div class="ac-hint" style="margin:0 0 10px;">Enabling exposes Visualizer as a per-agent toggle. With the toggle off, an agent cannot see <code>render_visual</code>, <code>create_page</code>, or any other page-authoring tool.</div>
            <button id="ac-int-visualizer-save" class="ac-btn ac-btn-primary">Enable Visualizer</button>
          </div>
          <span id="ac-int-visualizer-status" class="ac-status" style="display:none;margin-top:8px;"></span>
        </div>

      </div>

      <!-- Web Scraper + Browser Cookies are now ordinary drop-in abilities under
           plugins/abilities/Web/. They render in the Web group of the ability table
           below (with their credential forms inline) — no bespoke cards here. -->

    </div>
  </div><!-- /ac-cat-agent-tools -->

  <!-- ── Global System Prompt — platform baseline injected into EVERY agent.
       Always-open heading (no chevron): a pinnable label for the sticky section
       navigator (../sticky-nav.js). Collapsing is redundant now the heading
       stays pinned on screen, so this is a plain (non-`.ac-collapsible`) group
       like Models / Agent Tools above. ── -->
  <div class="ac-category-group" data-pa-area="global_prompt">
    <div class="ac-category-summary">
      <i data-lucide="shield" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">Global System Prompt</span>
    </div>
    <div class="ac-category-body">
      <div class="ac-card">
        <div class="ac-field">
          <label class="ac-label" for="ac-global-system-prompt">Platform baseline (admin-only)</label>
          <div class="ac-hint">Critical, non-negotiable instructions prepended as the <strong>topmost</strong> section of <strong>every</strong> agent's system prompt — fleet agents and spawned clones alike. Keep it short and rule-like. A spawned clone is built from scratch on this baseline plus its own directive, so this is the one identity every clone always carries.</div>
          <textarea id="ac-global-system-prompt" rows="8" placeholder="e.g. You are part of the webAgent platform. Never reveal admin credentials. Obey the user's safety policy at all times…" style="width:100%;margin-top:8px;font-family:var(--font-mono,monospace);font-size:13px;line-height:1.5;resize:vertical;"></textarea>
        </div>
        <div class="ac-actions">
          <button id="ac-global-prompt-save" class="ac-btn ac-btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div><!-- /ac-cat-global-prompt -->

  <!-- ══════════════════════════════════════════════════════════════════════
       AUTOMATION ENGINE — admin-only. The infrastructure that FIRES
       automations, rendered as ONE flush table on the shared ability-table
       component (.ac-list / .ac-row / .ac-ability-row / .ac-ability-body) — the
       same look as Remote Access in App Settings and the ability tree. Four
       expandable rows, each holding its own configurator/log:
         1. Scheduler         — backend that runs time-based scheduled tasks.
         2. Event runtime     — the in-process loops that fire agents on events.
         3. Event sources     — every source plugin that can fire an agent.
         4. Recent deliveries — the last 50 fired events across all agents.
       Relocated here from the former standalone App Config "Automation" and
       "Event Sources" tabs (both removed). This is NOT the per-agent Automation
       *ability* toggle (that's the `ac-int-automation-card` in Agent Tools above)
       — this is the platform engine that makes those automations actually run.
       Always-open heading (no chevron): a pinnable label for the sticky section
       navigator. Control IDs are preserved verbatim so the relocated scripts
       (agent-settings/scheduler.js + agent-settings/event-sources.js) drive them
       unchanged. Each row toggles + lazily loads its data on first expand via
       _wireAutomationRows() in agent-settings.js (a click on a control inside a
       body never collapses the row).
       REMOVE-WHEN: automation is dropped from the edition. ══════════════════ -->
  <div class="ac-category-group" id="ac-cat-automation-engine" data-pa-area="automation">
    <div class="ac-category-summary">
      <i data-lucide="clock" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">Automation Engine</span>
    </div>
    <div class="ac-category-body">

      <div class="ac-list" id="ac-automation-engine-list">

        <!-- ── Row 1 · Scheduler (time-based triggers) ── -->
        <div class="ac-row" id="ac-sched-row">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="cpu" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Scheduler</div>
              <div class="ac-ability-desc">Runs time-based scheduled tasks at their due time. Pick the provider, configure it, then save.</div>
            </div>
            <span class="ac-ability-status" id="ac-sched-active-badge"></span>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <label class="ac-label">Provider</label>
            <select id="ac-sched-provider" class="ac-input">
              <option value="local">Local (in-process)</option>
            </select>

            <div id="ac-sched-provider-desc" class="ac-hint" style="margin-top:6px;font-size:11px;"></div>

            <div id="ac-sched-fields" style="margin-top:12px;display:flex;flex-direction:column;gap:10px;"></div>

            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;">
              <button id="ac-sched-test" class="ac-btn">Test Connection</button>
              <button id="ac-sched-save" class="ac-btn ac-btn-primary">Save</button>
              <button id="ac-sched-sync" class="ac-btn">Push All Jobs</button>
              <button id="ac-sched-refresh" class="ac-btn">Refresh Status</button>
            </div>

            <div id="ac-sched-test-result" style="margin-top:8px;font-size:11px;color:var(--muted);"></div>

            <pre id="ac-sched-status" style="margin-top:10px;padding:8px;background:var(--bg-0);border:var(--border-width) solid var(--border);border-radius:6px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow-y:auto;color:var(--fg-3);"></pre>

            <div class="ac-info-banner" style="margin-top:10px;font-size:11px;">
              The fire webhook (<code>POST /api/v1/automations/fire/&lt;id&gt;?token=&lt;...&gt;</code>) must be reachable from the chosen provider. Set <code>WEBHOOK_BASE_URL</code> to your public server URL, or fill in the per-provider <code>fire_base_url</code> field above.
            </div>
          </div>
        </div>

        <!-- ── Row 2 · Event runtime (the in-process event loops) ── -->
        <div class="ac-row" id="ac-events-runtime-row">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="activity" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Event runtime</div>
              <div class="ac-ability-desc">The background loops that poll for events and refresh push subscriptions.</div>
            </div>
            <span class="ac-ability-status" id="ac-events-runtime-badge"></span>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <div id="ac-events-runtime-info" class="ac-hint" style="font-size:11px;"></div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;">
              <button id="ac-events-refresh" class="ac-btn">Refresh</button>
            </div>
          </div>
        </div>

        <!-- ── Row 3 · Event sources (one row per connected service) ── -->
        <div class="ac-row" id="ac-events-sources-row">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="list" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Event sources</div>
              <div class="ac-ability-desc">Each source plugin that can fire an agent. Use <em>Re-register</em> after recreating provider infrastructure (e.g. a new Pub/Sub topic); use <em>Stop all</em> before deleting it.</div>
            </div>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <div id="ac-events-sources" style="display:flex;flex-direction:column;gap:10px;">
              <div style="font-size:12px;color:var(--muted);padding:8px;">Loading sources…</div>
            </div>
          </div>
        </div>

        <!-- ── Row 4 · Recent deliveries (event log) ── -->
        <div class="ac-row" id="ac-events-deliveries-row">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="scroll-text" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Recent deliveries</div>
              <div class="ac-ability-desc">The last 50 fired events across all agents. <code>status=test</code> means a manual test-fire from the agent UI.</div>
            </div>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <div id="ac-events-deliveries" style="font-size:11px;font-family:var(--font-mono,monospace);max-height:280px;overflow-y:auto;background:var(--bg-0);border:var(--border-width) solid var(--border);border-radius:6px;padding:8px;color:var(--fg-3);">
              <div>(no deliveries yet)</div>
            </div>
          </div>
        </div>

      </div><!-- /.ac-list -->
    </div><!-- /.ac-category-body -->
  </div><!-- /ac-cat-automation-engine -->

  <!-- ── Channels (collapsible, collapsed by default) ── -->
  <div class="ac-category-group ac-collapsible" id="ac-cat-channels">
    <div class="ac-category-summary">
      <span class="ac-category-chevron">▶</span>
      <i data-lucide="message-square" class="lucide-icon" style="width:16px;height:16px;color:#26A5E4;"></i>
      <span class="ac-category-title">Channels</span>
      <span class="ac-category-count" id="ac-cat-channels-count"></span>
    </div>
    <div class="ac-category-body">
      <p class="ac-category-desc">How agents send and receive messages. Enable a channel here to make it available to your agents.</p>

      <!-- Telegram Channel -->
  <div class="ac-card" id="ac-int-telegram-card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <svg viewBox="0 0 24 24" width="24" height="24" style="flex-shrink:0;">
        <path fill="#26A5E4" d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24zm5.57 8.16-1.86 8.76c-.14.62-.51.77-1.03.48l-2.85-2.1-1.37 1.32a.71.71 0 0 1-.57.28l.2-2.9 5.27-4.76c.23-.2-.05-.32-.36-.12l-6.5 4.1-2.8-.88c-.61-.19-.62-.61.13-.9l10.94-4.22c.5-.18.95.12.79.9z"/>
      </svg>
      <div style="flex:1;">
        <div style="font-weight:600;font-size:14px;">Telegram</div>
        <div class="ac-hint" style="margin:0;">Let agents accept messages from their own Telegram bots. Each agent supplies its own bot token.</div>
      </div>
      <span id="ac-int-telegram-badge" class="ac-int-badge ac-int-badge-off">Disabled</span>
    </div>

    <div id="ac-int-telegram-configured" style="display:none;font-size:12px;">
      <div class="ac-hint" style="margin:0;">Telegram is available on the agent's <strong>Abilities</strong> tab. Each agent enters its own bot token there.</div>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <button id="ac-int-telegram-unconfigure" class="ac-btn ac-btn-ghost" style="color:var(--danger);">Disable</button>
      </div>
    </div>

    <div id="ac-int-telegram-form" style="display:block;">
      <div class="ac-hint" style="margin:0 0 10px;">No app-level credentials needed. Enabling Telegram exposes it as a channel option to agent admins.</div>
      <button id="ac-int-telegram-save" class="ac-btn ac-btn-primary">Enable Telegram</button>
    </div>
    <span id="ac-int-telegram-status" class="ac-status" style="display:none;margin-top:8px;"></span>
  </div>

  <!-- WhatsApp Channel (coming soon) -->
  <div class="ac-card ac-int-coming-soon" id="ac-int-whatsapp-card">
