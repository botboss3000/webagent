<template data-slot="#ac-section-slot-app-settings">
<section id="ac-section-app-settings" class="ac-section ac-stickynav">
  <!-- No page heading here on purpose: the header tab carousel already names
       the page. Every admin config page follows this standard — a section is
       just a stack of subheading + one `.ac-list` table groups, no title row. -->
  <!-- ════════════════════════════════════════════════════════════════
       SECTION GROUP PATTERN — SHARED ACROSS ADMIN CONFIG PAGES
       Each setting group is a `.ac-category-group` (plain text heading —
       icon + title — over ONE full-width `.ac-card` / `.ac-list` of
       options; NOT a card-within-a-card). App Settings' groups are
       ALWAYS-OPEN `<div>`s (no chevron). A COLLAPSIBLE group is a
       `<div class="ac-category-group ac-collapsible">` toggled by an
       `.ac-open` class (Agent Settings' Channels/etc.) —
       NOT a native `<details>`, because this section opts into the sticky
       navigator (`ac-stickynav` on the <section>), whose display:contents
       flatten breaks <details> collapse + layout. See app3.css "ADVANCED
       SCROLL" + docs/claude/ui-guidance.md point 5.
       STYLING IS SYNCED: the look lives in `.ac-category-group` /
       `.ac-category-summary` / `.ac-category-body` in ui/shared/css/app3.css.
       If you restyle one page's groups, update the shared CSS so every
       page (App Settings, Agent Settings, and future pages) stays in
       sync — do NOT fork per-page styles.
       ════════════════════════════════════════════════════════════════ -->


  <!-- ── Main Panel Pages ── -->
  <!-- data-pa-area: the page-assistant pill (bottom of this section) reads which
       area the mouse is over via closest('[data-pa-area]') and swaps its
       placeholder + the prompt it hands WebAgent. Keys map to
       data/config/app-prompts.json → page_assistants.app_settings.areas. -->
  <div class="ac-category-group" id="ac-main-panel-card" data-pa-area="main_panel">
    <div class="ac-category-summary" style="cursor:default;">
      <i data-lucide="layout" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">Main Panel Pages</span>
    </div>
    <div class="ac-category-body">
      <div id="ac-main-panel-list" class="ac-main-panel-list ac-list"></div>
    </div>
  </div>

  <!-- ── Admin Panel Pages ── -->
  <div class="ac-category-group" id="ac-admin-panel-card" data-pa-area="admin_panel">
    <div class="ac-category-summary" style="cursor:default;">
      <i data-lucide="panel-left" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">Admin Panel Pages</span>
    </div>
    <div class="ac-category-body">
      <div id="ac-admin-panel-list" class="ac-main-panel-list ac-list"></div>
    </div>
  </div>

  <!-- ── Design (Startup & Boot + Appearance, one unified table) ── -->
  <!-- The old "Startup & Boot" and "Appearance" groups were merged into a single
       "Design" category whose body is ONE `.ac-list` table (#ac-design-list) — no
       subsection headings. The Appearance theme rows come first, then the
       Startup & Boot config rows below, flowing as one continuous table. No JS change was
       needed — every element id is preserved, so app-settings.js wiring
       (_initBoot*, _initAppearance, _loadAppearance) keeps working untouched. -->
  <div class="ac-category-group" data-pa-area="design">
    <div class="ac-category-summary" style="cursor:default;">
      <i data-lucide="palette" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">Design</span>
      <!-- Quick LIVE theme switch (Light · Dark · System) — same per-browser
           toggle as the user-menu dropdown, surfaced here so you can flip the
           active theme while editing the two palettes below. Reuses the shared
           `.theme-option` buttons so highlight stays synced with the dropdown;
           wired in app-settings.js (_initThemeSwitch) via user-panel.js setTheme.
           SISTER-CONTROL of the #user-dropdown theme-toggle-group in index.html. -->
      <div class="ac-theme-switch" role="group" aria-label="Theme">
        <button class="theme-option" data-theme="light" title="Light" aria-label="Light theme">
          <i data-lucide="sun" class="lucide-icon" style="width:14px;height:14px;"></i>
        </button>
        <button class="theme-option" data-theme="dark" title="Dark" aria-label="Dark theme">
          <i data-lucide="moon" class="lucide-icon" style="width:14px;height:14px;"></i>
        </button>
        <button class="theme-option" data-theme="system" title="System" aria-label="Follow system theme">
          <i data-lucide="monitor" class="lucide-icon" style="width:14px;height:14px;"></i>
        </button>
      </div>
    </div>
    <div class="ac-category-body">
      <!-- ONE UNIFIED TABLE — the Startup/Boot config rows and the Appearance
           theme rows live in a SINGLE `.ac-list` (#ac-design-list) so the whole
           Design category reads as one continuous table, not split subsections.
           STANDARD CONFIG ROWS — every setting is a flush `.ac-ability-row`
           (icon + name + one-line description) with its control in a right-
           aligned `.ac-config-control` slot: a `.conn-toggle` switch (the same
           switch the ability tables use) for on/off settings, or an inline
           `.ac-input.ac-config-sel` dropdown for a choice. No expandable bodies
           here — the controls are simple enough to sit inline, so the whole
           group reads as one uniform table (matches Appearance's border/font
           rows below). Welcome screen + Show tooltips save app-wide (server,
           via POST /admin/settings/app); Boot animation + Mobile boot save per
           browser (localStorage). All four are wired in the sibling
           app-settings.js — element ids unchanged. -->
      <div class="ac-list" id="ac-design-list">

        <!-- ── Appearance rows (theme palette · background · fonts & borders) ──
             Appearance comes FIRST in the table; the Startup & Boot rows follow
             below. Same `.ac-list` table — no separate container.
             The whole app's look is two INDEPENDENT palettes (dark + light), shown
             as two EXPANDABLE ability-rows (Light + Dark) that expand to reveal that
             theme's one-click presets, the animated background, and the full palette
             of colour swatches — injected by app-settings.js (_buildThemeCard) into
             the row's .ac-ability-body. The three static rows after them are the
             theme-independent knobs (border thickness + the two fonts), select +
             green auto-save check on the right. Every control auto-saves per theme to
             app settings, previews live in the admin's own window, and applies
             app-wide for every visitor via the public /api/v1/auth/ui-config:
               • palette + border + fonts → ui/shared/js/appearance.js
               • background                → ui/background/_engine/manager.js
             Border thickness applies to BOTH themes (Off = no borders). Extra
             theme-independent knobs (roundness, shadow depth, UI scale, reduce
             motion, cursor glow) are JSON-ONLY — edit data/config/app-settings.json. -->
        <div class="ac-row" id="ac-theme-row-light" data-theme="light">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="sun" class="lucide-icon" style="width:18px;height:18px;"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Light mode</div>
              <div class="ac-ability-desc">Preset themes, the animated background and the full colour palette for light mode.</div>
            </div>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body" id="ac-theme-body-light"></div>
        </div>
        <div class="ac-row" id="ac-theme-row-dark" data-theme="dark">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="moon" class="lucide-icon" style="width:18px;height:18px;"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Dark mode</div>
              <div class="ac-ability-desc">Preset themes, the animated background and the full colour palette for dark mode.</div>
            </div>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body" id="ac-theme-body-dark"></div>
        </div>
        <!-- Allow per-user themes — app-WIDE setting saved server-side
             (allow_user_appearance in app-settings.json), mirroring the Welcome
             screen / Show tooltips switches. When on, every signed-in user gets a
             "My appearance" editor on their account page whose choices layer on
             top of the theme above. Wired in app-settings.js (_initAllowUserAppearance);
             state loaded in _loadAppSettings. -->
        <div class="ac-ability-row" id="ac-allow-user-appearance-row">
          <span class="ac-ability-icon"><i data-lucide="user-pen" class="lucide-icon" style="width:18px;height:18px;"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Allow per-user themes</div>
            <div class="ac-ability-desc">Let each signed-in person set their own colours, background and fonts from their account page. Their choices layer on top of the theme above — anything they don't change still follows it. Off hides the editor and ignores any saved personal themes.</div>
          </div>
          <span class="ac-config-control">
            <label class="conn-toggle-wrap ac-ability-toggle-wrap">
              <input type="checkbox" id="ac-allow-user-appearance" class="conn-toggle">
              <span class="conn-toggle-track"></span>
            </label>
          </span>
        </div>
        <div class="ac-ability-row ac-row-static" id="ac-border-row">
          <span class="ac-ability-icon"><i data-lucide="square-dashed" class="lucide-icon" style="width:18px;height:18px;"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Border thickness</div>
            <div class="ac-ability-desc">Outline weight for cards, tables and dividers across both themes. Off removes every border.</div>
          </div>
          <span class="ac-config-control">
            <select id="ac-border-width" class="ac-input ac-config-sel">
              <option value="0">Off — no borders</option>
              <option value="1px">Thin</option>
              <option value="2px">Medium</option>
              <option value="3px">Thick</option>
            </select>
          </span>
        </div>
        <div class="ac-ability-row ac-row-static" id="ac-font-sans-row">
          <span class="ac-ability-icon"><i data-lucide="type" class="lucide-icon" style="width:18px;height:18px;"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">App font</div>
            <div class="ac-ability-desc">Typeface for all interface text, in both light and dark.</div>
          </div>
          <span class="ac-config-control">
            <select id="ac-font-sans" class="ac-input ac-config-sel">
              <option value="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Inter (default)</option>
              <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">System</option>
              <option value="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif">Rounded</option>
              <option value="Georgia, 'Times New Roman', serif">Serif</option>
            </select>
          </span>
        </div>
        <div class="ac-ability-row ac-row-static" id="ac-font-mono-row">
          <span class="ac-ability-icon"><i data-lucide="code" class="lucide-icon" style="width:18px;height:18px;"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Code font</div>
            <div class="ac-ability-desc">Monospace typeface for code blocks, the terminal and logs.</div>
          </div>
          <span class="ac-config-control">
            <select id="ac-font-mono" class="ac-input ac-config-sel">
              <option value="'JetBrains Mono', 'Fira Code', Menlo, ui-monospace, monospace">JetBrains Mono (default)</option>
              <option value="ui-monospace, Menlo, Consolas, monospace">System mono</option>
              <option value="'Courier New', Courier, monospace">Courier</option>
            </select>
          </span>
        </div>

        <!-- ── Startup & Boot rows (below Appearance, same table) ──
             STANDARD CONFIG ROWS — each is a flush `.ac-ability-row` with its
             control in a right-aligned `.ac-config-control` slot: a `.conn-toggle`
             switch for on/off, or an inline `.ac-input.ac-config-sel` dropdown for a
             choice. Welcome screen + Show tooltips save app-wide (server, via POST
             /admin/settings/app); Boot animation + Mobile boot save per browser
             (localStorage). All four are wired in the sibling app-settings.js —
             element ids unchanged. -->
        <div class="ac-ability-row" id="ac-boot-splash-row">
          <span class="ac-ability-icon"><i data-lucide="sparkles" class="lucide-icon" style="width:18px;height:18px;"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Welcome landing page</div>
            <div class="ac-ability-desc">Show a public welcome page at your web address — new visitors see it first and click Enter to reach the app (the installed app opens straight to the workspace). Off: the app loads directly at the front door. Each person can still skip it for themselves from the page or their account.</div>
          </div>
          <span class="ac-config-control">
            <label class="conn-toggle-wrap ac-ability-toggle-wrap">
              <input type="checkbox" id="ac-boot-splash-enabled" class="conn-toggle">
              <span class="conn-toggle-track"></span>
            </label>
          </span>
        </div>
        <div class="ac-ability-row" id="ac-boot-anim-row">
          <span class="ac-ability-icon"><i data-lucide="play" class="lucide-icon" style="width:18px;height:18px;"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Boot animation</div>
            <div class="ac-ability-desc">How the chat shrinks and the saved page appears when the app first loads. Saved per browser; applied on the next reload.</div>
          </div>
          <span class="ac-config-control">
            <select id="ac-boot-animation" class="ac-input ac-config-sel">
              <option value="chat-slide-right">Chat slides right</option>
              <option value="page-slide-in">Page slides in</option>
              <option value="crossfade">Crossfade</option>
            </select>
          </span>
        </div>
        <div class="ac-ability-row" id="ac-boot-mobile-row">
          <span class="ac-ability-icon"><i data-lucide="smartphone" class="lucide-icon" style="width:18px;height:18px;"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Mobile boot</div>
            <div class="ac-ability-desc">Mobile only. "Always" forces the chat-first boot then animates to the saved view. "Remember" skips the animation and goes straight to whichever panel you had open last.</div>
          </div>
          <span class="ac-config-control">
            <select id="ac-boot-mobile-mode" class="ac-input ac-config-sel">
              <option value="chat-first">Always chat-first</option>
              <option value="memory">Remember last view</option>
            </select>
          </span>
        </div>
        <div class="ac-ability-row" id="ac-boot-tooltip-row">
          <span class="ac-ability-icon"><i data-lucide="help-circle" class="lucide-icon" style="width:18px;height:18px;"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Show tooltips</div>
            <div class="ac-ability-desc">Show the small hint bubbles that guide visitors through the app. Each person can still turn the tour off for themselves from their account page.</div>
          </div>
          <span class="ac-config-control">
            <label class="conn-toggle-wrap ac-ability-toggle-wrap">
              <input type="checkbox" id="ac-boot-show-tooltips" class="conn-toggle">
              <span class="conn-toggle-track"></span>
            </label>
          </span>
        </div>

        <!-- ── Chat panel layout rows (same Design table) ──
             Two app-WIDE appearance keys saved via the merge-friendly POST
             /admin/settings/app and served to every visitor through
             /api/v1/auth/ui-config:
               • Chat position    → injected as a #stage flex rule by appearance.js
                                    (right = default; left reverses the desktop split)
               • Chat at startup  → seeds the first-visit desktop default (read at
                                    boot by index.html __chatVisibilityDefault); once
                                    a visitor toggles the chat their own choice wins.
             Wired in the sibling app-settings.js (_wireChatLayout); values loaded
             in _loadAppearance. Ids: ac-chat-position / ac-chat-default-visible. -->
        <div class="ac-ability-row ac-row-static" id="ac-chat-position-row">
          <span class="ac-ability-icon"><i data-lucide="panel-right" class="lucide-icon" style="width:18px;height:18px;"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Chat position</div>
            <div class="ac-ability-desc">Which side the chat panel sits on, beside the main panel. Applies app-wide on wider screens.</div>
          </div>
          <span class="ac-config-control">
            <select id="ac-chat-position" class="ac-input ac-config-sel">
              <option value="right">Right (default)</option>
              <option value="left">Left</option>
            </select>
          </span>
        </div>
        <div class="ac-ability-row ac-row-static" id="ac-chat-default-visible-row">
          <span class="ac-ability-icon"><i data-lucide="message-square" class="lucide-icon" style="width:18px;height:18px;"></i></span>
          <div class="ac-ability-label">
            <div class="ac-ability-name">Chat at startup</div>
            <div class="ac-ability-desc">Whether the chat panel is open the first time someone visits. Each person can still show or hide it themselves afterwards.</div>
          </div>
          <span class="ac-config-control">
            <select id="ac-chat-default-visible" class="ac-input ac-config-sel">
              <option value="visible">Visible (default)</option>
              <option value="hidden">Hidden</option>
            </select>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════
       ADVANCED — occasional/low-level knobs that don't belong with the
       everyday appearance & pages settings above. This group holds the two
       rows MOVED here from the retired "Data Management" tab (which had nothing
       else left once the "where does my data live" rows went to Data Settings):
         • Config Files  — seed the default JSON config library
         • Stream Buffer — in-memory per-turn event retention for WS replay
       Both are the shared ability-table component (`.ac-list` of expandable
       `.ac-row`s). Their control ids are PRESERVED VERBATIM (`ac-cfg-*`,
       `ac-storage-sbuf-*`) because their driver (ui/shared/js/storage.js) binds
       by element id — so the move is DOM-only and the wiring keeps working. The
       rows expand/collapse via _wireBootRow() in the sibling app-settings.js
       (a click on a control inside a body never toggles the row).
       ════════════════════════════════════════════════════════════════ -->
  <div class="ac-category-group" id="ac-advanced-card" data-pa-area="advanced">
    <div class="ac-category-summary" style="cursor:default;">
      <i data-lucide="sliders-horizontal" class="lucide-icon" style="width:16px;height:16px;color:var(--accent);"></i>
      <span class="ac-category-title">Advanced</span>
    </div>
    <div class="ac-category-body">
      <div class="ac-list">

        <!-- ── Row · Config Files (seed the default JSON config library) ── -->
        <div class="ac-row" id="ac-row-configfiles">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="file-cog" class="lucide-icon" style="width:18px;height:18px;color:var(--success);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Config Files</div>
              <div class="ac-ability-desc">Write the default JSON config files from the built-in templates.</div>
            </div>
            <span class="ac-ability-status" id="ac-cfg-seed-badge">loading…</span>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <div class="ac-hint">
              The app runs fine with <strong>no</strong> config files — every setting falls back to a built-in default, and a file is created the moment you change that setting. This writes out the whole <strong>library</strong> of default config files to <code>data/config/</code> so you have editable copies to work from. Files that manage their own lifecycle (secrets, the ability catalog, the model catalog) are shown but not written. <strong>Existing files are never overwritten.</strong>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;">
              <button id="ac-cfg-refresh-btn" class="ac-btn">Refresh</button>
              <button id="ac-cfg-seed-btn" class="ac-btn ac-btn-primary">Generate Missing Files</button>
            </div>
            <div id="ac-cfg-list" style="margin-top:10px;display:flex;flex-direction:column;gap:6px;"></div>
            <pre id="ac-cfg-output" style="margin-top:10px;padding:8px;background:var(--bg-elev);border:var(--border-width) solid var(--border);border-radius:6px;font-size:11px;white-space:pre-wrap;max-height:240px;overflow-y:auto;display:none;"></pre>
          </div>
        </div>

        <!-- ── Row · Stream Buffer (in-memory per-turn event log for WS replay) ── -->
        <div class="ac-row" id="ac-row-streambuffer">
          <div class="ac-ability-row">
            <span class="ac-ability-icon"><i data-lucide="activity" class="lucide-icon" style="width:18px;height:18px;color:var(--accent);"></i></span>
            <div class="ac-ability-label">
              <div class="ac-ability-name">Stream Buffer</div>
              <div class="ac-ability-desc">How long each chat turn's events stay in memory for replay after a refresh.</div>
            </div>
            <span class="ac-ability-status" id="ac-storage-sbuf-badge"></span>
            <span class="ac-row-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="ac-ability-body">
            <div class="ac-hint">
              Each chat turn keeps its events (stream tokens, tool calls, results) in memory so a refresh or session switch can replay what was missed. Buffer is dropped this many seconds after the turn finishes. 0 = drop immediately. Max 3600.
            </div>
            <label class="ac-label" style="margin-top:10px;">Retention seconds</label>
            <div style="display:flex;gap:8px;align-items:center;">
              <input type="number" id="ac-storage-sbuf-seconds" class="ac-input" min="0" max="3600" step="1" style="width:120px;" value="60">
              <button id="ac-storage-sbuf-save" class="ac-btn ac-btn-primary">Save</button>
              <span id="ac-storage-sbuf-status" class="ac-hint" style="margin-left:6px;"></span>
            </div>
          </div>
        </div>

      </div><!-- /.ac-list -->
    </div><!-- /.ac-category-body -->
  </div>

  <!-- ════════════════════════════════════════════════════════════════
       PAGE-ASSISTANT CHAT PILL — the markup now lives ONE LEVEL UP, in
       app-config.html as a sibling BELOW #app-config-content (the scroller),
       NOT inside this section. Why: a pill floating INSIDE the scroller always
       has page rows scrolling behind it. By placing it under the scroller (the
       container is a flex column, so the scroller shrinks to sit above it) the
       scroll viewport ENDS above the pill — content can never render behind it,
       and the transparent gap around the pill shows the page background
       gradient. It is scoped to show only while THIS section is active via a
       CSS `:has()` rule (see #ac-pa-bar in app3.css). Everything else is
       unchanged: the wiring (_initPageAssistant in the sibling app-settings.js)
       still finds it by id, and the per-area placeholder swap still works
       because that mouseover listener is bound to THIS section (the
       data-pa-area groups above), independent of where the pill renders. -->
</section>
</template>
