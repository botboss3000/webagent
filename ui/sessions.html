<!-- Toolbar
     ---- HARMONY: this toolbar (id naming, button set, bin logic) mirrors
     ---- ui/agents.html. The two must stay in sync: any change to the
     ---- toolbar layout, bin states, or right-side actions here must be
     ---- copied to agents.html (and vice versa). Grep HARMONY-SESSIONS-BIN
     ---- and HARMONY-AGENTS-BIN to find the matching call sites. -->

<div id="sessions-toolbar">
  <div id="sessions-toolbar-left">
    <button type="button" id="sessions-back-btn" title="Back to Sessions" style="display:none;">
      <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
    </button>
    <span id="sessions-toolbar-title">Sessions</span>
    <span id="sessions-toolbar-sub"> &middot; history &middot; usage &middot; costs</span>
  </div>
  <div id="sessions-toolbar-actions">
    <button type="button" id="sessions-select-all" class="sessions-tb-btn" title="Select all sessions">Select all</button>
    <button type="button" id="sessions-deselect-all" class="sessions-tb-btn" title="Clear selection">Deselect all</button>
    <button type="button" id="sessions-restore-btn" class="sessions-tb-btn sessions-tb-restore" title="Restore selected sessions" style="display:none;">
      <i data-lucide="archive-restore" style="width:15px;height:15px;"></i><span>Restore</span>
    </button>
    <!-- HARMONY-SESSIONS-BIN: trash+bin migration mirrors agents-tb-trash.
         When nothing is selected, clicking opens the bin (recycled sessions).
         In the bin: the trash permanently deletes. Restore button restores. -->
    <button type="button" id="sessions-trash-btn" class="sessions-tb-trash" data-state="trash" title="Open recycling bin">
      <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
    </button>
  </div>
</div>

<!-- Scrollable table area -->
<div id="sessions-table-wrap">
  <div id="sessions-table-inner">
    <table id="sessions-table">
      <thead>
        <tr>
          <th class="col-check">
            <span id="sessions-check-all" class="sessions-check-cell" title="Select all"> </span>
          </th>
          <th class="col-agent col-resizable">Agent</th>
          <th class="col-title col-resizable">Session</th>
          <th class="col-status">Status</th>
          <th class="col-msgs col-resizable">Messages</th>
          <th class="col-tokens-in col-resizable">Tokens In</th>
          <th class="col-tokens-out col-resizable">Tokens Out</th>
          <th class="col-cost col-resizable">Cost</th>
          <th class="col-duration col-resizable">Duration</th>
          <th class="col-updated col-resizable">Last Activity</th>
        </tr>
      </thead>
      <tbody id="sessions-table-body">
        <!-- Populated by JS -->
      </tbody>
    </table>
    <div id="sessions-empty" class="sessions-empty" style="display:none;">
      <div class="sessions-empty-icon"><i data-lucide="message-square" style="width:28px;height:28px;"></i></div>
      <div class="sessions-empty-text">No sessions yet</div>
      <div class="sessions-empty-hint">Start a conversation with an agent to see it here</div>
    </div>
    <div id="sessions-loading" class="sessions-loading" style="display:none;">
      <i data-lucide="loader-2" style="width:18px;height:18px;" class="lucide-spin"></i>
      <span>Loading sessions…</span>
    </div>
  </div>
</div>

<!-- Sessions chat bar — page-level assistant for session analysis -->
<!-- CHAT-PILL-SYNC: shares .chat-pill* styles with #chat-input-row, etc. -->
<div id="sessions-builder-bar">
  <div id="sessions-builder-bar-row" class="chat-pill">
    <button type="button" id="sessions-builder-bar-attach" class="chat-pill-attach" title="Attach files">
      <i data-lucide="plus" style="width:18px;height:18px;"></i>
    </button>
    <textarea id="sessions-builder-bar-input" class="chat-pill-input" rows="1"
      placeholder="Ask about session usage, costs, or activity…"
      autocomplete="off"></textarea>
    <button type="button" id="sessions-builder-bar-voice" class="chat-pill-voice" title="Record voice">
      <i data-lucide="mic" style="width:18px;height:18px;"></i>
    </button>
    <button type="button" id="sessions-builder-bar-send" class="chat-pill-send" title="Send to webAgent">
      <i data-lucide="send" style="width:16px;height:16px;"></i>
    </button>
  </div>
  <div id="sessions-builder-footer" class="sessions-builder-footer"></div>
</div>
