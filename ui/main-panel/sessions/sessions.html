<!-- Toolbar -->

<div id="sessions-toolbar">
  <div id="sessions-toolbar-left">
    <!-- SESSIONS-VIEW-CHIP: ONE glass-chip button (same style as the search
         T+C/Title chip) that cycles the view filter: Sessions → All → Bin.
         ONE combined dataset: 'sessions' shows live rows, 'both' merges the
         two catalogs, 'recycle-bin' shows binned rows. -->
    <button type="button" id="sessions-view-btn" class="sessions-view-btn" data-view="sessions" title="View: Sessions — click to switch (All / Bin)">Sessions</button>
    <i id="sessions-loading-spinner" data-lucide="loader-2" class="sessions-toolbar-spinner" style="width:13px;height:13px;display:none;"></i>
  </div>
  <div id="sessions-toolbar-actions">
    <!-- COLLAPSIBLE-SEARCH: the toolbar starts with an icon-only search
         trigger at the start of the actions group. Clicking it adds
         .search-open to #sessions-toolbar-actions, which reveals the
         T+C/Title filter chip + the search field (#sessions-search-area).
         A second click or Escape collapses and clears any active query. -->
    <button type="button" id="sessions-search-trigger" class="sessions-tb-btn sessions-tb-search" title="Search sessions" aria-label="Search sessions" aria-expanded="false">
      <i data-lucide="search" style="width:15px;height:15px;"></i>
    </button>
    <div id="sessions-search-area" class="sessions-search-area">
      <button type="button" id="sessions-search-mode-btn" class="sessions-search-mode-btn" data-mode="content" title="Search mode: Title + Content">T+C</button>
      <div class="sessions-search-wrap">
        <i data-lucide="search" class="sessions-search-icon" style="width:14px;height:14px;"></i>
        <input type="text" id="sessions-search-input" class="sessions-search-input" placeholder="Search" spellcheck="false" autocomplete="off">
        <span id="sessions-msg-scanning" class="sessions-msg-scanning" title="Searching messages…"></span>
        <button type="button" id="sessions-search-clear" class="sessions-search-clear" title="Clear search" aria-label="Clear search" style="display:none;">
          <i data-lucide="x" style="width:13px;height:13px;"></i>
        </button>
      </div>
    </div>
    <button type="button" id="sessions-restore-btn" class="sessions-tb-btn sessions-tb-restore" title="Restore selected sessions" style="display:none;">
      <i data-lucide="archive-restore" style="width:15px;height:15px;"></i><span>Restore</span>
    </button>
    <!-- HARMONY-SESSIONS-BIN: trash+bin migration mirrors agents-tb-trash.
         When nothing is selected, clicking opens the bin (recycled sessions).
         In the bin: the trash permanently deletes. Restore button restores. -->
    <button type="button" id="sessions-trash-btn" class="sessions-tb-trash" data-state="trash" title="Open recycling bin">
      <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
    </button>
    <button type="button" id="sessions-refresh-btn" class="sessions-tb-btn sessions-tb-refresh" title="Refresh sessions page">
      <i data-lucide="refresh-cw" style="width:15px;height:15px;"></i>
    </button>
  </div>
</div>

<!-- Scrollable table area -->
<div id="sessions-table-wrap">
  <div id="sessions-gutter" class="sessions-gutter" title="Drag to show/hide columns">
    <div class="sessions-gutter-line"></div>
  </div>
  <div id="sessions-table-inner">
    <table id="sessions-table">
      <thead id="sessions-table-head">
        <!-- Built dynamically from column config -->
      </thead>
      <tbody id="sessions-table-body">
        <!-- Populated by JS -->
      </tbody>
    </table>
    <div id="sessions-empty" class="sessions-empty" style="display:none;">
      <div class="sessions-empty-icon"><i data-lucide="message-square" style="width:28px;height:28px;"></i></div>
      <div class="sessions-empty-text">No sessions yet</div>
      <div class="sessions-empty-hint">Start a conversation with an agent to see it here</div>
    </div>
    <div id="sessions-loading" class="sessions-loading" style="display:none;">
      <i data-lucide="loader-2" style="width:18px;height:18px;" class="lucide-spin"></i>
      <span>Loading sessions…</span>
    </div>
  </div>
</div>
