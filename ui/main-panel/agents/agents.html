<!-- Toolbar
     ---- HARMONY: this toolbar's bin logic (back button, title/subtitle swap,
     ---- restore button, and the morphing recycle↔trash button) mirrors
     ---- sessions.html and automations.html. Any change to the bin states or
     ---- right-side actions here must be copied to those two (and vice versa).
     ---- Grep HARMONY-AGENTS-BIN / HARMONY-SESSIONS-BIN to find the call sites.
     ---- NOTE — divergence: the Agents page keeps its icon Select-all / Clear
     ---- buttons because it is a CARD GRID with no table header. Sessions and
     ---- Automations are tables whose top-left header cell already toggles all
     ---- rows, so they deliberately DROP the toolbar select buttons. -->
<!-- The right-side actions drive the recycling bin. On the Agents page the trash
     button moves checked agents to the bin (or, with nothing checked, opens the
     bin). In the bin the title becomes "Back to Agents", a Restore button shows,
     and the trash button permanently deletes the checked agents. -->
<!-- RETURN-TO-AGENTS-HEADER (sister of the recycling-bin header — keep cohesive)
     This toolbar is shared between the normal Agents view, the recycling bin, and
     the Clones view. The bin and clones views both use the same back-button + title
     + subtitle pattern. Any change to one must be mirrored to the other. -->
<div id="agents-toolbar">
  <div id="agents-toolbar-left">
    <button type="button" id="agents-back-btn" title="Back to Agents" style="display:none;">
      <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
    </button>
    <span id="agents-toolbar-title">Agents</span>
    <span id="agents-toolbar-sub"> &middot; Agent templates &middot; system prompts &middot; model assignments</span>
  </div>
  <div id="agents-toolbar-actions">
    <button type="button" id="agents-select-all" class="agents-tb-btn" title="Select all agents"><i data-lucide="check-square" style="width:15px;height:15px;"></i></button>
    <button type="button" id="agents-deselect-all" class="agents-tb-btn" title="Clear selection"><i data-lucide="square" style="width:15px;height:15px;"></i></button>
    <button type="button" id="agents-restore-btn" class="agents-tb-btn agents-tb-restore" title="Restore selected agents" style="display:none;">
      <i data-lucide="archive-restore" style="width:15px;height:15px;"></i><span>Restore</span>
    </button>
    <!-- Show/hide system-level agents. Agents-only control (NOT part of the
         HARMONY bin action set) — it sits beside the trash button but drives
         _showSystem, not the bin. -->
    <button type="button" id="agents-system-btn" class="agents-tb-btn agents-tb-icon" title="Show system agents">
      <i data-lucide="eye-off" style="width:15px;height:15px;"></i>
    </button>
    <button type="button" id="agents-trash-btn" class="agents-tb-trash" data-state="trash" title="Recycling bin">
      <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
    </button>
  </div>
</div>

<!-- Card grid -->
<div id="agents-grid"></div>
