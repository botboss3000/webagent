<template data-slot="#main-panel">
    <div id="app-config-container" hidden>

        <!-- Main navigation via unified sub-header below (replaces this tab strip) -->
        <div id="app-config-tabs-wrap" hidden>
          <button type="button" id="app-config-tabs-chev-left" class="ac-tabs-chev left" aria-label="Scroll tabs left">&#10094;</button>
          <div id="app-config-tabs" role="tablist">
            <button type="button" class="ac-tab" data-section="data-settings" role="tab">
              <i data-lucide="rocket" class="lucide-icon ac-tab-icon"></i>Data Settings
            </button>
            <button type="button" class="ac-tab" data-section="app-settings" role="tab">
              <i data-lucide="settings-2" class="lucide-icon ac-tab-icon"></i>App Settings
            </button>
            <button type="button" class="ac-tab" data-section="agent-settings" role="tab">
              <i data-lucide="bot" class="lucide-icon ac-tab-icon"></i>Agent Settings
            </button>
          </div>
          <button type="button" id="app-config-tabs-chev-right" class="ac-tabs-chev right" aria-label="Scroll tabs right">&#10095;</button>
        </div>

        <!-- Unified sub-header with all section headings in a carousel -->
        <div id="app-config-subnav"></div>

        <!-- Non-scrolling wrapper that is the query CONTAINER sizing the App
             Settings tab's rounded scroll-corner mask (see #app-config-scroll-wrap
             in app3.css + the `.rounded-scroll-corners` standard in design-system.css).
             It takes the scroller's flex:1 role; the scroller keeps its side margins
             inside it, so the scroller's box is unchanged. -->
        <div id="app-config-scroll-wrap">
        <!-- Scrollable content (.rounded-scroll-corners → pinned rounded corners,
             switched on only for the centred-column tabs — App Settings and
             Agent Settings — see app3.css) -->
        <div id="app-config-content" class="rounded-scroll-corners">
          <div id="ac-unified-search-empty" class="ac-search-empty" role="status" hidden></div>
          <!-- All three sections are always visible, stacked for scrolling -->
          <div id="ac-section-slot-data-settings"></div>
          <div id="ac-section-slot-app-settings"></div>
          <div id="ac-section-slot-agent-settings"></div>
        </div><!-- /app-config-content -->
        </div><!-- /app-config-scroll-wrap -->

        <!-- ════════════════════════════════════════════════════════════════
             UNIFIED PAGE-ASSISTANT CHAT PILL — a single chat/search pill that
             works across all three sections (Data, App, Agent Settings). The
             placeholder and prompts adapt based on which section the user is
             currently viewing. Deletion SIBLING of the scroller, not a child.
             #app-config-container is a flex column, so #app-config-content
             (flex:1) shrinks to sit ABOVE this pill: the scroll viewport ends
             above the pill, so page rows can never scroll behind it, and the
             transparent gap around the pill lets the page background gradient
             show through (no opaque fill needed).
             CHAT-PILL-SYNC: shares .chat-pill* geometry with #chat-input-row etc.
             (geometry in app1.css; floating-glass skin in index.css). Wired in
             the page-assistant.js module, with prompts from
             data/config/app-prompts.json → page_assistants (unified). -->
        <div id="ac-unified-pa-bar">
          <div id="ac-unified-pa-preview-bar" class="ac-pa-preview-bar ac-pa-hidden"></div>
          <div id="ac-unified-pa-bar-row" class="chat-pill chat-pill-1line">
            <button type="button" id="ac-unified-pa-attach" class="chat-pill-attach" title="Attach files">
              <i data-lucide="plus" class="dash-ico-18"></i>
            </button>
            <textarea id="ac-unified-pa-input" class="chat-pill-input" rows="1"
              placeholder="Search or ask how to configure something or customize the app"
              autocomplete="off"
              title="Type to search settings; press Enter to ask WebAgent"></textarea>
            <button type="button" id="ac-unified-pa-voice" class="chat-pill-voice" title="Record voice">
              <i data-lucide="mic" class="dash-ico-18"></i>
            </button>
            <button type="button" id="ac-unified-pa-send" class="chat-pill-send" title="Send to WebAgent">
              <i data-lucide="send" class="dash-ico-16"></i>
            </button>
          </div>
        </div>
    </div><!-- /app-config-container -->
</template>
