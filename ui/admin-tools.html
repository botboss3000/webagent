<div id="files-restricted-overlay" style="display:none;">
  <div class="files-restricted-card">
    <div class="files-restricted-icon"><i data-lucide="lock" style="width:32px;height:32px;"></i></div>
    <div class="files-restricted-title">Restricted Access</div>
    <div class="files-restricted-desc">Admin Tools is only available for admin users.</div>
    <div class="files-restricted-desc files-restricted-diag" id="files-restricted-diag"></div>
  </div>
</div>
<div id="admin-tools" class="admin-tools">
  <!-- Sidebar: a persistent left strip with view-switch icons, plus a
       panel to its right showing the active view (Explorer / Source
       control / Data Management / Terminal launchers). The collapse toggle
       in the strip flips between split (strip + panel) and strip
       (icon column only). -->
  <aside id="files-sidebar" class="files-sidebar" data-view="explorer" data-state="split">
    <!-- Persistent left strip: always visible. The narrow column hosts
         the expand/collapse toggle, refresh, the view-switch icons
         (files / github / database / zap), terminal-new and the
         settings toggle. It's the canonical home for these controls;
         the panel header to the right carries only contextual actions
         (new file, refresh, collapse-all, etc.). -->
    <div class="files-sidebar-strip" aria-label="Sidebar strip">
      <button class="files-strip-btn files-maximize-btn" title="Collapse sidebar"><i data-lucide="chevrons-left" class="lucide-icon"></i></button>
      <button class="files-strip-btn files-strip-view files-settings-toggle-btn" data-view="settings" title="Admin Configuration"><i data-lucide="settings" class="lucide-icon"></i></button>
      <button class="files-strip-btn files-strip-view" data-view="database" title="Database"><i data-lucide="database" class="lucide-icon"></i></button>
      <button class="files-strip-btn files-strip-view" data-view="explorer" title="File Manager"><i data-lucide="folder-tree" class="lucide-icon"></i></button>
      <button class="files-strip-btn files-strip-view" data-view="terminal" title="Terminal Launcher"><i data-lucide="terminal" class="lucide-icon"></i></button>
      <button class="files-strip-btn files-strip-view" data-view="git" title="Source Control"><i data-lucide="git-branch" class="lucide-icon"></i></button>
      <button class="files-strip-btn files-strip-view" data-view="interactions" title="Interactions"><i data-lucide="square-menu" class="lucide-icon"></i></button>
      <button class="files-strip-btn files-strip-view" data-view="runtime-loop" title="Runtime Loop"><i data-lucide="repeat" class="lucide-icon"></i></button>
      <button class="files-strip-btn files-strip-view" data-view="diagnostics" title="Diagnostics"><i data-lucide="stethoscope" class="lucide-icon"></i></button>
    </div>

    <!-- Sub-page sidebar panels (Explorer / Git / Data Management / Terminal /
         Interactions / Runtime Loop) are injected here by the partial
         loader from ui/admin-tools/*.html. -->
  </aside>

  <!-- Resize handle between sidebar and editor -->
  <div id="files-resize-handle" class="files-resize-handle" title="Drag to resize"></div>

  <!-- Toggle button to show sidebar when collapsed -->
  <button id="files-sidebar-toggle" class="files-sidebar-toggle" title="Toggle sidebar">
    <i data-lucide="panel-left" class="lucide-icon"></i>
  </button>

  <!-- Sub-page main areas (file editor / git / terminal / interactions /
       runtime-loop / settings / data management) are injected here by the
       partial loader from ui/admin-tools/*.html. -->
</div>
