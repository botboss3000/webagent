<!-- Wiki: the company-wide, searchable knowledge base.
     Loaded by ui/js/partial-loader.js into #tab-wiki · logic: ui/js/wiki.js ·
     styles: ui/css/wiki.css · API: app/api/wiki.py (/api/v1/wiki).
     One shared collection of articles (company info, policies, contacts — any
     reference data). Searchable by people (semantic + keyword) and managed by
     agents through the wiki_control ability. NOT per-user: everyone sees the
     same entries. Theme-driven (design-system variables) so it works dark+light.

     Layout (classic encyclopedia shell): a BANNER across the top (brand +
     search + New), a TREE SIDEBAR on the left (articles grouped by category),
     and the ARTICLE on the right (reader / editor). The shell is persistent —
     the sidebar stays visible while you read, search, and edit. -->
<div class="wiki-page">

  <!-- ── Banner across the top ── -->
  <header class="wiki-banner">
    <div class="wiki-banner-brand">
      <i data-lucide="book-open" class="lucide-icon wiki-banner-icon"></i>
      <span class="wiki-banner-title">Wiki</span>
      <span class="wiki-banner-sub">Shared knowledge base</span>
    </div>
    <div class="wiki-search">
      <i data-lucide="search" class="lucide-icon wiki-search-icon"></i>
      <input class="wiki-search-input" type="text" spellcheck="false" autocomplete="off"
             placeholder="Search the wiki&hellip;" aria-label="Search the wiki" />
      <button class="wiki-search-clear" title="Clear search" aria-label="Clear search" hidden>
        <i data-lucide="x" class="lucide-icon"></i>
      </button>
    </div>
    <button class="wiki-btn wiki-new-btn" data-act="new" title="New article">
      <i data-lucide="plus" class="lucide-icon"></i><span>New</span>
    </button>
  </header>

  <!-- ── Body: tree sidebar + article content ── -->
  <div class="wiki-body">

    <!-- Left: the article tree (grouped by category) / search results -->
    <aside class="wiki-sidebar">
      <div class="wiki-sidebar-head">
        <span class="wiki-sidebar-title">Contents</span>
        <span class="wiki-sidebar-count" hidden></span>
      </div>
      <!-- Active tag/category filter banner -->
      <div class="wiki-filter-active" hidden>
        <span class="wiki-filter-active-text"></span>
        <button class="wiki-filter-active-clear" data-act="clear-filter" title="Clear filter" aria-label="Clear filter">
          <i data-lucide="x" class="lucide-icon"></i>
        </button>
      </div>
      <nav class="wiki-tree" aria-label="Wiki articles"></nav>
    </aside>

    <!-- Right: the article (reader / editor) -->
    <main class="wiki-content">

      <!-- Welcome / nothing-selected placeholder -->
      <div class="wiki-welcome">
        <i data-lucide="book-open" class="lucide-icon wiki-welcome-icon"></i>
        <div class="wiki-welcome-title">Welcome to the wiki</div>
        <div class="wiki-welcome-text">Pick an article from the sidebar to read it, search across
          everything from the banner, or start something new. You can also ask an agent (with the
          Wiki ability) to write and organise articles for you.</div>
        <button class="wiki-btn wiki-btn-primary" data-act="new">
          <i data-lucide="plus" class="lucide-icon"></i><span>New article</span>
        </button>
      </div>

      <!-- Article surface (reader + editor live here) -->
      <div class="wiki-article" hidden>
        <div class="wiki-toolbar">
          <div class="wiki-toolbar-spacer"></div>
          <button class="wiki-btn wiki-publish-btn" data-act="toggle-status" title="Publish / unpublish" hidden>
            <i data-lucide="globe" class="lucide-icon"></i><span class="wiki-publish-label">Publish</span>
          </button>
          <button class="wiki-btn" data-act="history" title="Revision history">
            <i data-lucide="history" class="lucide-icon"></i><span>History</span>
          </button>
          <button class="wiki-btn" data-act="edit" title="Edit article">
            <i data-lucide="pencil" class="lucide-icon"></i><span>Edit</span>
          </button>
          <button class="wiki-btn wiki-btn-primary" data-act="save" title="Save changes" hidden>
            <i data-lucide="check" class="lucide-icon"></i><span>Save</span>
          </button>
          <button class="wiki-btn" data-act="cancel" title="Discard changes" hidden>
            <span>Cancel</span>
          </button>
          <button class="wiki-btn wiki-btn-danger" data-act="delete" title="Delete article">
            <i data-lucide="trash-2" class="lucide-icon"></i>
          </button>
        </div>

        <div class="wiki-article-scroll">
          <!-- Banner shown when viewing an OLD revision (read-only) -->
          <div class="wiki-revision-banner" hidden>
            <span class="wiki-revision-banner-text"></span>
            <span class="wiki-revision-banner-actions">
              <button class="wiki-btn wiki-btn-primary" data-act="restore-this">
                <i data-lucide="rotate-ccw" class="lucide-icon"></i><span>Restore this version</span>
              </button>
              <button class="wiki-btn" data-act="exit-revision"><span>Back to current</span></button>
            </span>
          </div>

          <!-- Reader (rendered Markdown) -->
          <article class="wiki-reader">
            <h1 class="wiki-reader-title"></h1>
            <div class="wiki-reader-meta">
              <span class="wiki-reader-status" hidden></span>
              <span class="wiki-reader-category" hidden></span>
              <span class="wiki-reader-tags"></span>
            </div>
            <div class="wiki-reader-body md-body"></div>
            <div class="wiki-backlinks" hidden>
              <div class="wiki-backlinks-title">Linked from</div>
              <div class="wiki-backlinks-list"></div>
            </div>
          </article>

          <!-- Revision history panel (toggled by the History button) -->
          <div class="wiki-revisions" hidden>
            <div class="wiki-revisions-head">Revision history</div>
            <div class="wiki-revisions-list"></div>
          </div>

          <!-- Editor (inputs) -->
          <div class="wiki-editor" hidden>
            <label class="wiki-field">
              <span class="wiki-field-label">Title</span>
              <input class="wiki-editor-title" type="text" maxlength="120" placeholder="Article title" />
            </label>
            <label class="wiki-field">
              <span class="wiki-field-label">Visibility</span>
              <select class="wiki-editor-status">
                <option value="draft">Draft &mdash; internal (signed-in members only)</option>
                <option value="published">Published &mdash; public (visible to everyone)</option>
              </select>
            </label>
            <div class="wiki-field-row">
              <label class="wiki-field">
                <span class="wiki-field-label">Category</span>
                <input class="wiki-editor-category" type="text" placeholder="e.g. HR, Product (optional)" />
              </label>
              <label class="wiki-field">
                <span class="wiki-field-label">Tags</span>
                <input class="wiki-editor-tags" type="text" placeholder="comma,separated,tags" />
              </label>
            </div>
            <label class="wiki-field wiki-field-grow">
              <span class="wiki-field-label">Content
                <span class="wiki-field-hint">Markdown supported &middot; link another article with <code>[[Title]]</code></span>
              </span>
              <textarea class="wiki-editor-body" placeholder="Write the article in Markdown&hellip;"></textarea>
            </label>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="wiki-toast" role="status" aria-live="polite" hidden></div>
</div>
