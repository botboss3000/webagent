<!-- Toolbar -->
<div id="agents-toolbar">
  <div id="agents-toolbar-left">
    <span id="agents-toolbar-title">Agents</span>
    <span id="agents-toolbar-sub"> &middot; Agent templates &middot; system prompts &middot; model assignments</span>
  </div>
</div>

<!-- Card grid -->
<div id="agents-grid"></div>

<!-- Agent Manager chat bar — page-level assistant for creating and modifying agents -->
<!-- CHAT-PILL-SYNC: shares .chat-pill* styles with #chat-input-row,
     #ac-int-admin-chat-input-row, #autoagent-prompt-row. Style rules live
     in ui/css/app1.css under the "Chat-pill" block.
     ALIGNMENT WARNING — this pill's bottom is lined up with the chat panel's
     pill on purpose. That alignment depends on the footer row below the pill
     (#agent-builder-footer) staying a FIXED-height slot. If you add or change
     elements AROUND the pill here (extra buttons/rows above or below it), keep
     them inside that fixed slot — anything that makes the space below the pill
     TALLER will push this pill UP and break the alignment. See the
     PILL-PANEL-ALIGN notes in ui/css/agents.css before changing this markup. -->
<div id="agent-builder-bar">
  <div id="agent-builder-bar-row" class="chat-pill">
    <button type="button" id="agent-builder-bar-attach" class="chat-pill-attach" title="Attach files">
      <i data-lucide="plus" style="width:18px;height:18px;"></i>
    </button>
    <textarea id="agent-builder-bar-input" class="chat-pill-input" rows="1"
      placeholder="Ask webAgent to create an agent or manage your fleet"
      autocomplete="off"></textarea>
    <button type="button" id="agent-builder-bar-voice" class="chat-pill-voice" title="Record voice">
      <i data-lucide="mic" style="width:18px;height:18px;"></i>
    </button>
    <button type="button" id="agent-builder-bar-send" class="chat-pill-send" title="Send to webAgent">
      <i data-lucide="send" style="width:16px;height:16px;"></i>
    </button>
  </div>
  <!-- Footer row below the pill — eye toggle on the left, matching chat-footer-row -->
  <div id="agent-builder-footer" class="agent-builder-footer">
    <button type="button" id="agent-builder-bar-eye" class="agent-builder-eye-btn" title="Show/hide system-level agents">
      <i data-lucide="eye-off" style="width:16px;height:16px;"></i>
    </button>
  </div>
</div>

<!-- Per-agent inline panels are generated dynamically by agents.js -->
