[project]
name = "tui-app"
version = "0.2.0"
description = "WebAgent Server Manager — a server-independent TUI agent (Codebase Admin + Source Control)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.83.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "playwright>=1.48.0",
    # Windows PTY for the terminal_* tools (interactive program control).
    # Unix uses the stdlib `pty`, so the dep is Windows-only.
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10.0",
]

[project.scripts]
tui-app = "tui_app.__main__:main"
webagent = "tui_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tui_app"]
