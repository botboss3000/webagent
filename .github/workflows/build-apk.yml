name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust (for compiling native Python wheels)
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Copy source into Android project
        run: |
          # Python backend
          mkdir -p android/app/src/main/python/app
          cp -r app/* android/app/src/main/python/app/
          cp index.html android/app/src/main/python/index.html
          # UI frontend (CSS/JS/assets; main shell is root index.html)
          mkdir -p android/app/src/main/python/ui
          cp -r ui/* android/app/src/main/python/ui/

      - name: Dummy Cache Buster
        run: echo "cache bust $(date +%s)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webAgent-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
