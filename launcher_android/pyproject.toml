[project]
name = "launcher-android"
version = "0.1.0"
description = "Termux/proot-distro TUI launcher for webAgent on Android"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launcher_android"]
