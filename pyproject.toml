[project]
name = "webagent"
version = "0.2.0"
description = "webAgent — FastAPI service with Supabase and dynamic tool loading"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "openai==1.59.6",
    "httpx==0.27.2",
    "supabase==2.29.0",
    "pydantic>=2.10.0,<3",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "tiktoken>=0.5.2,<1",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
