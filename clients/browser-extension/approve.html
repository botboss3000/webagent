<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Allow custom JavaScript?</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; }
    h1 { font-size: 14px; margin: 0 0 6px; }
    .where { color: #888; font-size: 12px; margin-bottom: 10px; word-break: break-all; }
    pre { background: #8881; border: 1px solid #8883; border-radius: 8px; padding: 10px; max-height: 170px; overflow: auto; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
    .warn { color: #b45309; font-size: 12px; margin: 8px 0; }
    .actions { display: flex; gap: 10px; margin-top: 12px; }
    button { font: inherit; flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid #8886; cursor: pointer; }
    #allow { border-color: #dc2626; background: #dc2626; color: #fff; }
    #deny { background: #8881; }
  </style>
</head>
<body>
  <h1>Run custom JavaScript on this page?</h1>
  <div class="where" id="where">—</div>
  <pre id="code">—</pre>
  <div class="warn">Your WebAgent agent is asking to run the code above in your real browser session. Only allow if you trust this action.</div>
  <div class="actions">
    <button id="deny">Deny</button>
    <button id="allow">Allow once</button>
  </div>
  <script src="approve.js"></script>
</body>
</html>
