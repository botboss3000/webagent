[project]
name = "webagent-tui"
version = "0.1.0"
description = "webAgent Server Manager — a server-independent TUI agent (Codebase Admin + Source Control)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.83.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10.0",
]

[project.scripts]
webagent-tui = "webagent_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webagent_tui"]
