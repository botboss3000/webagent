<!-- Toolbar
     ---- HARMONY: this toolbar's bin logic (back button, title/subtitle swap,
     ---- restore button, and the morphing recycle↔trash button) mirrors
     ---- sessions.html and automations.html. Any change to the bin states or
     ---- right-side actions here must be copied to those two (and vice versa).
     ---- Grep HARMONY-AGENTS-BIN / HARMONY-SESSIONS-BIN to find the call sites.
     ---- NOTE — divergence: the Agents page dropped its icon Select-all / Clear
     ---- buttons (bulk selection still works via each card's checkbox) and its
     ---- toolbar is now a vertical action stack beside the carousel strip.
     ---- Sessions and Automations are tables whose top-left header cell already
     ---- toggles all rows, so they deliberately DROP the toolbar select buttons. -->
<!-- The right-side actions drive the recycling bin. On the Agents page the recycle
     button moves checked agents to the bin (or, with nothing checked, opens the
     bin). In the bin a Restore button shows, and the recycle button permanently
     deletes the checked agents. -->
<!-- Card grid -->
<div id="agents-grid" class="agents-phantom">
  <!-- RETURN-TO-AGENTS-HEADER (sister of the recycling-bin header — keep cohesive)
       This toolbar is shared between the normal Agents view, the recycling bin, and
       the Clones view. It is a VERTICAL action stack pinned to the right of the
       carousel strip: back button (bin/clones), Restore (bin), show-system eye and
       recycle/trash. Any change to one must be mirrored to the other. -->
  <div class="agents-top-row">
  <!-- PHANTOM FIRST PAINT — static skeleton, shipped INSIDE the partial so the
       tab is never blank between opening and agents.js's first render (the entry
       module is a large dynamic import). It mirrors the real merged Overview —
       the top row, a horizontal CAROUSEL strip of 120px agent squares (exactly
       two here; the JS skeleton also paints exactly two), and the embedded
       Sessions section below (phantom table rows) — reusing the real
       .agents-squares-wrap / .agents-squares / .agent-skeleton and
       .sessions-skeleton-row layout classes so the swap to the JS skeleton is
       zero-layout-shift. Where the real toolbar buttons will stack, the phantom
       shows two shimmer BUTTON SHAPES (.agents-toolbar-phantom); the real
       #agents-toolbar is display:none until takeover, so no live buttons are
       visible in the skeleton. The .agents-phantom markers on #agents-grid and
       #sessions-section replicate the merged layout's CSS before JS runs;
       _syncMergedLayout strips them at takeover. Purely decorative: aria-hidden,
       pointer-events:none, no data-* attributes, no click wiring; _renderSkeleton
       and _renderTable rebuild the grid and tbody wholesale on first paint, so
       the phantom can never leak into the live page.
       Styling: the .agents-phantom block in agents.css.
       REMOVE-WHEN: the Agents page is dropped from the main page catalog. -->
  <div class="agents-squares-wrap">
    <button type="button" class="agents-carousel-chev left" aria-label="Scroll agents left" tabindex="-1">&#10094;</button>
    <button type="button" class="agents-carousel-chev right" aria-label="Scroll agents right" tabindex="-1">&#10095;</button>
    <div class="agents-squares">
      <div class="agent-row">
        <div class="agent-skeleton">
          <div class="sk-icon sk-shimmer"></div>
          <div class="sk-lines">
            <div class="sk-line sk-shimmer" style="width:78%"></div>
            <div class="sk-line sk-shimmer" style="width:42%"></div>
          </div>
        </div>
      </div>
      <div class="agent-row">
        <div class="agent-skeleton">
          <div class="sk-icon sk-shimmer"></div>
          <div class="sk-lines">
            <div class="sk-line sk-shimmer" style="width:62%"></div>
            <div class="sk-line sk-shimmer" style="width:35%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
    <!-- The toolbar is a VERTICAL stack of actions pinned to the RIGHT of the
         carousel strip, in the same row (the "Agents" heading is gone). -->
    <div id="agents-toolbar">
      <div id="agents-toolbar-left">
        <button type="button" id="agents-back-btn" title="Back to Agents" style="display:none;">
          <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
        </button>
      </div>
      <div id="agents-toolbar-actions">
        <button type="button" id="agents-restore-btn" class="agents-tb-btn agents-tb-restore" title="Restore selected agents" style="display:none;">
          <i data-lucide="archive-restore" style="width:15px;height:15px;"></i><span>Restore</span>
        </button>
        <!-- Show/hide system-level agents. Agents-only control (NOT part of the
             HARMONY bin action set) — it sits above the recycle button but drives
             _showSystem, not the bin. -->
        <button type="button" id="agents-system-btn" class="agents-tb-btn agents-tb-icon" title="Show system agents">
          <i data-lucide="eye-off" style="width:15px;height:15px;"></i>
        </button>
        <button type="button" id="agents-trash-btn" class="agents-tb-trash" data-state="trash" title="Recycling bin">
          <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
        </button>
      </div>
    </div>
    <!-- Skeleton stand-in for the real toolbar — shown while the phantom/
         skeleton state is active, real #agents-toolbar hidden (see the
         .agents-toolbar-phantom rules in agents.css). Two shimmer button
         shapes where the eye/recycle stack will land. Purely decorative. -->
    <div class="agents-toolbar-phantom" aria-hidden="true">
      <div class="agents-tb-phantom sk-shimmer"></div>
      <div class="agents-tb-phantom sk-shimmer"></div>
    </div>
  </div>
</div>

<!-- The page-level "Ask WebAgent…" footer pill was removed. Its hybrid
     replacement (live ability search + chat-to-WebAgent) now lives above the
     ability table inside each agent's Abilities tab — see buildAbilitySearchPill

<!-- ── Shared Sessions section ────────────────────────────────────────────────
     The Sessions page (ui/main-panel/agents/sessions/) is embedded BELOW the agents
     carousel and is moved into the All Agents Sessions tab. When an agent card
     opens, its Sessions tab moves this same DOM node into the card and filters it to that agent. The sessions engine
     (sessions-page.js) is driven by startAgents() → startSessions(). Keep this
     markup and its IDs in sync with ui/main-panel/agents/sessions/sessions.html. -->
<div id="sessions-section" class="agents-phantom">
  <div id="sessions-toolbar">
    <div id="sessions-toolbar-left">
      <!-- SESSIONS-VIEW-CHIP: cycles the view filter Sessions → All → Bin. -->
      <button type="button" id="sessions-view-btn" class="sessions-view-btn" data-view="sessions" title="View: Sessions — click to switch (All / Bin)">Sessions</button>
      <i id="sessions-loading-spinner" data-lucide="loader-2" class="sessions-toolbar-spinner" style="width:13px;height:13px;display:none;"></i>
      <span id="sessions-loading-status" class="sessions-loading-status" aria-live="polite"></span>
    </div>
    <div id="sessions-toolbar-actions" class="search-collapsed">
      <!-- COLLAPSIBLE-SEARCH: the toolbar starts ICON-ONLY. The
           `search-collapsed` class ships HERE (static HTML) so the collapsed
           state is the very first paint — no JS timing involved.
           sessions-page.js only re-adds it on init (idempotent), removes it
           on trigger click to reveal the T+C/Title chip + search field, and
           re-adds it on a second click or Escape. Styling lives in
           sessions.css ("Collapsible search" block); sessions.html mirrors
           this markup — keep them in sync. -->
      <button type="button" id="sessions-search-trigger" class="sessions-tb-btn sessions-tb-search" title="Search sessions" aria-label="Search sessions" aria-expanded="false">
        <i data-lucide="search" style="width:15px;height:15px;"></i>
      </button>
      <div id="sessions-search-area" class="sessions-search-area">
        <button type="button" id="sessions-search-mode-btn" class="sessions-search-mode-btn" data-mode="content" title="Search mode: Title + Content">T+C</button>
        <div class="sessions-search-wrap">
          <i data-lucide="search" class="sessions-search-icon" style="width:14px;height:14px;"></i>
          <input type="text" id="sessions-search-input" class="sessions-search-input" placeholder="Search" spellcheck="false" autocomplete="off">
          <span id="sessions-msg-scanning" class="sessions-msg-scanning" title="Searching messages…"></span>
          <button type="button" id="sessions-search-clear" class="sessions-search-clear" title="Clear search" aria-label="Clear search" style="display:none;">
            <i data-lucide="x" style="width:13px;height:13px;"></i>
          </button>
        </div>
      </div>
      <button type="button" id="sessions-restore-btn" class="sessions-tb-btn sessions-tb-restore" title="Restore selected sessions" style="display:none;">
        <i data-lucide="archive-restore" style="width:15px;height:15px;"></i><span>Restore</span>
      </button>
      <!-- HARMONY-SESSIONS-BIN: trash+bin migration mirrors agents-tb-trash. -->
      <button type="button" id="sessions-trash-btn" class="sessions-tb-trash" data-state="trash" title="Open recycling bin">
        <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
      </button>
      <button type="button" id="sessions-refresh-btn" class="sessions-tb-btn sessions-tb-refresh" title="Refresh sessions page">
        <i data-lucide="refresh-cw" style="width:15px;height:15px;"></i>
      </button>
    </div>
  </div>
