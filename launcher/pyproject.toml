[project]
name = "webagent-launcher"
version = "0.1.0"
description = "Polished TUI launcher for webagent — controls server, resets, browser launch"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "textual>=0.83.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10.0",
    "pillow>=10.0.0",
]

[project.scripts]
webagent-launcher = "webagent_launcher.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webagent_launcher"]
