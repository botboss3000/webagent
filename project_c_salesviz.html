<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SalesViz — Data Visualization Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0b1120; font-family: 'Segoe UI', system-ui, sans-serif; color: #e2e8f0; padding: 20px; min-height: 100vh; }
h1 { font-size: 26px; margin-bottom: 6px; }
h1 span { color: #f472b6; }
.sub { color: #64748b; font-size: 13px; margin-bottom: 20px; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
.controls label { font-size: 12px; color: #94a3b8; }
.controls select { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.controls select:focus { outline: none; border-color: #f472b6; }
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.chart-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
.chart-box h3 { font-size: 13px; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.chart-box.full { grid-column: 1 / -1; }
.chart-box canvas { max-height: 280px; }
.chart-box.full canvas { max-height: 320px; }
.stats-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px 20px; flex: 1; min-width: 120px; text-align: center; }
.stat-card .num { font-size: 24px; font-weight: 700; color: #f472b6; }
.stat-card .label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
.heatmap-table { width: 100%; border-collapse: separate; border-spacing: 2px; font-size: 12px; }
.heatmap-table th { color: #94a3b8; padding: 6px 8px; text-align: left; font-weight: 500; }
.heatmap-table td { padding: 6px 8px; text-align: right; border-radius: 3px; font-weight: 600; color: #0b1120; transition: 0.2s; }
.data-badge { background: #334155; padding: 2px 8px; border-radius: 4px; font-size: 11px; color: #94a3b8; }
</style>
</head>
<body>
<h1>📊 <span>SalesViz</span></h1>
<div class="sub">Mock sales data — interactive charts with animated transitions</div>

<div class="stats-row" id="statsRow"></div>

<div class="controls">
  <label>Region:</label>
  <select id="regionFilter"><option value="all">All Regions</option></select>
  <label>Product:</label>
  <select id="productFilter"><option value="all">All Products</option></select>
  <label>Month:</label>
  <select id="monthFilter"><option value="all">All Months</option></select>
  <span class="data-badge" id="rowCount">0 rows</span>
</div>

<div class="chart-grid">
  <div class="chart-box"><h3>📊 Revenue by Product (Bar)</h3><canvas id="barChart"></canvas></div>
  <div class="chart-box"><h3>📈 Revenue Trend (Line)</h3><canvas id="lineChart"></canvas></div>
  <div class="chart-box"><h3>🥧 Revenue by Region (Pie)</h3><canvas id="pieChart"></canvas></div>
  <div class="chart-box"><h3>🗺 Revenue per Region × Product (Heatmap)</h3><canvas id="heatmapChart"></canvas></div>
</div>

<script>
// ─── Mock CSV data ───
const REGIONS = ['North America','Europe','Asia Pacific','Latin America','Middle East'];
const PRODUCTS = ['CloudSync Pro','DataVault','InsightAI','EdgeCompute','SecureMesh'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function generateCSV(rows=240) {
  const lines = ['region,product,month,revenue'];
  for (let i = 0; i < rows; i++) {
    const region = REGIONS[Math.floor(Math.random()*REGIONS.length)];
    const product = PRODUCTS[Math.floor(Math.random()*PRODUCTS.length)];
    const month = MONTHS[Math.floor(Math.random()*MONTHS.length)];
    const revenue = Math.round((Math.random() * 80000 + 10000) * 100) / 100;
    lines.push(`${region},${product},${month},${revenue}`);
  }
  return lines.join('\n');
}

// ─── Parse CSV ───
function parseCSV(csvText) {
  const lines = csvText.trim().split('\n');
  const headers = lines[0].split(',');
  const data = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = lines[i].split(',');
    if (vals.length === 4) {
      data.push({ region: vals[0], product: vals[1], month: vals[2], revenue: parseFloat(vals[3]) });
    }
  }
  return data;
}

let allData = parseCSV(generateCSV(240));
let filteredData = [...allData];

// ─── Populate filters ───
function initFilters() {
  const regionSel = document.getElementById('regionFilter');
  const productSel = document.getElementById('productFilter');
  const monthSel = document.getElementById('monthFilter');
  [...new Set(allData.map(d => d.region))].sort().forEach(r => { const o = document.createElement('option'); o.value=r; o.textContent=r; regionSel.appendChild(o); });
  [...new Set(allData.map(d => d.product))].sort().forEach(p => { const o = document.createElement('option'); o.value=p; o.textContent=p; productSel.appendChild(o); });
  [...new Set(allData.map(d => d.month))].sort((a,b) => MONTHS.indexOf(a)-MONTHS.indexOf(b)).forEach(m => { const o = document.createElement('option'); o.value=m; o.textContent=m; monthSel.appendChild(o); });
}

function applyFilters() {
  const region = document.getElementById('regionFilter').value;
  const product = document.getElementById('productFilter').value;
  const month = document.getElementById('monthFilter').value;
  filteredData = allData.filter(d =>
    (region === 'all' || d.region === region) &&
    (product === 'all' || d.product === product) &&
    (month === 'all' || d.month === month)
  );
  document.getElementById('rowCount').textContent = filteredData.length + ' rows';
  updateStats();
  updateCharts();
}

document.getElementById('regionFilter').addEventListener('change', applyFilters);
document.getElementById('productFilter').addEventListener('change', applyFilters);
document.getElementById('monthFilter').addEventListener('change', applyFilters);

// ─── Stats ───
function updateStats() {
  const total = filteredData.reduce((s,d) => s + d.revenue, 0);
  const avg = filteredData.length ? total / filteredData.length : 0;
  const max = filteredData.length ? Math.max(...filteredData.map(d => d.revenue)) : 0;
  const min = filteredData.length ? Math.min(...filteredData.map(d => d.revenue)) : 0;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="num">$${(total/1000).toFixed(0)}k</div><div class="label">Total Revenue</div></div>
    <div class="stat-card"><div class="num">$${avg.toFixed(0)}</div><div class="label">Avg per Row</div></div>
    <div class="stat-card"><div class="num">$${(max/1000).toFixed(1)}k</div><div class="label">Max Sale</div></div>
    <div class="stat-card"><div class="num">$${(min/1000).toFixed(1)}k</div><div class="label">Min Sale</div></div>
  `;
}

// ─── Charts ───
let barChart, lineChart, pieChart, heatmapChart;

function aggregateBy(field) {
  const map = {};
  filteredData.forEach(d => {
    const key = d[field];
    map[key] = (map[key]||0) + d.revenue;
  });
  return Object.entries(map).sort((a,b) => b[1]-a[1]);
}

function aggregateHeatmap() {
  const map = {};
  REGIONS.forEach(r => { map[r] = {}; PRODUCTS.forEach(p => { map[r][p] = 0; }); });
  filteredData.forEach(d => { if (map[d.region] && map[d.region][d.product] !== undefined) map[d.region][d.product] += d.revenue; });
  return map;
}

function aggregateMonthly() {
  const map = {};
  MONTHS.forEach(m => map[m]=0);
  filteredData.forEach(d => { if (map[d.month]!==undefined) map[d.month] += d.revenue; });
  return MONTHS.filter(m => map[m]>0).map(m => ({ month: m, revenue: map[m] }));
}

function updateCharts() {
  const barData = aggregateBy('product');
  const lineData = aggregateMonthly();
  const pieData = aggregateBy('region');
  const heatData = aggregateHeatmap();

  const anim = { duration: 600, easing: 'easeOutQuart' };

  // Bar
  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: barData.map(d => d[0]),
      datasets: [{
        label: 'Revenue ($)',
        data: barData.map(d => d[1]),
        backgroundColor: ['#f472b6','#60a5fa','#4ade80','#fbbf24','#a78bfa'],
        borderRadius: 6
      }]
    },
    options: {
      responsive: true, animation: anim,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color:'#94a3b8' }, grid: { color:'#334155' } },
        y: { ticks: { color:'#94a3b8', callback: v => '$'+(v/1000).toFixed(0)+'k' }, grid: { color:'#334155' } }
      }
    }
  });

  // Line
  if (lineChart) lineChart.destroy();
  lineChart = new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: {
      labels: lineData.map(d => d.month),
      datasets: [{
        label: 'Revenue ($)',
        data: lineData.map(d => d.revenue),
        borderColor: '#f472b6',
        backgroundColor: 'rgba(244,114,182,0.1)',
        fill: true,
        tension: 0.3,
        pointBackgroundColor: '#f472b6',
        pointRadius: 4
      }]
    },
    options: {
      responsive: true, animation: anim,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color:'#94a3b8' }, grid: { color:'#334155' } },
        y: { ticks: { color:'#94a3b8', callback: v => '$'+(v/1000).toFixed(0)+'k' }, grid: { color:'#334155' } }
      }
    }
  });

  // Pie
  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: {
      labels: pieData.map(d => d[0]),
      datasets: [{
        data: pieData.map(d => d[1]),
        backgroundColor: ['#f472b6','#60a5fa','#4ade80','#fbbf24','#a78bfa'],
        borderColor: '#1e293b',
        borderWidth: 3
      }]
    },
    options: {
      responsive: true, animation: anim,
      plugins: {
        legend: { position:'bottom', labels: { color:'#94a3b8', padding:10 } }
      }
    }
  });

  // Heatmap (rendered as table for clarity)
  const hmCtx = document.getElementById('heatmapChart');
  const parent = hmCtx.parentElement;
  // Remove old table if exists
  const oldTable = parent.querySelector('.heatmap-table');
  if (oldTable) oldTable.remove();
  hmCtx.style.display = 'none';

  const maxVal = Math.max(...Object.values(heatData).flatMap(r => Object.values(r)));
  const table = document.createElement('table');
  table.className = 'heatmap-table';
  let html = '<tr><th>Region \\ Product</th>';
  PRODUCTS.forEach(p => { html += `<th>${p}</th>`; });
  html += '</tr>';
  REGIONS.forEach(r => {
    html += `<tr><th>${r}</th>`;
    PRODUCTS.forEach(p => {
      const v = heatData[r][p] || 0;
      const intensity = maxVal > 0 ? v / maxVal : 0;
      // color from light pink to hot pink
      const r2 = Math.round(200 - intensity * 130);
      const g = Math.round(200 - intensity * 180);
      const b2 = Math.round(200 - intensity * 80);
      const bg = `rgb(${r2},${g},${b2})`;
      html += `<td style="background:${bg}">$${(v/1000).toFixed(0)}k</td>`;
    });
    html += '</tr>';
  });
  table.innerHTML = html;
  parent.appendChild(table);
}

// ─── Init ───
initFilters();
applyFilters();

// Re-generate data every 10s to demo animation
setInterval(() => {
  allData = parseCSV(generateCSV(240));
  applyFilters();
}, 10000);

console.log('✅ SalesViz ready — 4 chart types, filters, animated updates every 10s');
</script>
</body>
</html>
