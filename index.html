<!-- PWA: manifest + service worker -->
<!-- ╔═══════════════════════════════════════════════════════════════╗
     ║  Bypass stale service worker: unregister + drop cache on     ║
     ║  every hard reload. Inserted early (blocking) so it runs     ║
     ║  before the module script. Remove this block once the        ║
     ║  service worker is confirmed clean.                          ║
     ╚═══════════════════════════════════════════════════════════════╝ -->
<script>
if ('serviceWorker' in navigator) {
  (async function() {
    // Unregister any existing service worker for this scope
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const reg of regs) {
      await reg.unregister();
    }
    // Delete all caches
    const keys = await caches.keys();
    for (const key of keys) {
      await caches.delete(key);
    }
    // If a SW was controlling the page, reload so we get a clean load
    if (regs.length > 0 && navigator.serviceWorker.controller) {
      window.location.reload();
    }
  })();
}
</script>

<!-- crypto.randomUUID polyfill for insecure contexts (plain HTTP / IP access) -->
<script>
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID !== 'function') {
    crypto.randomUUID = function () {
      // RFC4122 v4 using getRandomValues (works in insecure contexts)
      const b = crypto.getRandomValues(new Uint8Array(16));
      b[6] = (b[6] & 0x0f) | 0x40;
      b[8] = (b[8] & 0x3f) | 0x80;
      const h = Array.from(b, x => x.toString(16).padStart(2, '0'));
      return `${h[0]}${h[1]}${h[2]}${h[3]}-${h[4]}${h[5]}-${h[6]}${h[7]}-${h[8]}${h[9]}-${h[10]}${h[11]}${h[12]}${h[13]}${h[14]}${h[15]}`;
    };
  }
</script>

<script>
  // Apply saved theme + chat panel width before paint to avoid flash on startup.
  (function () {
    try {
      var t = localStorage.getItem('webagent_theme') || 'dark';
      var light = t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
      if (light) document.body.classList.add('light-mode');
    } catch (_) {}
    try {
      var w = parseInt(localStorage.getItem('chatPanelWidth'), 10);
      if (!isNaN(w) && w > 0) {
        var s = document.createElement('style');
        s.textContent = '@media (min-width: 801px) { #chat-panel{width:' + w + 'px;} }';
        document.head.appendChild(s);
      }
    } catch (_) {}
    // Pre-paint: set body class for mobile chat/main panel visibility so the
    // wrong panel never flashes during initial render.
    try {
      var isMobile = window.innerWidth <= 800;
      var key = isMobile ? 'chatPanelVisibleMobile' : 'chatPanelVisible';
      var stored = localStorage.getItem(key);
      var visible = stored === null ? !isMobile : stored !== 'false';
      document.body.classList.toggle('chat-visible', visible);
      document.body.classList.toggle('chat-hidden', !visible);
    } catch (_) {}
    // Boot: show a compact spinner in the header while JS initialises.
    // The main panel and tabs are accessible from the start — no full-screen
    // spinner or collapsed main panel. is-booting is removed by tabs.js once
    // the tab content is mounted.
    try {
      document.body.classList.add('is-booting');
    } catch (_) {}
  })();
</script>
<script>
  // Track the visible viewport height so the app shrinks when the mobile
  // on-screen keyboard appears. dvh handles browser chrome but on Android
  // Chrome does not shrink for keyboards, so we drive --app-height from
  // window.visualViewport.height (falls back to innerHeight).
  (function () {
    var root = document.documentElement;
    var vv = window.visualViewport;
    function apply() {
      var h = (vv ? vv.height : window.innerHeight);
      root.style.setProperty('--app-height', h + 'px');
    }
    window.__appHeightApply = apply;
    apply();
    if (vv) {
      vv.addEventListener('resize', apply);
      vv.addEventListener('scroll', apply);
    }
    window.addEventListener('resize', apply);
    window.addEventListener('orientationchange', function () {
      setTimeout(apply, 120);
    });
  })();
</script>
<script>
  // Chat toggle — global function + event delegation. Works regardless of
  // module load timing, browser cache state, or DOM mutation observers.
  window.__isMobileChatLayout = function () { return window.innerWidth <= 800; };
  window.__chatVisibilityKey = function () {
    return window.__isMobileChatLayout() ? 'chatPanelVisibleMobile' : 'chatPanelVisible';
  };
  window.__chatVisibilityDefault = function () {
    return window.__isMobileChatLayout() ? false : true;
  };
  window.__getChatVisible = function () {
    try {
      var v = localStorage.getItem(window.__chatVisibilityKey());
      if (v === null) return window.__chatVisibilityDefault();
      return v !== 'false';
    } catch (_) { return window.__chatVisibilityDefault(); }
  };
  window.__applyChatVisible = function (visible) {
    var chatPanel = document.getElementById('chat-panel');
    var handle = document.getElementById('chat-resize-handle');
    var btn = document.getElementById('chat-toggle-btn');
    var mainPanel = document.getElementById('main-panel');
    var isMobile = window.__isMobileChatLayout();
    // Body class drives mobile show/hide via CSS — keep inline display untouched on mobile.
    if (document.body) {
      document.body.classList.toggle('chat-visible', visible);
      document.body.classList.toggle('chat-hidden', !visible);
    }
    if (isMobile) {
      // Clear any inline display from prior desktop toggles; CSS owns visibility now.
      if (chatPanel) chatPanel.style.display = '';
      if (handle)    handle.style.display    = '';
      if (mainPanel) mainPanel.style.display = '';
    } else {
      // Desktop: chat side-by-side; toggle hides chat only.
      if (chatPanel) chatPanel.style.display = visible ? '' : 'none';
      if (handle)    handle.style.display    = visible ? '' : 'none';
      if (mainPanel) mainPanel.style.display = '';
    }
    if (btn) btn.classList.toggle('active', visible);
    try { localStorage.setItem(window.__chatVisibilityKey(), String(visible)); } catch (_) {}
  };
  window.__toggleChat = function () {
    window.__applyChatVisible(!window.__getChatVisible());
  };
  // Delegated capture-phase listener on document. Survives DOM rebuilds.
  // Triple-fallback to handle Lucide's MutationObserver swapping SVGs mid-click:
  //   1) closest() on e.target
  //   2) walk composedPath() (immutable snapshot from dispatch time)
  //   3) hit-test via elementFromPoint at click coords
  document.addEventListener('click', function (e) {
    var btn = null;
    if (e.target && e.target.closest) {
      btn = e.target.closest('#chat-toggle-btn');
    }
    if (!btn && typeof e.composedPath === 'function') {
      var path = e.composedPath();
      for (var i = 0; i < path.length; i++) {
        if (path[i] && path[i].id === 'chat-toggle-btn') { btn = path[i]; break; }
      }
    }
    if (!btn) {
      var hit = document.elementFromPoint(e.clientX, e.clientY);
      if (hit && hit.closest) btn = hit.closest('#chat-toggle-btn');
    }
    if (btn) {
      e.stopPropagation();
      e.preventDefault();
      window.__toggleChat();
    }
  }, true);
  // Apply visibility once DOM is ready
  function _initChatVisibility() {
    window.__applyChatVisible(window.__getChatVisible());
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _initChatVisibility);
  } else {
    _initChatVisibility();
  }
  // Re-apply per-layout visibility on viewport crossings
  (function () {
    var lastMobile = window.__isMobileChatLayout();
    window.addEventListener('resize', function () {
      var nowMobile = window.__isMobileChatLayout();
      if (nowMobile !== lastMobile) {
        lastMobile = nowMobile;
        window.__applyChatVisible(window.__getChatVisible());
      }
    });
  })();

  // (Swipe gesture removed — was causing accidental view switches)
</script>

  <!-- Pre-paint header-tab visibility/order.
       The header tab buttons above are authored statically, but which ones a
       user actually wants (and in what order) is an admin preference saved in
       localStorage by App Settings → Main Panel Pages. This block applies that
       preference synchronously BEFORE first paint, so pages the admin turned
       off never flash into view. The page list + storage keys are the source
       of truth in ui/js/app-config.js (_MAIN_PANEL_PAGES) — keep them in sync.
       Admin Tools is locked-visible and never hidden here. -->
  <script>
  (function () {
    try {
      var DEFAULT_ORDER = ['admin-tools', 'agents', 'autoagent', 'web', 'terminal'];
      var bar = document.getElementById('main-tabs');
      if (!bar) return;

      var order = DEFAULT_ORDER.slice();
      try {
        var savedOrder = JSON.parse(localStorage.getItem('mainPanelOrder') || 'null');
        if (Array.isArray(savedOrder)
            && savedOrder.length === DEFAULT_ORDER.length
            && DEFAULT_ORDER.every(function (id) { return savedOrder.indexOf(id) >= 0; })) {
          order = savedOrder;
        }
      } catch (e) {}

      var hidden = [];
      try {
        var savedHidden = JSON.parse(localStorage.getItem('mainPanelHidden') || 'null');
        if (Array.isArray(savedHidden)) hidden = savedHidden;
      } catch (e) {}

      // Map each page id to its header element. Admin Tools lives inside a
      // wrapper group (so it can carry the health dot), so map to the group.
      var adminGroup = document.getElementById('admin-tools-group');
      var byId = {};
      if (adminGroup) byId['admin-tools'] = adminGroup;
      bar.querySelectorAll('.main-tab').forEach(function (btn) {
        var id = btn.dataset.value;
        if (!id) return;
        byId[id] = (adminGroup && adminGroup.contains(btn)) ? adminGroup : btn;
      });

      // Reorder + show/hide. Nodes stay in the DOM (display toggled) so a later
      // un-hide in App Settings restores them live without a reload.
      order.forEach(function (id) {
        var el = byId[id];
        if (!el) return;
        var hide = id !== 'admin-tools' && hidden.indexOf(id) >= 0;
        el.style.display = hide ? 'none' : '';
        bar.appendChild(el);
      });
    } catch (e) {}
  })();
  </script>

<script type="module">
  // Boot the partial loader, wait for every HTML partial to be injected,
  // then dynamically import the main JS modules so their getElementById
  // / querySelector calls resolve against a fully populated DOM.
  import { partialsReady } from './ui/js/partial-loader.js';
  await partialsReady;
  await Promise.all([
    import('./ui/js/main.js'),
    import('./ui/js/attachments.js'),
    import('./ui/js/data-sources.js'),
  ]);

  // ── Register service worker for PWA support ──
  if ('serviceWorker' in navigator) {
    // If a worker is ALREADY controlling this page, a later controllerchange
    // means an UPDATED worker (new sw.js / cache version) just took over —
    // reload once so the fresh app shell (JS/CSS) is actually used instead of
    // the previous cached copy. Guarded so a first-ever install doesn't reload
    // and it never loops.
    if (navigator.serviceWorker.controller) {
      let _swReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (_swReloaded) return;
        _swReloaded = true;
        window.location.reload();
      });
    }
    try {
      const reg = await navigator.serviceWorker.register('/sw.js');
      reg.update().catch(() => {});   // proactively check for a new sw.js each load
      console.log('[PWA] Service worker registered:', reg.scope);
    } catch (err) {
      console.warn('[PWA] Service worker registration failed:', err);
    }
  }
</script>
<!-- ── Lucide icons + horizontal tab strip with carousel ───────── -->
<script>
(function () {
  // Render all data-lucide icons in the DOM
  lucide.createIcons();

  // ── Horizontal tab strip ─────────────────────────────────────
  // The hidden <select id="main-tab-select"> is used by tabs.js.
  // This block drives the visible tab buttons + chevron carousel
  // and stays in sync when tabs change externally.

  var nativeSelect = document.getElementById('main-tab-select');
  var tabBar       = document.getElementById('main-tabs');
  var tabWrap      = document.getElementById('main-tabs-wrap');
  var chevLeft     = document.getElementById('main-tabs-chev-left');
  var chevRight    = document.getElementById('main-tabs-chev-right');
  if (!nativeSelect || !tabBar || !tabWrap) return;

  function updateChevrons() {
    if (!chevLeft || !chevRight) return;
    var overflow = tabBar.scrollWidth - tabBar.clientWidth > 1;
    tabWrap.classList.toggle('has-overflow', overflow);
    chevLeft.classList.toggle('visible', overflow && tabBar.scrollLeft > 1);
    chevRight.classList.toggle('visible', overflow && tabBar.scrollLeft < tabBar.scrollWidth - tabBar.clientWidth - 1);
  }

  function syncActive(tabId) {
    tabBar.querySelectorAll('.main-tab').forEach(function (b) {
      b.classList.toggle('active', b.dataset.value === tabId);
    });
    var activeBtn = tabBar.querySelector('.main-tab.active');
    if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    requestAnimationFrame(updateChevrons);
    setTimeout(updateChevrons, 350); // catch end of smooth scroll
  }

  // Pick a tab
  tabBar.querySelectorAll('.main-tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var val = btn.dataset.value;
      nativeSelect.value = val;
      nativeSelect.dispatchEvent(new Event('change', { bubbles: true }));
      syncActive(val);
    });
  });

  // Chevron carousel (matches app-config tabs pattern)
  if (chevLeft && chevRight) {
    var scrollStep = function () { return Math.max(80, Math.floor(tabBar.clientWidth * 0.6)); };
    chevLeft.addEventListener('click', function () { tabBar.scrollBy({ left: -scrollStep(), behavior: 'smooth' }); });
    chevRight.addEventListener('click', function () { tabBar.scrollBy({ left: scrollStep(), behavior: 'smooth' }); });
    tabBar.addEventListener('scroll', updateChevrons, { passive: true });

    requestAnimationFrame(function () {
      updateChevrons();
      var active = tabBar.querySelector('.main-tab.active');
      if (active) active.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
    if (typeof ResizeObserver !== 'undefined') {
      var roPending = false;
      var ro = new ResizeObserver(function () {
        if (roPending) return;
        roPending = true;
        requestAnimationFrame(function () { roPending = false; updateChevrons(); });
      });
      ro.observe(tabBar);
      ro.observe(tabWrap);
    }
    window.addEventListener('resize', updateChevrons);
  }

  // MutationObserver: sync when tabs.js (or config menu) switches tab externally
  var tabContents = document.querySelectorAll('.tab-content');
  if (tabContents.length) {
    var observer = new MutationObserver(function () {
      var active = document.querySelector('.tab-content.active');
      if (active) syncActive(active.id.replace('tab-', ''));
    });
    tabContents.forEach(function (el) {
      observer.observe(el, { attributes: true, attributeFilter: ['class'] });
    });
  }

  // Sync to whatever tab is currently active on load
  var initActive = document.querySelector('.tab-content.active');
  if (initActive) syncActive(initActive.id.replace('tab-', ''));

})();
</script>
