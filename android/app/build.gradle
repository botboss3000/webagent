plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.webagent.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.webagent.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        python {
            buildPython "python3"
            pip {
                // Use versions available on Chaquopy's Android wheel index
                install "fastapi"
                install "uvicorn"
                install "httpx"
                install "supabase==2.6.0"
                install "pydantic"
                install "maturin"
                install "python-dotenv"
                install "python-multipart"
                install "openai"
                install "websockets"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
