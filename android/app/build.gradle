plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.webagent.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.webagent.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        python {
            buildPython "python3"
            pip {
                install "fastapi==0.104.1"
                install "uvicorn==0.24.0"
                install "httpx==0.27.2"
                install "supabase==2.29.0"
                install "pydantic>=2.10.0,<3"
                install "python-dotenv==1.0.0"
                install "python-multipart==0.0.6"
                install "openai==1.59.6"
                install "websockets>=12.0"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
